*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 Inter,system-ui,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}a{color:var(--brand)}.app{display:grid;grid-template-columns:255px 1fr;min-height:100vh}.side{height:100vh;position:sticky;top:0;background:#092f22;color:#ebfff3;padding:16px 13px;display:flex;flex-direction:column}.brand{display:flex;gap:10px;align-items:center;font-weight:900;padding:6px 8px 20px}.mark{width:38px;height:38px;border-radius:11px;background:#ddf7e8;color:#0c5338;display:grid;place-items:center}.nav{display:grid;gap:5px}.nav button{border:0;background:transparent;color:#c8ded1;padding:11px;border-radius:9px;text-align:left}.nav button.active,.nav button:hover{background:#15543e;color:#fff}.side small{margin-top:auto;color:#aaceb9;border-top:1px solid #1d583f;padding:14px 8px}.main{min-width:0}.top{height:69px;position:sticky;top:0;z-index:12;background:color-mix(in srgb,var(--card) 93%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 20px;gap:10px}.top h1{font-size:1.05rem;margin:0}.spacer{flex:1}.btn{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:9px;padding:9px 12px;font-weight:730}.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}.content{padding:20px;max-width:1450px;margin:auto}.head{display:flex;justify-content:space-between;align-items:end;gap:14px;margin-bottom:17px}.head h2{font-size:1.8rem;letter-spacing:-.035em;margin:0}.head p{color:var(--muted);margin:4px 0 0}.notice{padding:12px 14px;background:color-mix(in srgb,var(--accent) 15%,var(--card));border:1px solid color-mix(in srgb,var(--accent) 45%,var(--line));border-radius:11px;margin-bottom:15px}.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:13px}.kpi{padding:17px}.kpi strong{display:block;font-size:1.85rem}.kpi span,.muted{color:var(--muted)}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}.panel{padding:17px}.panel h3{margin:0 0 12px}.rates{width:100%;border-collapse:collapse}.rates th,.rates td{text-align:left;border-bottom:1px solid var(--line);padding:10px}.rates th{color:var(--muted);font-size:.78rem;text-transform:uppercase}.productgrid,.regimegrid{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}.product,.regime{padding:17px}.product h3,.regime h3{margin:0 0 5px}.tag{display:inline-block;padding:4px 8px;border-radius:99px;background:var(--soft);color:var(--muted);font-size:.78rem}.calc{display:grid;grid-template-columns:.8fr 1.2fr;gap:14px}.form{padding:18px;display:grid;gap:11px}.field{display:grid;gap:5px}.field label{font-weight:720}.field input,.field select{width:100%;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:9px;padding:10px}.flows{display:grid;gap:7px}.flow{display:grid;grid-template-columns:80px 1fr 38px;gap:7px;align-items:center}.flow button{border:0;background:var(--soft);color:var(--bad);border-radius:8px;height:36px}.result{padding:18px}.resultgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.metric{padding:16px;background:var(--soft);border-radius:12px}.metric strong{display:block;font-size:1.65rem}.interpret{margin-top:13px;padding:13px;border-left:4px solid var(--brand);background:var(--soft);border-radius:9px}.calendar{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.event{padding:15px}.date{font-size:1.35rem;font-weight:900;color:var(--brand)}.event h3{margin:4px 0}.source{font-size:.8rem;color:var(--muted);margin-top:8px}.source a{word-break:break-all}.hidden{display:none!important}.menu{display:none}.tooltip{border-bottom:1px dotted var(--muted)}
@media(max-width:1050px){.kpis{grid-template-columns:repeat(2,1fr)}.productgrid,.regimegrid,.calendar{grid-template-columns:repeat(2,1fr)}.calc{grid-template-columns:1fr}}@media(max-width:760px){.app{grid-template-columns:1fr}.side{position:fixed;left:-270px;width:255px;z-index:30;transition:.2s}.side.open{left:0}.menu{display:block}.content{padding:14px}.grid2,.productgrid,.regimegrid,.calendar,.kpis{grid-template-columns:1fr}.head{align-items:start;flex-direction:column}.resultgrid{grid-template-columns:1fr}}

.econgrid{display:grid;grid-template-columns:.9fr 1.1fr;gap:14px}.theorygrid{display:grid;grid-template-columns:repeat(2,1fr);gap:13px}.theory{padding:17px}.theory h3{margin:0 0 8px}.formula{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;background:var(--soft);padding:10px;border-radius:9px;margin:8px 0;overflow:auto}.canvasbox{padding:16px}.canvasbox canvas{width:100%;height:360px;display:block;background:var(--card);border-radius:10px}.inputgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.resultline{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}.resultline:last-child{border:0}.info-square{aspect-ratio:1/1;min-height:260px;padding:22px;display:flex;flex-direction:column;justify-content:center;background:linear-gradient(145deg,color-mix(in srgb,var(--brand) 13%,var(--card)),var(--card))}.info-square h3{font-size:1.25rem;margin:0 0 10px}.info-square p{color:var(--muted)}.pill{display:inline-block;padding:4px 8px;border-radius:999px;background:var(--soft);color:var(--brand);font-weight:750;font-size:.78rem}.elastic-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}.elastic-card{padding:15px}.elastic-card canvas{width:100%;height:210px;display:block}.warning{color:var(--bad);font-weight:720}.success{color:var(--brand);font-weight:720}
@media(max-width:1050px){.econgrid,.theorygrid,.elastic-grid{grid-template-columns:1fr}.info-square{aspect-ratio:auto}.inputgrid{grid-template-columns:1fr}}

<body><div class="app"><aside class="side" id="side"><div class="brand"><span class="mark">OD</span><span>Finanzas Chile<br><small style="border:0;padding:0">Business Lab 2026</small></span></div><nav class="nav" id="nav"><button class="active" data-page="overview">▦ Panorama bancario</button><button data-page="products">▣ Productos financieros</button><button data-page="calculator">∑ VAN y TIR</button><button data-page="calendar">◫ Calendario tributario</button><button data-page="regimes">§ Regímenes tributarios</button><button data-page="micro">⌁ Microeconomía</button><button data-page="islm">⌗ IS-LM y consumo</button><button data-page="sources">↗ Fuentes oficiales</button></nav><small>Información educativa. Verifique condiciones, fechas y régimen particular antes de decidir.</small></aside><main class="main"><header class="top"><button class="btn menu" id="menu">☰</button><h1 id="title">Panorama bancario</h1><div class="spacer"></div><button class="btn" id="theme">◐ Tema</button><a class="btn primary" href="opendirectory-business-model-canvas.html">Business Lab</a></header><section class="content" id="view"></section></main></div>
<script>
(()=>{const $=s=>document.querySelector(s),fmt=n=>new Intl.NumberFormat('es-CL',{style:'currency',currency:'CLP',maximumFractionDigits:0}).format(n),pct=n=>Number.isFinite(n)?(n*100).toFixed(2)+'%':'No calculable';let page=location.hash.slice(1)||'overview';
const official={bc:'https://www.bcentral.cl/areas/estadisticas/tasas-de-interes',bcReport:'https://www.bcentral.cl/contenido/-/detalle/publicaciones/estadistica/informe-mensual-de-estadisticas-monetarias-y-financieras-septiembre-2026',cmf:'https://www.cmfchile.cl/educa/621/w3-propertyname-735.html',cmfData:'https://best.cmfchile.cl/',siiCal:'https://misiir.sii.cl/cgi_calendario/calendario.cgi',siiDJ:'https://www.sii.cl/destacados/renta/2026/documents/Calendario_Vencimiento_Principales_DDJJ.pdf',siiReg:'https://www.sii.cl/destacados/modernizacion/tipos_regimenes_mt.html',sii2026:'https://www.sii.cl/destacados/renta/2026/intermediarios/regimenes_tributarios/'};
function head(t,s){return `<div class="head"><div><h2>${t}</h2><p>${s}</p></div></div><div class="notice"><b>Corte informativo:</b> 29 de octubre de 2026. Las tasas son promedios del sistema, no ofertas vinculantes. Las obligaciones tributarias dependen del contribuyente y del medio de pago.</div>`}
function overview(){return `${head('Panorama bancario chileno','Indicadores oficiales para contextualizar decisiones empresariales.')}<div class="kpis"><div class="card kpi"><strong>4,5%</strong><span>TPM vigente al 29-10-2026</span></div><div class="card kpi"><strong>8,4%</strong><span>Crédito comercial, promedio septiembre</span></div><div class="card kpi"><strong>25,9%</strong><span>Crédito de consumo, promedio septiembre</span></div><div class="card kpi"><strong>4,1%</strong><span>Crédito de vivienda, promedio septiembre</span></div></div><div class="grid2"><div class="card panel"><h3>Tasas promedio del sistema, septiembre 2026</h3><table class="rates"><thead><tr><th>Segmento</th><th>Tasa</th><th>Lectura</th></tr></thead><tbody><tr><td>Comercial total</td><td>8,4%</td><td>Promedio ponderado</td></tr><tr><td>Comercial en cuotas</td><td>6,2%</td><td>Producto específico</td></tr><tr><td>Comercio exterior</td><td>5,8%</td><td>Promedio del segmento</td></tr><tr><td>Consumo en cuotas</td><td>14,5%</td><td>No equivale al costo total de una oferta</td></tr><tr><td>Rotativo tarjeta</td><td>33,2%</td><td>Alto costo relativo</td></tr></tbody></table><p class="source">Fuente: <a href="${official.bc}" target="_blank">Banco Central de Chile, tasas de interés</a>.</p></div><div class="card panel"><h3>Instituciones y supervisión</h3><p>La <b>Comisión para el Mercado Financiero</b> mantiene datos de bancos, cooperativas y emisores. Entre las instituciones vigentes listadas en su base se encuentran Banco de Chile, BancoEstado, BCI, Santander-Chile, Scotiabank Chile, Itaú Chile, Banco BICE, Banco Security, Banco Falabella, Banco Ripley, Banco Consorcio y Tenpo.</p><p class="muted">La tabla no compara ofertas individuales. Para contratar, revise CAE, costo total del crédito, comisiones, seguros, garantías y condiciones de prepago.</p><p class="source">Fuentes: <a href="${official.cmfData}" target="_blank">CMF BEST+</a> y base bancaria CMF.</p></div></div>`}
const products=[['Cuenta corriente','Pagos, transferencias, cheques y líneas asociadas.','Liquidez'],['Cuenta vista','Operación transaccional sin crédito automático.','Tesorería'],['Tarjeta de crédito','Compras y capital de trabajo de corto plazo.','Crédito'],['Crédito comercial','Financia inversión o capital de trabajo.','Empresa'],['Línea de crédito','Cobertura de déficits transitorios de caja.','Corto plazo'],['Depósito a plazo','Colocación de excedentes de tesorería.','Ahorro'],['Crédito hipotecario','Compra o construcción de inmuebles.','Largo plazo'],['Factoring','Anticipo sobre facturas por cobrar.','Cuentas por cobrar'],['Leasing','Uso financiado de activos con opción de compra.','Activo fijo'],['Boleta de garantía','Respalda obligaciones frente a mandantes.','Garantía'],['Carta de crédito','Instrumento para comercio exterior.','Comercio exterior'],['Fondos mutuos','Inversión colectiva con riesgo variable.','Inversión']];
function productsPage(){return `${head('Productos financieros disponibles','Mapa educativo de categorías habituales en Chile durante 2026.')}<div class="productgrid">${products.map(x=>`<article class="card product"><span class="tag">${x[2]}</span><h3>${x[0]}</h3><p class="muted">${x[1]}</p><p><b>Verifique:</b> tasa, CAE, comisiones, plazo, garantías, moneda y rescate.</p></article>`).join('')}</div><div class="notice" style="margin-top:14px">La disponibilidad concreta depende de evaluación comercial, tamaño, antigüedad, flujo, garantías y políticas de cada institución. Fuente conceptual: <a href="${official.cmf}" target="_blank">CMF Educa, productos bancarios</a>.</div>`}
function calculator(){return `${head('Calculadora VAN y TIR','Evalúa flujos periódicos. Usa una tasa de descuento coherente con riesgo, moneda y periodicidad.')}<div class="calc"><form class="card form" id="calcForm"><div class="field"><label>Inversión inicial (CLP)</label><input id="initial" type="number" value="10000000" min="0" step="1000"></div><div class="field"><label>Tasa de descuento anual (%)</label><input id="discount" type="number" value="12" step="0.01"></div><div class="field"><label>Periodicidad</label><select id="frequency"><option value="1">Anual</option><option value="12">Mensual</option><option value="4">Trimestral</option></select></div><div><b>Flujos futuros</b><div class="flows" id="flows"></div><button class="btn" type="button" id="addFlow">+ Agregar período</button></div><button class="btn primary">Calcular</button></form><div class="card result"><h3>Resultado</h3><div class="resultgrid"><div class="metric"><span>VAN</span><strong id="npv">-</strong></div><div class="metric"><span>TIR por período</span><strong id="irr">-</strong></div><div class="metric"><span>TIR anual equivalente</span><strong id="irrAnnual">-</strong></div><div class="metric"><span>Decisión mecánica</span><strong id="decision">-</strong></div></div><div class="interpret" id="explain">Ingresa los flujos y calcula. VAN &gt; 0 crea valor respecto de la tasa elegida. La TIR puede ser inexistente o múltiple cuando los flujos cambian de signo más de una vez.</div></div></div>`}
function npv(rate,flows){return flows.reduce((s,x,i)=>s+x/Math.pow(1+rate,i),0)}function irr(flows){let low=-.9999,high=10,fl=npv(low,flows),fh=npv(high,flows);if(!Number.isFinite(fl)||!Number.isFinite(fh)||fl*fh>0)return NaN;for(let i=0;i<250;i++){const mid=(low+high)/2,fm=npv(mid,flows);if(Math.abs(fm)<1e-7)return mid;if(fl*fm<=0){high=mid;fh=fm}else{low=mid;fl=fm}}return (low+high)/2}
const calendarEvents=[['30 ene','DJ 1959','Primer vencimiento principal de DDJJ empresas 2026.'],['3 mar','DJ 1811, 1822 y otras','Grupo de declaraciones juradas anuales.'],['16 mar','DJ 1870, 1871, 1873, 1890 y otras','Incluye DJ 1948 para sociedades anónimas abiertas.'],['23 mar','Grupo amplio de DDJJ','Incluye 1812, 1832, 1862, 1895, 1897, 1899 y otras.'],['24 mar','DDJJ y DJ 1948','DJ 1948 para sociedades con socios personas jurídicas.'],['27 mar','DDJJ y DJ 1947/1948','Fechas relevantes para sociedades con socios personas naturales.'],['30 mar','DJ 1922','Bancos, corredores de bolsa o intermediarios.'],['5 may','DJ 1962','Vencimiento principal informado por SII.'],['15 may','DJ 1837','Vencimiento principal informado por SII.'],['30 jun','Grupo de DDJJ','Incluye 1847, 1866, 1867, 1907 y otras.'],['31 jul','DJ 1959','Segundo vencimiento indicado para este formulario.'],['Mensual','F29 y F50','Consultar el día exacto según mes, tipo de pago y condición del contribuyente.']];
function calendar(){return `${head('Calendario contable y tributario 2026','Fechas seleccionadas. No sustituye el calendario personalizado del SII.')}<div class="calendar">${calendarEvents.map(x=>`<article class="card event"><div class="date">${x[0]}</div><h3>${x[1]}</h3><p class="muted">${x[2]}</p></article>`).join('')}</div><div class="notice" style="margin-top:14px">Además de estas fechas, una empresa puede tener obligaciones mensuales de F29, F50, remuneraciones, cotizaciones previsionales, libros, contribuciones y permisos. Confirma el vencimiento en el <a href="${official.siiCal}" target="_blank">Calendario Tributario 2026 del SII</a>.</div>`}
const regimes=[['Pro Pyme General','Pyme con base generalmente sobre ingresos percibidos y gastos pagados. Para AT 2026 el SII informa IDPC de 12,5%.','Promedio ingresos 3 años hasta 75.000 UF; límites y relaciones aplican.'],['Pro Pyme Transparente','La empresa queda liberada de IDPC y la base se asigna a propietarios afectos a impuestos finales.','Solo propietarios elegibles; DJ 1947 según forma jurídica.'],['Régimen General semiintegrado','Régimen general del artículo 14 A, con contabilidad completa y registros empresariales.','Adecuado cuando no se cumplen requisitos Pyme o por estructura.'],['Renta Presunta','Base presunta para actividades y contribuyentes que cumplen requisitos legales.','No es una elección universal; revisar topes y actividad.'],['No sujetos al artículo 14','Entidades o contribuyentes fuera de los regímenes empresariales del artículo 14.','La clasificación depende de naturaleza jurídica y rentas.']];
function regimesPage(){return `${head('Regímenes tributarios empresariales','Resumen orientativo para 2026. La selección correcta requiere revisar actividad, ingresos, propietarios y rentas pasivas.')}<div class="regimegrid">${regimes.map(x=>`<article class="card regime"><h3>${x[0]}</h3><p>${x[1]}</p><p class="muted"><b>Punto crítico:</b> ${x[2]}</p></article>`).join('')}</div><div class="notice" style="margin-top:14px"><b>Advertencia Pro Pyme:</b> el SII ha indicado que intereses de depósitos a plazo y otros instrumentos que califiquen como capital mobiliario computan para el límite de 35% de ciertas rentas pasivas. Revise su situación en MiSII y con un asesor tributario.</div>`}

function microPage(){return `${head('Laboratorio de equilibrio microeconómico','Modelo lineal de oferta y demanda, impuesto específico, excedentes y elasticidad. Inspirado en la exposición introductoria habitual de Mankiw, sin reproducir texto del libro.')}<div class="theorygrid"><article class="card info-square"><span class="pill">Origen conceptual</span><h3>¿De dónde surge el punto de equilibrio?</h3><p>Surge donde la cantidad que los consumidores desean comprar coincide con la que los productores desean vender. Algebraicamente, si <b>Qd = a - bP</b> y <b>Qs = c + dP</b>, el equilibrio satisface <b>Qd = Qs</b>.</p><div class="formula">P* = (a - c) / (b + d)<br>Q* = a - bP*</div></article><article class="card info-square"><span class="pill">Supuesto metodológico</span><h3>Ceteris paribus</h3><p>Significa “manteniendo constantes las demás variables”. Permite aislar la relación entre precio y cantidad. Si cambian ingreso, preferencias, costos, tecnología o expectativas, la curva correspondiente se desplaza y ya no se está comparando sobre la misma función.</p><p class="warning">No significa que el mundo sea estático. Es una condición analítica para identificar efectos parciales.</p></article></div><div class="econgrid" style="margin-top:14px"><form class="card form" id="microForm"><h3>Calculadora oferta-demanda</h3><div class="formula">Qd = a - bP<br>Qs = c + dP</div><div class="inputgrid"><div class="field"><label>a: intercepto demanda</label><input id="da" type="number" value="120" step="0.1"></div><div class="field"><label>b: pendiente demanda</label><input id="db" type="number" value="2" min="0.0001" step="0.1"></div><div class="field"><label>c: intercepto oferta</label><input id="sc" type="number" value="20" step="0.1"></div><div class="field"><label>d: pendiente oferta</label><input id="sd" type="number" value="3" min="0.0001" step="0.1"></div><div class="field"><label>Impuesto específico por unidad</label><input id="tax" type="number" value="10" min="0" step="0.1"></div><div class="field"><label>Punto para elasticidad: precio</label><input id="elasticPrice" type="number" value="20" min="0" step="0.1"></div></div><button class="btn primary">Calcular equilibrio</button><div id="microResults"></div></form><div class="card canvasbox"><h3>Oferta, demanda y cuña tributaria</h3><canvas id="marketChart" width="760" height="420" aria-label="Gráfico de oferta y demanda"></canvas><p class="muted">El gráfico usa precio en eje vertical y cantidad en eje horizontal. El impuesto desplaza la oferta inversa hacia arriba en <i>t</i>.</p></div></div><div class="theorygrid" style="margin-top:14px"><article class="card theory"><h3>Demanda, oferta y consumidor</h3><p><b>Demanda:</b> relación entre precio y cantidad demandada, ceteris paribus. <b>Oferta:</b> relación entre precio y cantidad ofrecida. <b>Consumidor:</b> el excedente mide la diferencia entre disposición a pagar y precio efectivamente pagado.</p><div class="formula">Excedente consumidor = ½ × Q* × (Pmáx - P*)<br>Excedente productor = ½ × Q* × (P* - Pmín)</div></article><article class="card theory"><h3>Equilibrio con impuesto</h3><p>Con impuesto específico <b>t</b>, el comprador paga <b>Pc</b> y el vendedor recibe <b>Pp = Pc - t</b>. La incidencia económica depende de elasticidades, no de quién entrega formalmente el impuesto.</p><div class="formula">a - b·Pc = c + d·(Pc - t)<br>Recaudación = t × Qt<br>Pérdida irrecuperable ≈ ½ × t × (Q* - Qt)</div></article></div><section style="margin-top:14px"><div class="head"><div><h2>Elasticidad e inelasticidad</h2><p>Visualizaciones conceptuales y calculadora puntual.</p></div></div><div class="elastic-grid"><article class="card elastic-card"><h3>Demanda elástica</h3><canvas data-elastic="elastic" width="360" height="220"></canvas><p>|Ed| &gt; 1: la cantidad responde proporcionalmente más que el precio.</p></article><article class="card elastic-card"><h3>Demanda inelástica</h3><canvas data-elastic="inelastic" width="360" height="220"></canvas><p>|Ed| &lt; 1: la cantidad responde proporcionalmente menos que el precio.</p></article><article class="card elastic-card"><h3>Elasticidad unitaria</h3><canvas data-elastic="unit" width="360" height="220"></canvas><p>|Ed| = 1: la respuesta proporcional coincide aproximadamente.</p></article></div><div class="card panel" style="margin-top:13px"><h3>Base algebraica</h3><p>Para demanda lineal <b>Q = a - bP</b>, la elasticidad-precio puntual es:</p><div class="formula">Ed = (dQ/dP) × (P/Q) = -b × (P/Q)</div><p>En una misma recta, la elasticidad varía según el punto: suele ser más elástica cerca del intercepto de precio y menos elástica cerca del intercepto de cantidad.</p></div></section>`}
function islmPage(){return `${head('Curvas IS-LM y propensión marginal a consumir','Modelo algebraico con controles de política fiscal y monetaria, comparación antes-después y ejemplos numéricos desarrollados.')}<div class="theorygrid"><article class="card info-square"><span class="pill">Mercado de bienes</span><h3>Curva IS</h3><p>La IS se desplaza a la derecha cuando aumenta el gasto autónomo: mayor G, mayor C₀, mayor I₀ o menores impuestos T. Se desplaza a la izquierda ante el movimiento contrario.</p><div class="formula">IS: i = [A - (1-c)Y] / b<br>A = C₀ - cT + I₀ + G</div></article><article class="card info-square"><span class="pill">Mercado monetario</span><h3>Curva LM</h3><p>La LM se desplaza a la derecha o hacia abajo cuando aumenta la oferta monetaria real M/P. Una contracción monetaria la desplaza a la izquierda o hacia arriba.</p><div class="formula">LM: i = [kY - M/P] / h</div></article></div><div class="econgrid" style="margin-top:14px"><form class="card form" id="islmForm"><h3>Calculadora y desplazamientos</h3><div class="inputgrid"><div class="field"><label>Consumo autónomo C₀</label><input id="c0" type="number" value="50"></div><div class="field"><label>PMC c</label><input id="mpc" type="number" value="0.75" min="0" max="0.99" step="0.01"></div><div class="field"><label>Impuestos T</label><input id="tval" type="number" value="40"></div><div class="field"><label>Inversión autónoma I₀</label><input id="i0" type="number" value="120"></div><div class="field"><label>Sensibilidad inversión b</label><input id="ib" type="number" value="20" min="0.0001"></div><div class="field"><label>Gasto público G</label><input id="g" type="number" value="100"></div><div class="field"><label>Oferta monetaria real M/P</label><input id="mr" type="number" value="200"></div><div class="field"><label>Sensibilidad dinero a Y, k</label><input id="k" type="number" value="0.5" min="0.0001" step="0.01"></div><div class="field"><label>Sensibilidad dinero a i, h</label><input id="h" type="number" value="40" min="0.0001"></div></div><h3 style="margin-top:12px">Choques para desplazar curvas</h3><div class="inputgrid"><div class="field"><label>ΔG, desplazamiento fiscal</label><input id="deltaG" type="number" value="40" step="1"><small class="muted">Positivo desplaza IS a la derecha.</small></div><div class="field"><label>Δ(M/P), desplazamiento monetario</label><input id="deltaM" type="number" value="60" step="1"><small class="muted">Positivo desplaza LM a la derecha/abajo.</small></div></div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn primary">Calcular escenario</button><button class="btn" id="onlyFiscal" type="button">Solo expansión fiscal</button><button class="btn" id="onlyMoney" type="button">Solo expansión monetaria</button><button class="btn" id="resetShock" type="button">Sin choque</button></div><div id="islmResults"></div></form><div class="card canvasbox"><h3>Equilibrio inicial y curvas desplazadas</h3><canvas id="islmChart" width="760" height="440"></canvas><p class="muted">Líneas continuas: escenario inicial. Líneas discontinuas: curvas después de aplicar ΔG y Δ(M/P). E₀ es el equilibrio inicial y E₁ el nuevo equilibrio.</p></div></div><div class="theorygrid" style="margin-top:14px"><article class="card theory"><h3>Propensión marginal a consumir</h3><p>La PMC mide cuánto aumenta el consumo cuando el ingreso disponible aumenta en una unidad.</p><div class="formula">PMC = ΔC / ΔYd<br>PMA = 1 - PMC<br>Multiplicador simple = 1 / (1 - PMC)</div></article><article class="card theory"><h3>Lectura de política</h3><p>Una expansión fiscal eleva Y y normalmente i, generando desplazamiento parcial de inversión privada. Una expansión monetaria eleva Y y reduce i en este modelo. Si ambas políticas son expansivas, el efecto sobre i depende de sus magnitudes y parámetros.</p></article></div><div style="margin-top:14px">${head('Ejemplos numéricos paso a paso','Derivación algebraica con los parámetros iniciales de la calculadora.')}</div><div class="theorygrid"><article class="card theory"><h3>Ejemplo 1: equilibrio inicial</h3><div class="formula">C = 50 + 0,75(Y - 40)<br>I = 120 - 20i<br>G = 100<br>M/P = 200; L = 0,5Y - 40i</div><ol><li>Gasto autónomo: A = 50 - 0,75×40 + 120 + 100 = <b>240</b>.</li><li>IS: Y = 240 + 0,75Y - 20i.</li><li>Reordenando: 0,25Y = 240 - 20i, luego <b>i = 12 - 0,0125Y</b>.</li><li>LM: 200 = 0,5Y - 40i, luego <b>i = 0,0125Y - 5</b>.</li><li>Igualando: 12 - 0,0125Y = 0,0125Y - 5.</li><li>17 = 0,025Y, por tanto <b>Y* = 680</b> e <b>i* = 3,5</b>.</li></ol></article><article class="card theory"><h3>Ejemplo 2: expansión fiscal ΔG = 40</h3><ol><li>El gasto autónomo sube de 240 a <b>280</b>.</li><li>Nueva IS: i = [280 - 0,25Y] / 20 = <b>14 - 0,0125Y</b>.</li><li>LM permanece: i = 0,0125Y - 5.</li><li>Igualando: 14 - 0,0125Y = 0,0125Y - 5.</li><li>19 = 0,025Y, entonces <b>Y₁ = 760</b>.</li><li>i₁ = 0,0125×760 - 5 = <b>4,5</b>.</li><li>Resultado: ΔY = +80 y Δi = +1. La tasa mayor modera parte de la expansión mediante inversión.</li></ol></article><article class="card theory"><h3>Ejemplo 3: expansión monetaria Δ(M/P) = 60</h3><ol><li>La oferta monetaria real sube de 200 a <b>260</b>.</li><li>IS permanece: i = 12 - 0,0125Y.</li><li>Nueva LM: i = [0,5Y - 260] / 40 = <b>0,0125Y - 6,5</b>.</li><li>Igualando: 12 - 0,0125Y = 0,0125Y - 6,5.</li><li>18,5 = 0,025Y, entonces <b>Y₁ = 740</b>.</li><li>i₁ = 12 - 0,0125×740 = <b>2,75</b>.</li><li>Resultado: ΔY = +60 y Δi = -0,75.</li></ol></article><article class="card theory"><h3>Ejemplo 4: ambas expansiones</h3><ol><li>A sube a 280 y M/P sube a 260.</li><li>Nueva IS: i = 14 - 0,0125Y.</li><li>Nueva LM: i = 0,0125Y - 6,5.</li><li>Igualando: 20,5 = 0,025Y.</li><li><b>Y₁ = 820</b>.</li><li><b>i₁ = 3,75</b>.</li><li>Frente al equilibrio inicial: ΔY = +140 y Δi = +0,25. La expansión monetaria limita el aumento de la tasa causado por la política fiscal.</li></ol></article></div><div class="notice" style="margin-top:14px"><b>Rigor:</b> estos ejemplos usan unidades abstractas y tasas en puntos del modelo. No son una calibración de Chile. El multiplicador IS-LM es menor que el multiplicador keynesiano simple porque la tasa de interés responde endógenamente.</div>`}
function drawAxes(ctx,w,h,xlab,ylab){ctx.clearRect(0,0,w,h);ctx.strokeStyle='#7a8a80';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(55,20);ctx.lineTo(55,h-42);ctx.lineTo(w-20,h-42);ctx.stroke();ctx.fillStyle='#65736a';ctx.font='13px system-ui';ctx.fillText(ylab,12,22);ctx.fillText(xlab,w-75,h-12)}
function line(ctx,points,color,label){ctx.strokeStyle=color;ctx.lineWidth=3;ctx.beginPath();points.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.stroke();ctx.fillStyle=color;ctx.font='bold 13px system-ui';const p=points[points.length-1];ctx.fillText(label,p[0]-45,p[1]-8)}
function bindMicro(){const f=$('#microForm');function calc(){const a=+$ ('#da').value,b=+$ ('#db').value,c=+$ ('#sc').value,d=+$ ('#sd').value,t=+$ ('#tax').value,pE=+$ ('#elasticPrice').value;if(!(b>0&&d>0&&a>c)){ $('#microResults').innerHTML='<p class="warning">Requiere b y d positivos, y a mayor que c.</p>';return}const p=(a-c)/(b+d),q=a-b*p,pc=(a-c+d*t)/(b+d),pp=pc-t,qt=a-b*pc,pmax=a/b,pmin=-c/d,cs=.5*q*(pmax-p),ps=.5*q*(p-pmin),taxRev=t*Math.max(0,qt),dwl=.5*t*Math.max(0,q-qt),qPoint=a-b*pE,ed=qPoint!==0?-b*pE/qPoint:NaN;$('#microResults').innerHTML=`<div class="resultline"><span>Equilibrio sin impuesto P*</span><b>${p.toFixed(2)}</b></div><div class="resultline"><span>Cantidad Q*</span><b>${q.toFixed(2)}</b></div><div class="resultline"><span>Precio comprador Pc</span><b>${pc.toFixed(2)}</b></div><div class="resultline"><span>Precio productor Pp</span><b>${pp.toFixed(2)}</b></div><div class="resultline"><span>Cantidad con impuesto Qt</span><b>${qt.toFixed(2)}</b></div><div class="resultline"><span>Recaudación</span><b>${taxRev.toFixed(2)}</b></div><div class="resultline"><span>Pérdida irrecuperable</span><b>${dwl.toFixed(2)}</b></div><div class="resultline"><span>Excedente consumidor inicial</span><b>${cs.toFixed(2)}</b></div><div class="resultline"><span>Excedente productor inicial</span><b>${ps.toFixed(2)}</b></div><div class="resultline"><span>Elasticidad puntual Ed</span><b>${Number.isFinite(ed)?ed.toFixed(3):'No definida'}</b></div>`;drawMarket({a,b,c,d,t,p,q,pc,pp,qt})}f.onsubmit=e=>{e.preventDefault();calc()};calc();document.querySelectorAll('[data-elastic]').forEach(drawElastic)}
function drawMarket(x){const cv=$('#marketChart'),ctx=cv.getContext('2d'),w=cv.width,h=cv.height;drawAxes(ctx,w,h,'Cantidad Q','Precio P');const maxQ=Math.max(x.a,x.c+x.d*(x.a/x.b+x.t))*1.08,maxP=(x.a/x.b+x.t)*1.15,px=q=>55+q/maxQ*(w-85),py=p=>h-42-p/maxP*(h-70);const qs=Array.from({length:80},(_,i)=>i/79*maxQ);line(ctx,qs.map(q=>[px(q),py((x.a-q)/x.b)]),'#b33f49','Demanda');line(ctx,qs.map(q=>[px(q),py((q-x.c)/x.d)]),'#176b4d','Oferta');line(ctx,qs.map(q=>[px(q),py((q-x.c)/x.d+x.t)]),'#2676ad','Oferta + impuesto');ctx.setLineDash([5,4]);ctx.strokeStyle='#e7ad3d';ctx.beginPath();ctx.moveTo(px(x.qt),py(x.pc));ctx.lineTo(px(x.qt),py(x.pp));ctx.stroke();ctx.setLineDash([]);ctx.fillStyle='#17231c';[[x.q,x.p,'E'],[x.qt,x.pc,'Pc'],[x.qt,x.pp,'Pp']].forEach(z=>{ctx.beginPath();ctx.arc(px(z[0]),py(z[1]),5,0,Math.PI*2);ctx.fill();ctx.fillText(z[2],px(z[0])+7,py(z[1])-7)})}
function drawElastic(cv){const ctx=cv.getContext('2d'),w=cv.width,h=cv.height;drawAxes(ctx,w,h,'Q','P');const type=cv.dataset.elastic,color=type==='elastic'?'#2676ad':type==='inelastic'?'#b33f49':'#176b4d';let pts;if(type==='elastic')pts=[[65,48],[w-25,h-55]];else if(type==='inelastic')pts=[[w*.45,30],[w*.62,h-48]];else pts=Array.from({length:50},(_,i)=>{const q=30+i*5,p=780/(q+10);return [55+q/300*(w-80),h-42-p/28*(h-70)]});line(ctx,pts,color,'D')}
function bindISLM(){const f=$('#islmForm');function read(){return{C0:+$('#c0').value,c:+$('#mpc').value,T:+$('#tval').value,I0:+$('#i0').value,b:+$('#ib').value,G:+$('#g').value,Mr:+$('#mr').value,k:+$('#k').value,h:+$('#h').value,dG:+$('#deltaG').value,dM:+$('#deltaM').value}}function equilibrium(v,G,Mr){const A=v.C0-v.c*v.T+v.I0+G,denom=(1-v.c)+v.b*v.k/v.h,Y=(A+v.b*Mr/v.h)/denom,i=(v.k*Y-Mr)/v.h;return{A,Y,i,G,Mr}}function calc(){const v=read();if(!(v.c>=0&&v.c<1&&v.b>0&&v.k>0&&v.h>0)){ $('#islmResults').innerHTML='<p class="warning">PMC debe estar entre 0 y 1; b, k y h deben ser positivos.</p>';return}const e0=equilibrium(v,v.G,v.Mr),e1=equilibrium(v,v.G+v.dG,v.Mr+v.dM),mult=1/(1-v.c),mps=1-v.c;$('#islmResults').innerHTML=`<div class="resultline"><span>Equilibrio inicial Y₀ / i₀</span><b>${e0.Y.toFixed(2)} / ${e0.i.toFixed(2)}</b></div><div class="resultline"><span>Nuevo equilibrio Y₁ / i₁</span><b>${e1.Y.toFixed(2)} / ${e1.i.toFixed(2)}</b></div><div class="resultline"><span>Cambio ΔY</span><b class="${e1.Y>=e0.Y?'success':'warning'}">${(e1.Y-e0.Y).toFixed(2)}</b></div><div class="resultline"><span>Cambio Δi</span><b>${(e1.i-e0.i).toFixed(2)}</b></div><div class="resultline"><span>PMC / PMA</span><b>${v.c.toFixed(2)} / ${mps.toFixed(2)}</b></div><div class="resultline"><span>Multiplicador simple</span><b>${mult.toFixed(2)}</b></div><div class="formula">IS₀: i = [${e0.A.toFixed(2)} - ${(1-v.c).toFixed(2)}Y] / ${v.b.toFixed(2)}<br>IS₁: i = [${e1.A.toFixed(2)} - ${(1-v.c).toFixed(2)}Y] / ${v.b.toFixed(2)}<br>LM₀: i = [${v.k.toFixed(2)}Y - ${v.Mr.toFixed(2)}] / ${v.h.toFixed(2)}<br>LM₁: i = [${v.k.toFixed(2)}Y - ${(v.Mr+v.dM).toFixed(2)}] / ${v.h.toFixed(2)}</div>`;drawISLM({v,e0,e1})}f.onsubmit=e=>{e.preventDefault();calc()};$('#onlyFiscal').onclick=()=>{$('#deltaG').value=40;$('#deltaM').value=0;calc()};$('#onlyMoney').onclick=()=>{$('#deltaG').value=0;$('#deltaM').value=60;calc()};$('#resetShock').onclick=()=>{$('#deltaG').value=0;$('#deltaM').value=0;calc()};['deltaG','deltaM'].forEach(id=>$('#'+id).oninput=calc);calc()}
function drawISLM(x){const cv=$('#islmChart'),ctx=cv.getContext('2d'),w=cv.width,h=cv.height,{v,e0,e1}=x;drawAxes(ctx,w,h,'Ingreso Y','Interés i');const is0=y=>(e0.A-(1-v.c)*y)/v.b,is1=y=>(e1.A-(1-v.c)*y)/v.b,lm0=y=>(v.k*y-v.Mr)/v.h,lm1=y=>(v.k*y-e1.Mr)/v.h,maxY=Math.max(e0.Y,e1.Y,e0.A/(1-v.c),e1.A/(1-v.c))*1.3,vals=Array.from({length:120},(_,j)=>j/119*maxY),all=vals.flatMap(y=>[is0(y),is1(y),lm0(y),lm1(y)]),minI=Math.min(...all),maxI=Math.max(...all),range=Math.max(.001,maxI-minI),px=y=>55+y/maxY*(w-80),py=i=>h-42-(i-minI)/range*(h-70);line(ctx,vals.map(y=>[px(y),py(is0(y))]),'#b33f49','IS₀');line(ctx,vals.map(y=>[px(y),py(lm0(y))]),'#176b4d','LM₀');ctx.setLineDash([8,6]);line(ctx,vals.map(y=>[px(y),py(is1(y))]),'#e28a22','IS₁');line(ctx,vals.map(y=>[px(y),py(lm1(y))]),'#2676ad','LM₁');ctx.setLineDash([]);[[e0,'E₀','#17231c'],[e1,'E₁','#7b39a8']].forEach(([e,label,color])=>{ctx.fillStyle=color;ctx.beginPath();ctx.arc(px(e.Y),py(e.i),6,0,Math.PI*2);ctx.fill();ctx.fillText(label,px(e.Y)+8,py(e.i)-8)});ctx.fillStyle='#65736a';ctx.font='12px system-ui';ctx.fillText(`ΔY=${(e1.Y-e0.Y).toFixed(1)}  Δi=${(e1.i-e0.i).toFixed(2)}`,60,38)}
function sources(){return `${head('Fuentes oficiales','Enlaces usados para la fotografía informativa de 2026.')}<div class="card panel"><ul><li><a href="${official.bc}" target="_blank">Banco Central de Chile: tasas de interés</a></li><li><a href="${official.bcReport}" target="_blank">Informe monetario y financiero, septiembre 2026</a></li><li><a href="${official.cmf}" target="_blank">CMF Educa: productos bancarios</a></li><li><a href="${official.cmfData}" target="_blank">CMF BEST+: datos bancarios</a></li><li><a href="${official.siiCal}" target="_blank">SII: calendario tributario 2026</a></li><li><a href="${official.siiDJ}" target="_blank">SII: principales DDJJ 2026</a></li><li><a href="${official.siiReg}" target="_blank">SII: tipos de regímenes tributarios</a></li><li><a href="${official.sii2026}" target="_blank">SII: Operación Renta 2026 y regímenes</a></li></ul><p class="muted">La página no realiza consultas en línea. Los datos no se actualizan automáticamente.</p></div>`}
const pages={overview,products:productsPage,calculator,calendar,regimes:regimesPage,micro:microPage,islm:islmPage,sources},titles={overview:'Panorama bancario',products:'Productos financieros',calculator:'Calculadora VAN y TIR',calendar:'Calendario tributario',regimes:'Regímenes tributarios',micro:'Microeconomía',islm:'IS-LM y consumo',sources:'Fuentes oficiales'};
function render(){page=location.hash.slice(1)||'overview';if(!pages[page])page='overview';$('#view').innerHTML=pages[page]();$('#title').textContent=titles[page];document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));if(page==='calculator')bindCalc();if(page==='micro')bindMicro();if(page==='islm')bindISLM()}
function bindCalc(){const flows=$('#flows');[3500000,4000000,4500000,5000000].forEach(add);function add(v=0){const i=flows.children.length+1;flows.insertAdjacentHTML('beforeend',`<div class="flow"><span>Período ${i}</span><input type="number" value="${v}" step="1000"><button type="button">×</button></div>`);flows.lastElementChild.querySelector('button').onclick=e=>{e.target.parentElement.remove();[...flows.children].forEach((x,j)=>x.querySelector('span').textContent='Período '+(j+1))}}$('#addFlow').onclick=()=>add();$('#calcForm').onsubmit=e=>{e.preventDefault();const inv=Number($('#initial').value),freq=Number($('#frequency').value),annual=Number($('#discount').value)/100,periodRate=Math.pow(1+annual,1/freq)-1,cash=[-inv,...[...flows.querySelectorAll('input')].map(x=>Number(x.value))],v=npv(periodRate,cash),r=irr(cash),annualIrr=Number.isFinite(r)?Math.pow(1+r,freq)-1:NaN;$('#npv').textContent=fmt(v);$('#irr').textContent=pct(r);$('#irrAnnual').textContent=pct(annualIrr);$('#decision').textContent=v>0?'Aceptar*':v<0?'Rechazar*':'Indiferente*';$('#explain').textContent=(v>0?'El VAN es positivo a la tasa indicada. ':'El VAN no supera el umbral indicado. ')+(Number.isFinite(r)?'La TIR es una solución numérica para estos flujos.':'No se encontró una TIR única en el intervalo evaluado.')+' *La decisión real debe incluir impuestos, capital de trabajo, riesgo y escenarios.'}}
$('#nav').onclick=e=>{const b=e.target.closest('[data-page]');if(b){location.hash=b.dataset.page;$('#side').classList.remove('open')}};window.onhashchange=render;$('#menu').onclick=()=>$('#side').classList.toggle('open');$('#theme').onclick=()=>{const d=document.documentElement.dataset.theme==='dark';document.documentElement.dataset.theme=d?'light':'dark';localStorage.setItem('od-fin-theme',d?'light':'dark')};document.documentElement.dataset.theme=localStorage.getItem('od-fin-theme')||'light';render()})();
