:root{--bg:#f4f7f5;--card:#fff;--soft:#eaf1ed;--text:#17231c;--muted:#65746a;--line:#d6e1d9;--brand:#176b4d;--brand2:#0d4934;--gold:#d99a20;--red:#b13f4b;--blue:#2677ad;--shadow:0 14px 40px rgba(20,73,48,.1);--r:16px}[data-theme=dark]{--bg:#0c1410;--card:#142019;--soft:#1c2a22;--text:#eef7f1;--muted:#9fb1a5;--line:#2b3d31;--brand:#4db989;--brand2:#329568;--gold:#f0bd59;--red:#ef7d86;--blue:#74b6e5;--shadow:0 16px 44px rgba(0,0,0,.3)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.52 Inter,system-ui,-apple-system,"Segoe UI",sans-serif}button,input,select{font:inherit}button{cursor:pointer}a{color:var(--brand);text-decoration:none}.app{display:grid;grid-template-columns:270px 1fr;min-height:100vh}.side{height:100vh;position:sticky;top:0;background:#092f22;color:#fff;padding:16px 13px;display:flex;flex-direction:column;z-index:30}.brand{display:flex;gap:10px;align-items:center;font-weight:900;padding:6px 8px 20px}.mark{width:40px;height:40px;border-radius:12px;background:#ddf7e8;color:#0c5338;display:grid;place-items:center}.nav{display:grid;gap:4px}.nav button{border:0;background:transparent;color:#cfe3d7;padding:10px 11px;border-radius:9px;text-align:left}.nav button:hover,.nav button.active{background:#16543f;color:#fff}.group{font-size:.72rem;text-transform:uppercase;letter-spacing:.1em;color:#86af98;margin:16px 9px 5px}.sidefoot{margin-top:auto;border-top:1px solid #1d583f;padding:13px 8px 0;color:#afd0bd;font-size:.8rem}.main{min-width:0}.top{height:68px;position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--card) 93%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:0 20px}.top h1{font-size:1.05rem;margin:0}.spacer{flex:1}.btn{border:1px solid var(--line);background:var(--card);color:var(--text);padding:9px 12px;border-radius:9px;font-weight:730}.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}.menu{display:none}.content{padding:20px;max-width:1500px;margin:auto}.hero{padding:24px;background:linear-gradient(135deg,color-mix(in srgb,var(--brand) 11%,var(--card)),var(--card));border:1px solid var(--line);border-radius:var(--r);margin-bottom:14px}.hero h2{font-size:2rem;margin:0 0 6px;letter-spacing:-.035em}.hero p{color:var(--muted);margin:0;max-width:950px}.notice{padding:12px 14px;background:color-mix(in srgb,var(--gold) 14%,var(--card));border:1px solid color-mix(in srgb,var(--gold) 45%,var(--line));border-radius:10px;margin:12px 0}.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.item{padding:17px}.item h3{margin:0 0 5px}.item p{color:var(--muted)}.metric{font-size:1.75rem;font-weight:900;letter-spacing:-.04em}.grid{display:grid;grid-template-columns:.82fr 1.18fr;gap:14px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.form{padding:17px;display:grid;grid-template-columns:1fr 1fr;gap:10px}.form label{display:grid;gap:5px;font-weight:680}.form input,.form select{border:1px solid var(--line);background:var(--card);color:var(--text);padding:9px;border-radius:8px}.wide{grid-column:1/-1}.panel{padding:17px}.panel h3{margin:0 0 10px}.result{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.result>div{padding:11px;background:var(--soft);border-radius:9px}.result strong{display:block;font-size:1.18rem}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:700px}.table th,.table td{padding:10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}.table th{font-size:.76rem;text-transform:uppercase;color:var(--muted)}.formula{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;background:var(--soft);padding:10px;border-radius:8px}.law{padding:15px;border-left:4px solid var(--brand);margin:9px 0;background:var(--soft);border-radius:9px}.law h3{margin:0 0 5px}.badge{display:inline-block;padding:4px 8px;border-radius:99px;background:var(--soft);color:var(--muted);font-size:.78rem}.check{display:flex;gap:8px;align-items:start;padding:9px 0;border-bottom:1px solid var(--line)}.check:last-child{border:0}.check input{width:auto;margin-top:3px}.platforms{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.risk{padding:17px}.risk strong{display:block}.source{font-size:.8rem;color:var(--muted);word-break:break-word}.source a{color:var(--blue)}.error{color:var(--red);font-weight:730}.good{color:var(--brand);font-weight:730}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.tabs button.active{background:var(--brand);color:#fff}.hidden{display:none!important}
@media print{.side,.top,.btn{display:none!important}.app{display:block}.content{max-width:none;padding:0}.card{box-shadow:none}}

<body><div class="app"><aside class="side" id="side"><div class="brand"><span class="mark">OD</span><span>Previsión Chile<br><small>Guía formal 2026</small></span></div><nav class="nav" id="nav"><button class="active" data-page="dashboard">▦ Panel de cumplimiento</button><div class="group">Remuneraciones</div><button data-page="payroll">≋ Planilla y liquidación</button><button data-page="social">♙ Cotizaciones sociales</button><button data-page="tax">% Impuesto al sueldo</button><div class="group">Gestión y derecho</div><button data-page="health">✚ Salud y seguridad laboral</button><button data-page="platforms">⌘ Plataformas chilenas</button><button data-page="laws">§ Fundamentos legales</button><button data-page="checklist">✓ Lista de control</button></nav><div class="sidefoot">Corte: octubre de 2026. Verifique parámetros del mes de remuneración antes de liquidar.</div></aside><main class="main"><header class="top"><button class="btn menu" id="menu">☰</button><h1 id="title">Panel de cumplimiento</h1><div class="spacer"></div><button class="btn" id="theme">◐ Tema</button><button class="btn" id="print">Imprimir guía</button><a class="btn primary" href="opendirectory.html">OpenDirectory</a></header><section class="content" id="view"></section></main></div>
<script>
(()=>{const $=s=>document.querySelector(s),clp=n=>new Intl.NumberFormat('es-CL',{style:'currency',currency:'CLP',maximumFractionDigits:0}).format(n),pct=n=>(n*100).toFixed(2)+'%';let page=location.hash.slice(1)||'dashboard';
const afp={Capital:.1144,Cuprum:.1144,Habitat:.1127,PlanVital:.1116,Provida:.1145,Modelo:.1058,Uno:.1046};
const iusc=[{to:977940,f:0,r:0},{to:2173200,f:.04,r:39117.60},{to:3622000,f:.08,r:126045.60},{to:5070800,f:.135,r:325255.60},{to:6519600,f:.23,r:806981.60},{to:8692800,f:.304,r:1289432},{to:22456400,f:.35,r:1689300.80},{to:Infinity,f:.4,r:2812120.80}];
const links={previred:'https://www.previred.com/',dt:'https://www.dt.gob.cl/',sii:'https://www.sii.cl/',sp:'https://www.spensiones.cl/',suseso:'https://www.suseso.cl/',fonasa:'https://www.fonasa.cl/',afc:'https://www.afc.cl/',ley:'https://www.bcn.cl/leychile/'};
function hero(t,p){return `<section class="hero"><h2>${t}</h2><p>${p}</p></section>`}function dashboard(){return hero('Previsión social y remuneraciones en Chile','Guía profesional para empleadores, asesores y encargados de remuneraciones. Distingue cálculo, obligación legal, plataforma operativa y control documental.')+`<div class="notice"><b>Advertencia legal:</b> la liquidación depende del período, tipo de contrato, AFP, sistema de salud, tope imponible, licencias, CCAF, mutualidad, cargas y situación tributaria. Esta guía no reemplaza una revisión individual.</div><div class="cards"><article class="card item"><span class="badge">Trabajador</span><div class="metric">10% + comisión</div><p>Pensión AFP sobre renta imponible, sujeto a tope.</p></article><article class="card item"><span class="badge">Trabajador</span><div class="metric">7%</div><p>Cotización legal de salud, con reglas particulares en Isapre.</p></article><article class="card item"><span class="badge">Contrato indefinido</span><div class="metric">0,6% / 2,4%</div><p>Seguro de cesantía: trabajador / empleador.</p></article><article class="card item"><span class="badge">Tope 2026</span><div class="metric">90 UF</div><p>Pensión, salud y seguro de accidentes; AFC: 135,2 UF.</p></article></div><div class="grid2" style="margin-top:14px"><section class="card panel"><h3>Flujo mensual correcto</h3><ol><li>Cerrar asistencia, licencias, vacaciones y variables.</li><li>Clasificar haberes imponibles y no imponibles.</li><li>Aplicar topes y tasas del mes de remuneración.</li><li>Calcular IUSC sobre renta líquida imponible.</li><li>Emitir liquidación y archivo bancario.</li><li>Pagar cotizaciones en PREVIRED.</li><li>Declarar LRE en Mi DT y conciliar con contabilidad.</li></ol></section><section class="card panel"><h3>Control de salud y seguridad</h3><p>La nómina no se limita al sueldo líquido. Debe reconciliar mutualidad o ISL, licencias médicas, accidentes, subsidios, ausentismo y obligaciones preventivas.</p><div class="law"><b>Regla de control:</b> trabajador, contrato, centro de costo, organismo administrador, tasa, base imponible y período deben coincidir en todos los sistemas.</div></section></div>`}
function payroll(){return hero('Planilla y liquidación de remuneraciones','Calculadora orientativa para trabajador dependiente. Referencia previsional: remuneraciones septiembre 2026; tabla IUSC usada: noviembre 2026, solo demostrativa.')+`<div class="grid"><form class="card form" id="pf"><label>Sueldo base<input name="base" type="number" value="1200000"></label><label>Gratificación imponible<input name="grat" type="number" value="150000"></label><label>Horas extra/bonos imponibles<input name="variable" type="number" value="100000"></label><label>Haberes no imponibles<input name="nonTax" type="number" value="80000"></label><label>AFP<select name="afp">${Object.keys(afp).map(x=>`<option>${x}</option>`).join('')}</select></label><label>Salud<select name="health"><option value=".07">Fonasa 7%</option><option value=".075">Isapre ejemplo 7,5%</option><option value=".08">Isapre ejemplo 8%</option></select></label><label>Contrato<select name="contract"><option value="indefinite">Indefinido</option><option value="fixed">Plazo fijo/obra</option></select></label><label>Otros descuentos autorizados<input name="other" type="number" value="0"></label><label>Tope AFP/Salud en CLP<input name="cap" type="number" value="3695148"></label><label>Tope AFC en CLP<input name="afcCap" type="number" value="5550933"></label><label>Cotización Ley 16.744 empleador (%)<input name="accident" type="number" value="0.93" step=".01"></label><button class="btn primary wide">Calcular liquidación</button><div id="pr" class="wide"></div></form><section class="card panel"><h3>Desglose</h3><div id="breakdown"></div><div class="formula">Líquido = total haberes − AFP − salud − AFC trabajador − IUSC − otros descuentos</div><div class="notice">No incorpora APV, carga Isapre expresada en UF, préstamos CCAF, pensiones alimenticias, reliquidaciones, licencias ni gratificación legal compleja.</div></section></div>`}
function taxCalc(base){const t=iusc.find(x=>base<=x.to);return Math.max(0,base*t.f-t.r)}function bindPayroll(){const f=$('#pf');f.onsubmit=e=>{e.preventDefault();const d=Object.fromEntries(new FormData(f)),n=k=>Number(d[k]),imposable=n('base')+n('grat')+n('variable'),baseAFP=Math.min(imposable,n('cap')),baseAFC=Math.min(imposable,n('afcCap')),afpDed=baseAFP*afp[d.afp],health=baseAFP*n('health'),afcWorker=d.contract==='indefinite'?baseAFC*.006:0,taxBase=Math.max(0,imposable-afpDed-health-afcWorker),tax=taxCalc(taxBase),other=n('other'),gross=imposable+n('nonTax'),net=gross-afpDed-health-afcWorker-tax-other,afcEmployer=baseAFC*(d.contract==='indefinite'?.024:.03),sis=baseAFP*.0178,socialProtected=baseAFP*.009,socialLife=baseAFP*.0072,accident=baseAFP*n('accident')/100,employer=afcEmployer+sis+socialProtected+socialLife+accident;$('#pr').innerHTML=`<div class="result"><div><small>Haberes totales</small><strong>${clp(gross)}</strong></div><div><small>Descuentos</small><strong>${clp(gross-net)}</strong></div><div><small>Líquido estimado</small><strong>${clp(net)}</strong></div></div>`;$('#breakdown').innerHTML=`<table class="table"><tr><th>Concepto</th><th>Trabajador</th><th>Empleador</th></tr><tr><td>AFP ${d.afp}</td><td>${clp(afpDed)}</td><td>Revisar componente adicional del período</td></tr><tr><td>Salud</td><td>${clp(health)}</td><td>-</td></tr><tr><td>Seguro cesantía</td><td>${clp(afcWorker)}</td><td>${clp(afcEmployer)}</td></tr><tr><td>SIS</td><td>-</td><td>${clp(sis)}</td></tr><tr><td>Seguro Social: rentabilidad protegida</td><td>-</td><td>${clp(socialProtected)}</td></tr><tr><td>Seguro Social: expectativa de vida</td><td>-</td><td>${clp(socialLife)}</td></tr><tr><td>Ley 16.744, tasa ingresada</td><td>-</td><td>${clp(accident)}</td></tr><tr><td>IUSC estimado</td><td>${clp(tax)}</td><td>-</td></tr><tr><td><b>Total costo previsional empleador mostrado</b></td><td>-</td><td><b>${clp(employer)}</b></td></tr></table>`};f.requestSubmit()}
function social(){return hero('Cotizaciones previsionales y de salud','Mapa de tasas y bases de referencia para 2026. Las tasas deben cargarse por período de remuneración, no copiarse indefinidamente.')+`<div class="tablewrap card panel"><table class="table"><thead><tr><th>Concepto</th><th>Tasa/Tope de referencia</th><th>Financiamiento</th><th>Fundamento operativo</th></tr></thead><tbody><tr><td>Pensión AFP</td><td>10% + comisión AFP</td><td>Trabajador</td><td>DL 3.500 y tablas PREVIRED</td></tr><tr><td>Salud</td><td>7% legal</td><td>Trabajador</td><td>Fonasa o Isapre; verificar plan pactado</td></tr><tr><td>AFC indefinido</td><td>0,6% trabajador + 2,4% empleador</td><td>Mixto</td><td>Ley 19.728</td></tr><tr><td>AFC plazo fijo/obra</td><td>3% empleador</td><td>Empleador</td><td>Ley 19.728</td></tr><tr><td>SIS, agosto-octubre 2026</td><td>1,78%</td><td>Empleador</td><td>Indicador vigente informado por SP/PREVIRED</td></tr><tr><td>Seguro Social 2026</td><td>0,90% + 0,72%</td><td>Empleador</td><td>Reforma previsional; verificar período</td></tr><tr><td>Ley 16.744</td><td>Tasa básica y adicional diferenciada</td><td>Empleador</td><td>Mutualidad/ISL y siniestralidad</td></tr><tr><td>Topes 2026</td><td>90 UF; AFC 135,2 UF</td><td>Base máxima</td><td>SP, desde remuneraciones febrero 2026</td></tr></tbody></table></div><div class="grid2" style="margin-top:14px"><section class="card panel"><h3>Fonasa versus Isapre</h3><p>En Fonasa, la cotización legal es 7%. En Isapre, el precio del plan puede excederla; la liquidación debe distinguir cotización legal, adicional voluntaria y reglas contractuales.</p></section><section class="card panel"><h3>Licencias médicas</h3><p>La licencia altera días trabajados, remuneración, subsidio y responsables del pago de cotizaciones. Debe conciliarse con COMPIN/Isapre, organismo administrador y plataforma de remuneraciones.</p></section></div>`}
function tax(){return hero('Impuesto Único de Segunda Categoría','Tributo mensual progresivo aplicado sobre la renta líquida imponible. Tabla demostrativa: noviembre de 2026.')+`<div class="grid"><form class="card form" id="tf"><label class="wide">Renta líquida imponible<input name="base" type="number" value="2500000"></label><button class="btn primary wide">Calcular</button><div id="tr" class="wide result"></div></form><section class="card panel"><h3>Tabla mensual resumida</h3><div class="tablewrap"><table class="table"><tr><th>Hasta</th><th>Factor</th><th>Rebaja</th></tr>${iusc.map(x=>`<tr><td>${x.to===Infinity?'Más':clp(x.to)}</td><td>${x.f}</td><td>${clp(x.r)}</td></tr>`).join('')}</table></div></section></div><div class="notice">La obligación de retener nace con el pago de la remuneración. Pagos por períodos distintos de un mes pueden requerir tabla diaria, semanal o quincenal y posterior reliquidación.</div>`}function bindTax(){const f=$('#tf');f.onsubmit=e=>{e.preventDefault();const b=Number(new FormData(f).get('base')),tax=taxCalc(b),eff=b?tax/b:0;$('#tr').innerHTML=`<div><small>Impuesto</small><strong>${clp(tax)}</strong></div><div><small>Tasa efectiva</small><strong>${pct(eff)}</strong></div><div><small>Renta después IUSC</small><strong>${clp(b-tax)}</strong></div>`};f.requestSubmit()}
function health(){return hero('Salud ocupacional y seguridad social','La gestión de salud laboral combina prevención, seguro de accidentes, licencias, salud mental, vigilancia y trazabilidad de cotizaciones.')+`<div class="cards"><article class="card risk"><span class="badge">Ley 16.744</span><h3>Accidentes y enfermedades</h3><p>Seguro obligatorio administrado por mutualidades o ISL. Debe vincular centro de trabajo, exposición, denuncia, prestaciones y reincorporación.</p></article><article class="card risk"><span class="badge">DS 44</span><h3>Gestión preventiva</h3><p>Reglamento sobre gestión preventiva para un entorno seguro y saludable, con instrumentos y obligaciones para entidades empleadoras.</p></article><article class="card risk"><span class="badge">CEAL-SM/SUSESO</span><h3>Riesgo psicosocial</h3><p>Instrumento para identificar dimensiones psicosociales. Su aplicación exige respetar condiciones, participación y plan preventivo.</p></article><article class="card risk"><span class="badge">Licencias</span><h3>Incapacidad laboral</h3><p>Controlar fecha, días, entidad autorizadora, subsidio, cotización durante incapacidad y diferencias entre origen común y laboral.</p></article></div><div class="grid2" style="margin-top:14px"><section class="card panel"><h3>Matriz mínima por trabajador</h3><ul><li>Afiliación de salud y previsión.</li><li>Organismo administrador Ley 16.744.</li><li>Centro de trabajo y exposición.</li><li>Licencias, accidentes y restricciones.</li><li>Fecha de reintegro y adecuaciones.</li></ul></section><section class="card panel"><h3>Principio de confidencialidad</h3><p>La planilla de remuneraciones no debe transformarse en ficha clínica. Registra solo antecedentes necesarios para remuneración, licencia, subsidio y cumplimiento; limita accesos y conserva trazabilidad.</p></section></div>`}
function platforms(){return hero('Plataformas chilenas de gestión','Separación entre portales obligatorios, sistemas de apoyo y software comercial. La selección depende de tamaño, complejidad, integraciones y control interno.')+`<div class="platforms"><article class="card item"><span class="badge">Oficial</span><h3>PREVIRED</h3><p>Declaración y pago de cotizaciones, validaciones y comprobantes.</p><a href="${links.previred}" target="_blank" rel="noopener noreferrer">Abrir PREVIRED</a></article><article class="card item"><span class="badge">Oficial</span><h3>Mi DT / REL / LRE</h3><p>Contratos, anexos, términos y Libro de Remuneraciones Electrónico.</p><a href="${links.dt}" target="_blank" rel="noopener noreferrer">Abrir Dirección del Trabajo</a></article><article class="card item"><span class="badge">Oficial</span><h3>SII</h3><p>F29, IUSC, DJ 1887 y conciliación tributaria.</p><a href="${links.sii}" target="_blank" rel="noopener noreferrer">Abrir SII</a></article><article class="card item"><span class="badge">Oficial</span><h3>SUSESO / CEAL-SM</h3><p>Seguridad social, licencias, normativa y riesgos psicosociales.</p><a href="${links.suseso}" target="_blank" rel="noopener noreferrer">Abrir SUSESO</a></article><article class="card item"><span class="badge">Oficial</span><h3>Fonasa / AFC / SP</h3><p>Salud, cesantía y supervisión previsional.</p><a href="${links.fonasa}" target="_blank" rel="noopener noreferrer">Fonasa</a> · <a href="${links.afc}" target="_blank" rel="noopener noreferrer">AFC</a> · <a href="${links.sp}" target="_blank" rel="noopener noreferrer">SP</a></article><article class="card item"><span class="badge">Comercial</span><h3>Buk, Talana, Rex+</h3><p>Suites de personas y remuneraciones. Evaluar motor local, LRE, PREVIRED, asistencia, multiempresa y API.</p></article><article class="card item"><span class="badge">Comercial</span><h3>Nubox, Defontana/Zenda</h3><p>Integración estrecha con contabilidad y ERP, útil para pymes y cierres contables.</p></article><article class="card item"><span class="badge">Comercial</span><h3>Runa, Laudus, HCMFront</h3><p>Alternativas con distintos grados de especialización en nómina, ERP, RR.HH. e integraciones.</p></article><article class="card item"><span class="badge">Selección</span><h3>Criterios de RFP</h3><p>Pruebas paralelas de nómina, reliquidación, retroactivos, licencias, bancos, LRE, trazabilidad, SLA, API y reversión del servicio.</p></article></div>`}
function laws(){return hero('Fundamentos legales','Mapa normativo de alto nivel. La versión vigente debe consultarse en Ley Chile y organismos fiscalizadores.')+`<article class="law"><h3>Código del Trabajo, artículos 41, 54, 58 y 62</h3><p>Concepto y protección de remuneración, descuentos y libro de remuneraciones.</p></article><article class="law"><h3>DL 3.500 de 1980</h3><p>Sistema de pensiones y cotización obligatoria AFP; tope regulado en su artículo 16.</p></article><article class="law"><h3>Ley 21.735</h3><p>Reforma previsional y nueva cotización del empleador, con implementación gradual.</p></article><article class="law"><h3>Ley 19.728</h3><p>Seguro obligatorio de cesantía y financiamiento según contrato.</p></article><article class="law"><h3>Ley 16.744, DS 101 y DS 67</h3><p>Seguro de accidentes y enfermedades profesionales, afiliación, cotización adicional y siniestralidad.</p></article><article class="law"><h3>DS 44 de 2023, publicado en 2024</h3><p>Gestión preventiva de riesgos laborales y entorno de trabajo seguro y saludable.</p></article><article class="law"><h3>Ley 17.322 y Ley 19.631</h3><p>Cobranza de cotizaciones y efectos del incumplimiento previsional en el término del contrato.</p></article><article class="law"><h3>Ley sobre Impuesto a la Renta, artículos 42 N°1, 43, 45, 47, 74 y 78</h3><p>IUSC, escalas según período, reliquidación y retención al momento del pago.</p></article><p class="source">Consulta texto actualizado: <a href="${links.ley}" target="_blank" rel="noopener noreferrer">Ley Chile, Biblioteca del Congreso Nacional</a>.</p>`}
function checklist(){return hero('Lista de control mensual','Control operativo orientado a evitar diferencias entre nómina, bancos, PREVIRED, Mi DT, SII y contabilidad.')+`<div class="grid2"><section class="card panel" id="checks">${['Contrato y anexo vigentes','Asistencia y horas extra cerradas','Licencias y ausencias conciliadas','Haberes correctamente clasificados','Topes y tasas del período actualizados','AFP, salud, AFC y mutualidad validadas','IUSC calculado con tabla del período','Liquidaciones emitidas y aceptadas','Archivo bancario conciliado','PREVIRED pagado y comprobantes archivados','LRE declarado dentro del plazo','F29 y DJ conciliados','Centros de costo contabilizados','Accesos y datos sensibles revisados'].map((x,i)=>`<label class="check"><input type="checkbox" data-check="${i}"><span>${x}</span></label>`).join('')}</section><section class="card panel"><h3>Estado mensual</h3><div class="metric" id="progress">0%</div><p id="progressText" class="muted">0 de 14 controles completados.</p><button class="btn" id="resetChecks">Reiniciar</button><h3 style="margin-top:20px">Evidencia mínima</h3><ul><li>Reporte de diferencias y resolución.</li><li>Comprobantes de pago y declaraciones.</li><li>Archivo de liquidaciones y firma/entrega.</li><li>Bitácora de parámetros y versiones.</li><li>Conciliación contable y bancaria.</li></ul></section></div>`}
const pages={dashboard,payroll,social,tax,health,platforms,laws,checklist},titles={dashboard:'Panel de cumplimiento',payroll:'Planilla y liquidación',social:'Cotizaciones sociales',tax:'Impuesto al sueldo',health:'Salud y seguridad laboral',platforms:'Plataformas chilenas',laws:'Fundamentos legales',checklist:'Lista de control'};function bindChecklist(){const boxes=[...document.querySelectorAll('[data-check]')],saved=JSON.parse(localStorage.getItem('od-prev-checks')||'[]');boxes.forEach((b,i)=>{b.checked=!!saved[i];b.onchange=()=>{localStorage.setItem('od-prev-checks',JSON.stringify(boxes.map(x=>x.checked)));update()}});function update(){const n=boxes.filter(x=>x.checked).length;$('#progress').textContent=Math.round(n/boxes.length*100)+'%';$('#progressText').textContent=`${n} de ${boxes.length} controles completados.`}$('#resetChecks').onclick=()=>{boxes.forEach(x=>x.checked=false);localStorage.removeItem('od-prev-checks');update()};update()}function render(){page=location.hash.slice(1)||'dashboard';if(!pages[page])page='dashboard';$('#view').innerHTML=pages[page]();$('#title').textContent=titles[page];document.querySelectorAll('[data-page]').forEach(x=>x.classList.toggle('active',x.dataset.page===page));if(page==='payroll')bindPayroll();if(page==='tax')bindTax();if(page==='checklist')bindChecklist()}$('#nav').onclick=e=>{const b=e.target.closest('[data-page]');if(b){location.hash=b.dataset.page;$('#side').classList.remove('open')}};window.onhashchange=render;$('#menu').onclick=()=>$('#side').classList.toggle('open');$('#theme').onclick=()=>{const d=document.documentElement.dataset.theme==='dark';document.documentElement.dataset.theme=d?'light':'dark';localStorage.setItem('od-prev-theme',d?'light':'dark')};document.documentElement.dataset.theme=localStorage.getItem('od-prev-theme')||'light';$('#print').onclick=()=>window.print();render()})();
</script></body></html>
