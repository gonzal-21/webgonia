<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Laboratorio de economía y macroeconomía de OpenDirectory"><title>OpenEconomics | OpenDirectory</title><style>
:root{--bg:#f4f7f5;--card:#fff;--soft:#eaf1ed;--text:#17231c;--muted:#66746b;--line:#d7e2db;--brand:#176b4d;--brand2:#0d4934;--accent:#e8ae3d;--bad:#b33f49;--info:#2676ad;--shadow:0 14px 40px rgba(20,73,48,.1);--r:16px}
[data-theme=dark]{--bg:#0c1410;--card:#142019;--soft:#1c2a22;--text:#eef7f1;--muted:#9fb1a5;--line:#2b3d31;--brand:#4db989;--brand2:#329568;--accent:#f2bc56;--bad:#ef7e88;--info:#77b8e6;--shadow:0 16px 44px rgba(0,0,0,.3)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 Inter,system-ui,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}a{color:inherit;text-decoration:none}.app{display:grid;grid-template-columns:255px 1fr;min-height:100vh}.side{height:100vh;position:sticky;top:0;background:#092f22;color:#ebfff3;padding:16px 13px;display:flex;flex-direction:column;z-index:30}.brand{display:flex;gap:10px;align-items:center;font-weight:900;padding:6px 8px 20px}.mark{width:38px;height:38px;border-radius:11px;background:#ddf7e8;color:#0c5338;display:grid;place-items:center}.nav{display:grid;gap:5px}.nav button{border:0;background:transparent;color:#c8ded1;padding:11px;border-radius:9px;text-align:left}.nav button.active,.nav button:hover{background:#15543e;color:#fff}.side small{margin-top:auto;color:#aaceb9;border-top:1px solid #1d583f;padding:14px 8px}.main{min-width:0}.top{height:69px;position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--card) 93%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 20px;gap:10px}.top h1{font-size:1.05rem;margin:0}.spacer{flex:1}.btn{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:9px;padding:9px 12px;font-weight:730}.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}.btn.danger{color:var(--bad)}.content{padding:20px;max-width:1480px;margin:auto}.head{display:flex;justify-content:space-between;align-items:end;gap:14px;margin-bottom:17px}.head h2{font-size:1.8rem;letter-spacing:-.035em;margin:0}.head p{color:var(--muted);margin:4px 0 0}.notice{padding:12px 14px;background:color-mix(in srgb,var(--accent) 15%,var(--card));border:1px solid color-mix(in srgb,var(--accent) 45%,var(--line));border-radius:11px;margin-bottom:15px}.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:13px}.kpi{padding:17px}.kpi strong{display:block;font-size:1.85rem}.kpi span,.muted{color:var(--muted)}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}.panel{padding:17px}.panel h3{margin:0 0 12px}.form{padding:18px;display:grid;gap:11px}.field{display:grid;gap:5px}.field label{font-weight:720}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:9px;padding:10px}.inputgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.calcgrid{display:grid;grid-template-columns:.8fr 1.2fr;gap:14px}.resultline{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}.formula{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;background:var(--soft);padding:10px;border-radius:9px;margin:8px 0;overflow:auto}.canvasbox{padding:16px}.canvasbox canvas{width:100%;height:390px;display:block;background:var(--card);border-radius:10px}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;border-bottom:1px solid var(--line);padding:10px}.table th{color:var(--muted);font-size:.78rem;text-transform:uppercase}.tag{display:inline-block;padding:4px 8px;border-radius:99px;background:var(--soft);color:var(--muted);font-size:.78rem}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}.item{padding:17px}.item h3{margin:0 0 6px}.warning{color:var(--bad);font-weight:720}.success{color:var(--brand);font-weight:720}.menu{display:none}.hidden{display:none!important}.toast{position:fixed;right:18px;bottom:18px;background:var(--text);color:var(--card);padding:12px 15px;border-radius:10px;z-index:80}.flows{display:grid;gap:7px}.flow{display:grid;grid-template-columns:80px 1fr 38px;gap:7px;align-items:center}.flow button{border:0;background:var(--soft);color:var(--bad);border-radius:8px;height:36px}.compare{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.steps{counter-reset:s}.steps li{margin:8px 0}.source{font-size:.82rem;color:var(--muted)}
@media(max-width:1050px){.kpis{grid-template-columns:repeat(2,1fr)}.cards,.grid3{grid-template-columns:repeat(2,1fr)}.calcgrid{grid-template-columns:1fr}}@media(max-width:760px){.app{grid-template-columns:1fr}.side{position:fixed;left:-270px;width:255px;transition:.2s}.side.open{left:0}.menu{display:block}.content{padding:14px}.grid2,.grid3,.cards,.kpis,.inputgrid,.compare{grid-template-columns:1fr}.head{align-items:start;flex-direction:column}}
</style></head><body><div class="app"><aside class="side" id="side"><div class="brand"><span class="mark">OD</span><span>OpenEconomics<br><small style="border:0;padding:0">Portal de asesorías</small></span></div><nav class="nav" id="nav"><button data-page="islm" class=active>⌗ IS-LM</button><button data-page="multiplier">× Consumo y multiplicador</button><button data-page="adas">↕ Oferta y demanda agregada</button><button data-page="labor">♙ Mercado laboral</button><button data-page="growth">↗ Crecimiento Solow</button></nav><small>Macroeconomía aplicada y política económica para asesorías.</small></aside><main class="main"><header class="top"><button class="btn menu" id="menu">☰</button><h1 id="title">IS-LM</h1><div class="spacer"></div><button class="btn" id="theme">◐ Tema</button><a class="btn primary" href="opendirectory.html">OpenDirectory</a></header><section class="content" id="view"></section></main></div><div id="toast"></div><script>
function islm(){return `${head('Laboratorio IS-LM','Política fiscal y monetaria con comparación de escenarios.')}<div class="calcgrid"><form class="card form" id="islmForm"><div class="inputgrid"><div class="field"><label>C₀</label><input id="c0" type="number" value="50"></div><div class="field"><label>PMC c</label><input id="mpc" type="number" value=".75"></div><div class="field"><label>T</label><input id="T" type="number" value="40"></div><div class="field"><label>I₀</label><input id="I0" type="number" value="120"></div><div class="field"><label>b</label><input id="b" type="number" value="20"></div><div class="field"><label>G</label><input id="G" type="number" value="100"></div><div class="field"><label>M/P</label><input id="M" type="number" value="200"></div><div class="field"><label>k</label><input id="k" type="number" value=".5"></div><div class="field"><label>h</label><input id="h" type="number" value="40"></div><div class="field"><label>ΔG</label><input id="dG" type="number" value="40"></div><div class="field"><label>Δ(M/P)</label><input id="dM" type="number" value="60"></div></div><button class="btn primary">Calcular</button><div id="islmResults"></div></form><div class="card canvasbox"><canvas id="islmChart" width="760" height="420"></canvas></div></div><div class="grid2"><article class="card panel"><h3>IS</h3><div class="formula">A=C₀-cT+I₀+G<br>i=[A-(1-c)Y]/b</div></article><article class="card panel"><h3>LM</h3><div class="formula">M/P=kY-hi<br>i=[kY-M/P]/h</div></article></div>`}
function multiplier(){return `${head('Consumo y multiplicador','Propensión marginal a consumir, impuestos y gasto autónomo.')}<div class="calcgrid"><form class="card form" id="multForm"><div class="inputgrid"><div class="field"><label>PMC</label><input id="cm" type="number" value=".75"></div><div class="field"><label>Cambio gasto ΔG</label><input id="dg" type="number" value="100"></div><div class="field"><label>Tasa impositiva proporcional</label><input id="tau" type="number" value="0" step=".01"></div><div class="field"><label>Propensión importar m</label><input id="imp" type="number" value="0" step=".01"></div></div><button class="btn primary">Calcular</button><div id="multResults"></div></form><div class="card panel"><h3>Fundamento</h3><div class="formula">Economía cerrada simple: k=1/(1-c)<br>Con impuestos e importaciones: k=1/[1-c(1-τ)+m]<br>ΔY=k·ΔG</div><p class="muted">El multiplicador real puede ser menor por capacidad, precios, expectativas, crédito y respuesta monetaria.</p></div></div>`}
function adas(){return `${head('Oferta y demanda agregada','Simulador conceptual de shocks de demanda y oferta.')}<div class="calcgrid"><form class="card form" id="adasForm"><div class="inputgrid"><div class="field"><label>Producción potencial Yp</label><input id="yp" type="number" value="100"></div><div class="field"><label>Nivel precios base</label><input id="p0" type="number" value="100"></div><div class="field"><label>Shock demanda</label><input id="adShock" type="number" value="10"></div><div class="field"><label>Shock oferta</label><input id="asShock" type="number" value="0"></div></div><button class="btn primary">Simular</button><div id="adasResults"></div></form><div class="card canvasbox"><canvas id="adasChart" width="760" height="420"></canvas></div></div>`}
function labor(){return `${head('Mercado laboral','Oferta y demanda laboral lineales.')}<div class="calcgrid"><form class="card form" id="laborForm"><div class="inputgrid"><div class="field"><label>Demanda Ld = a-bw, a</label><input id="la" type="number" value="120"></div><div class="field"><label>b</label><input id="lb" type="number" value="4"></div><div class="field"><label>Oferta Ls = c+dw, c</label><input id="lc" type="number" value="20"></div><div class="field"><label>d</label><input id="ld" type="number" value="2"></div><div class="field"><label>Salario mínimo simulado</label><input id="wmin" type="number" value="20"></div></div><button class="btn primary">Calcular</button><div id="laborResults"></div></form><div class="card canvasbox"><canvas id="laborChart" width="760" height="420"></canvas></div></div>`}
function growth(){return `${head('Crecimiento: modelo de Solow','Estado estacionario por trabajador en una función Cobb-Douglas.')}<div class="calcgrid"><form class="card form" id="solowForm"><div class="inputgrid"><div class="field"><label>Tasa ahorro s</label><input id="save" type="number" value=".25" step=".01"></div><div class="field"><label>Capital participación α</label><input id="alpha" type="number" value=".35" step=".01"></div><div class="field"><label>Depreciación δ</label><input id="dep" type="number" value=".05" step=".01"></div><div class="field"><label>Crecimiento población n</label><input id="pop" type="number" value=".01" step=".01"></div><div class="field"><label>Progreso tecnológico g</label><input id="tech" type="number" value=".02" step=".01"></div></div><button class="btn primary">Calcular</button><div id="solowResults"></div></form><div class="card canvasbox"><canvas id="solowChart" width="760" height="420"></canvas></div></div><div class="formula">y=k^α<br>Inversión por trabajador efectivo=s·k^α<br>Inversión de reposición=(δ+n+g)k</div>`}
function bindISLM(){function run(){let C=+$('#c0').value,c=+$('#mpc').value,T=+$('#T').value,I=+$('#I0').value,b=+$('#b').value,G=+$('#G').value,M=+$('#M').value,k=+$('#k').value,h=+$('#h').value,dG=+$('#dG').value,dM=+$('#dM').value,eq=(GG,MM)=>{let A=C-c*T+I+GG,Y=(A+b*MM/h)/((1-c)+b*k/h),ii=(k*Y-MM)/h;return{A,Y,i:ii}},e0=eq(G,M),e1=eq(G+dG,M+dM);$('#islmResults').innerHTML=`<div class="resultline"><span>E₀: Y / i</span><b>${e0.Y.toFixed(2)} / ${e0.i.toFixed(2)}</b></div><div class="resultline"><span>E₁: Y / i</span><b>${e1.Y.toFixed(2)} / ${e1.i.toFixed(2)}</b></div><div class="resultline"><span>ΔY / Δi</span><b>${(e1.Y-e0.Y).toFixed(2)} / ${(e1.i-e0.i).toFixed(2)}</b></div>`;let cv=$('#islmChart'),x=cv.getContext('2d'),w=cv.width,H=cv.height;axes(x,w,H,'Y','i');let maxY=Math.max(e0.Y,e1.Y)*1.7,ys=Array.from({length:100},(_,j)=>j/99*maxY),is=(y,A)=>(A-(1-c)*y)/b,lm=(y,MM)=>(k*y-MM)/h,all=ys.flatMap(y=>[is(y,e0.A),is(y,e1.A),lm(y,M),lm(y,M+dM)]),mi=Math.min(...all),ma=Math.max(...all),px=y=>55+y/maxY*(w-80),py=i=>H-42-(i-mi)/(ma-mi)*(H-70);line(x,ys.map(y=>[px(y),py(is(y,e0.A))]),'#b33f49','IS₀');line(x,ys.map(y=>[px(y),py(lm(y,M))]),'#176b4d','LM₀');line(x,ys.map(y=>[px(y),py(is(y,e1.A))]),'#e8ae3d','IS₁',[8,5]);line(x,ys.map(y=>[px(y),py(lm(y,M+dM))]),'#2676ad','LM₁',[8,5])}$('#islmForm').onsubmit=e=>{e.preventDefault();run()};run()}
function bindMult(){$('#multForm').onsubmit=e=>{e.preventDefault();let c=+$('#cm').value,dg=+$('#dg').value,t=+$('#tau').value,m=+$('#imp').value,k=1/(1-c*(1-t)+m),dy=k*dg;$('#multResults').innerHTML=`<div class="resultline"><span>Multiplicador</span><b>${k.toFixed(3)}</b></div><div class="resultline"><span>ΔY</span><b>${dy.toFixed(2)}</b></div><div class="resultline"><span>PMA</span><b>${(1-c).toFixed(2)}</b></div>`};$('#multForm').requestSubmit()}
function bindADAS(){function run(){let Y=+$('#yp').value,P=+$('#p0').value,d=+$('#adShock').value,s=+$('#asShock').value,Y1=Y+.6*d-.5*s,P1=P+.4*d+.7*s;$('#adasResults').innerHTML=`<div class="resultline"><span>Producción inicial / nueva</span><b>${Y.toFixed(1)} / ${Y1.toFixed(1)}</b></div><div class="resultline"><span>Precios inicial / nuevo</span><b>${P.toFixed(1)} / ${P1.toFixed(1)}</b></div><small class="muted">Coeficientes pedagógicos, no estimados.</small>`;let cv=$('#adasChart'),c=cv.getContext('2d'),w=cv.width,h=cv.height;axes(c,w,h,'Y','P');line(c,[[70,340],[690,70]],'#b33f49','DA');line(c,[[130,330],[610,80]],'#2676ad','DA₁',[8,5]);line(c,[[100,80],[680,330]],'#176b4d','OA')}$('#adasForm').onsubmit=e=>{e.preventDefault();run()};run()}
function bindLabor(){function run(){let a=+$('#la').value,b=+$('#lb').value,c=+$('#lc').value,d=+$('#ld').value,wm=+$('#wmin').value,w=(a-c)/(b+d),L=a-b*w,Ld=a-b*wm,Ls=c+d*wm;$('#laborResults').innerHTML=`<div class="resultline"><span>w* / L*</span><b>${w.toFixed(2)} / ${L.toFixed(2)}</b></div><div class="resultline"><span>Con salario mínimo: Ld / Ls</span><b>${Ld.toFixed(2)} / ${Ls.toFixed(2)}</b></div><div class="resultline"><span>Exceso oferta laboral</span><b>${Math.max(0,Ls-Ld).toFixed(2)}</b></div>`;let cv=$('#laborChart'),x=cv.getContext('2d'),W=cv.width,H=cv.height;axes(x,W,H,'Trabajo','Salario');line(x,[[80,70],[680,340]],'#b33f49','Ld');line(x,[[80,340],[680,70]],'#176b4d','Ls')}$('#laborForm').onsubmit=e=>{e.preventDefault();run()};run()}
function bindSolow(){function run(){let s=+$('#save').value,a=+$('#alpha').value,delta=+$('#dep').value,n=+$('#pop').value,g=+$('#tech').value,breakEven=delta+n+g,k=(s/breakEven)**(1/(1-a)),y=k**a,cons=(1-s)*y;$('#solowResults').innerHTML=`<div class="resultline"><span>k*</span><b>${k.toFixed(3)}</b></div><div class="resultline"><span>y*</span><b>${y.toFixed(3)}</b></div><div class="resultline"><span>consumo estacionario</span><b>${cons.toFixed(3)}</b></div>`;let cv=$('#solowChart'),x=cv.getContext('2d'),W=cv.width,H=cv.height;axes(x,W,H,'k','inversión');let max=k*2.5,ks=Array.from({length:100},(_,i)=>.001+i/99*max),vals=ks.flatMap(q=>[s*q**a,breakEven*q]),ma=Math.max(...vals),px=q=>55+q/max*(W-80),py=v=>H-42-v/ma*(H-70);line(x,ks.map(q=>[px(q),py(s*q**a)]),'#176b4d','s f(k)');line(x,ks.map(q=>[px(q),py(breakEven*q)]),'#b33f49','(δ+n+g)k')}$('#solowForm').onsubmit=e=>{e.preventDefault();run()};run()}
const FIRST='islm',PAGES={islm,multiplier,adas,labor,growth},TITLES={islm:'IS-LM',multiplier:'Consumo y multiplicador',adas:'Oferta y demanda agregada',labor:'Mercado laboral',growth:'Crecimiento Solow'},BINDS={islm:bindISLM,multiplier:bindMult,adas:bindADAS,labor:bindLabor,growth:bindSolow},THEME='od-macro-theme';

const $=s=>document.querySelector(s),fmt=n=>new Intl.NumberFormat('es-CL',{style:'currency',currency:'CLP',maximumFractionDigits:0}).format(n);let page=location.hash.slice(1)||FIRST;
function head(t,s){return `<div class="head"><div><h2>${t}</h2><p>${s}</p></div></div>`}function axes(ctx,w,h,x,y){ctx.clearRect(0,0,w,h);ctx.strokeStyle='#748379';ctx.beginPath();ctx.moveTo(55,20);ctx.lineTo(55,h-42);ctx.lineTo(w-20,h-42);ctx.stroke();ctx.fillStyle='#66746b';ctx.font='13px system-ui';ctx.fillText(y,12,22);ctx.fillText(x,w-70,h-12)}function line(ctx,pts,color,label,dash=[]){ctx.save();ctx.setLineDash(dash);ctx.strokeStyle=color;ctx.lineWidth=3;ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.stroke();ctx.restore();ctx.fillStyle=color;ctx.font='bold 12px system-ui';let p=pts[pts.length-1];ctx.fillText(label,p[0]-40,p[1]-8)}function toast(x){$('#toast').innerHTML=`<div class="toast">${x}</div>`;setTimeout(()=>$('#toast').innerHTML='',2000)}
function render(){page=location.hash.slice(1)||FIRST;if(!PAGES[page])page=FIRST;$('#view').innerHTML=PAGES[page]();$('#title').textContent=TITLES[page];document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));if(BINDS[page])BINDS[page]()}$('#nav').onclick=e=>{let b=e.target.closest('[data-page]');if(b){location.hash=b.dataset.page;$('#side').classList.remove('open')}};window.onhashchange=render;$('#menu').onclick=()=>$('#side').classList.toggle('open');$('#theme').onclick=()=>{let d=document.documentElement.dataset.theme==='dark';document.documentElement.dataset.theme=d?'light':'dark';localStorage.setItem(THEME,d?'light':'dark')};document.documentElement.dataset.theme=localStorage.getItem(THEME)||'light';render();
</script></body></html>
