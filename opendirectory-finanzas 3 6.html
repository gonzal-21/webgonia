*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 Inter,system-ui,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}a{color:inherit;text-decoration:none}.app{display:grid;grid-template-columns:255px 1fr;min-height:100vh}.side{height:100vh;position:sticky;top:0;background:#092f22;color:#ebfff3;padding:16px 13px;display:flex;flex-direction:column;z-index:30}.brand{display:flex;gap:10px;align-items:center;font-weight:900;padding:6px 8px 20px}.mark{width:38px;height:38px;border-radius:11px;background:#ddf7e8;color:#0c5338;display:grid;place-items:center}.nav{display:grid;gap:5px}.nav button{border:0;background:transparent;color:#c8ded1;padding:11px;border-radius:9px;text-align:left}.nav button.active,.nav button:hover{background:#15543e;color:#fff}.side small{margin-top:auto;color:#aaceb9;border-top:1px solid #1d583f;padding:14px 8px}.main{min-width:0}.top{height:69px;position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--card) 93%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 20px;gap:10px}.top h1{font-size:1.05rem;margin:0}.spacer{flex:1}.btn{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:9px;padding:9px 12px;font-weight:730}.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}.btn.danger{color:var(--bad)}.content{padding:20px;max-width:1480px;margin:auto}.head{display:flex;justify-content:space-between;align-items:end;gap:14px;margin-bottom:17px}.head h2{font-size:1.8rem;letter-spacing:-.035em;margin:0}.head p{color:var(--muted);margin:4px 0 0}.notice{padding:12px 14px;background:color-mix(in srgb,var(--accent) 15%,var(--card));border:1px solid color-mix(in srgb,var(--accent) 45%,var(--line));border-radius:11px;margin-bottom:15px}.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:13px}.kpi{padding:17px}.kpi strong{display:block;font-size:1.85rem}.kpi span,.muted{color:var(--muted)}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}.panel{padding:17px}.panel h3{margin:0 0 12px}.form{padding:18px;display:grid;gap:11px}.field{display:grid;gap:5px}.field label{font-weight:720}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:9px;padding:10px}.inputgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.calcgrid{display:grid;grid-template-columns:.8fr 1.2fr;gap:14px}.resultline{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}.formula{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;background:var(--soft);padding:10px;border-radius:9px;margin:8px 0;overflow:auto}.canvasbox{padding:16px}.canvasbox canvas{width:100%;height:390px;display:block;background:var(--card);border-radius:10px}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;border-bottom:1px solid var(--line);padding:10px}.table th{color:var(--muted);font-size:.78rem;text-transform:uppercase}.tag{display:inline-block;padding:4px 8px;border-radius:99px;background:var(--soft);color:var(--muted);font-size:.78rem}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}.item{padding:17px}.item h3{margin:0 0 6px}.warning{color:var(--bad);font-weight:720}.success{color:var(--brand);font-weight:720}.menu{display:none}.hidden{display:none!important}.toast{position:fixed;right:18px;bottom:18px;background:var(--text);color:var(--card);padding:12px 15px;border-radius:10px;z-index:80}.flows{display:grid;gap:7px}.flow{display:grid;grid-template-columns:80px 1fr 38px;gap:7px;align-items:center}.flow button{border:0;background:var(--soft);color:var(--bad);border-radius:8px; const riskFree=0.045;
function dashboard(){return `${head('Panel financiero senior','Lectura integrada de rentabilidad, liquidez, solvencia y carga financiera.')}<div class="notice"><b>Regla de lectura:</b> ningún indicador decide por sí solo. Un asesor senior contrasta definición, periodo, moneda, calidad del dato, estacionalidad y escenario adverso.</div><div class="indicator-grid"><div class="card indicator"><strong>1,36x</strong><small>DSCR base</small><div class="status good">Cobertura positiva</div></div><div class="card indicator"><strong>2,08x</strong><small>Deuda / EBITDA</small><div class="status good">Apalancamiento moderado</div></div><div class="card indicator"><strong>3,60x</strong><small>EBIT / intereses</small><div class="status good">Holgura operativa</div></div><div class="card indicator"><strong>1,67x</strong><small>Razón corriente</small><div class="status good">Liquidez contable</div></div><div class="card indicator"><strong>16,7%</strong><small>Margen EBITDA</small><div class="status watch">Comparar con sector</div></div><div class="card indicator"><strong>12,0%</strong><small>Tasa de descuento</small><div class="status watch">Supuesto crítico</div></div></div><div class="grid2"><section class="card panel"><h3>Mapa de decisión financiera</h3><table class="table"><thead><tr><th>Pregunta</th><th>Indicador principal</th><th>Prueba de estrés</th></tr></thead><tbody><tr><td>¿El proyecto crea valor?</td><td>VAN, TIRM</td><td>Ventas -20%, costos +15%</td></tr><tr><td>¿La empresa puede pagar?</td><td>DSCR, flujo libre</td><td>EBITDA -25%, tasa +300 pb</td></tr><tr><td>¿La estructura es sostenible?</td><td>Deuda/EBITDA</td><td>Refinanciamiento y vencimientos</td></tr><tr><td>¿Existe liquidez real?</td><td>Caja, ciclo conversión</td><td>Cobranza +30 días</td></tr></tbody></table></section><section class="card senior-box"><h3>Lectura de asesor senior</h3><p>La prioridad no es maximizar deuda ni minimizar impuestos aisladamente. Es preservar <b>capacidad de decisión</b>: liquidez, covenants tolerables, vencimientos compatibles con flujos y retorno superior al costo de capital.</p><div class="assumption"><b>Precisión matemática:</b> misma periodicidad para tasa y flujos.</div><div class="assumption"><b>Precisión económica:</b> separar operación, inversión y financiamiento.</div><div class="assumption"><b>Precisión comunicativa:</b> mostrar resultado, supuesto dominante y condición de fracaso.</div></section></div><div class="note-grid" style="margin-top:14px"><article class="card note"><h3>Jerarquía de indicadores</h3><ol><li>Caja y vencimientos.</li><li>Cobertura de deuda.</li><li>Rentabilidad operativa.</li><li>Retorno sobre capital.</li><li>Valor económico bajo escenarios.</li></ol></article><article class="card note"><h3>Errores frecuentes</h3><ul><li>Comparar TIR con una tasa de periodicidad distinta.</li><li>Usar EBITDA como si fuera caja disponible.</li><li>Ignorar capital de trabajo e impuestos en el VAN.</li><li>Simular una cuota sin costo total, seguros o comisiones.</li></ul></article></div>`}
function projects(){return `${head('Evaluación de proyectos','Calcula VAN, TIR, TIRM y payback con flujos configurables.')}<div class="calcgrid"><form class="card form" id="projectForm"><div class="inputgrid"><div class="field"><label>Inversión inicial</label><input id="inv" type="number" value="10000000"></div><div class="field"><label>Tasa descuento anual (%)</label><input id="disc" type="number" value="12" step=".1"></div><div class="field"><label>Tasa reinversión TIRM (%)</label><input id="reinv" type="number" value="8" step=".1"></div><div class="field"><label>Valor terminal</label><input id="terminal" type="number" value="0"></div></div><div><b>Flujos anuales</b><div class="flows" id="flows"></div><button class="btn" type="button" id="add">+ Período</button></div><button class="btn primary">Calcular</button></form><div class="card panel"><h3>Resultados</h3><div id="projectResults"></div><canvas id="cashChart" width="760" height="330"></canvas></div></div>`}
function credit(){return `${head('Diagnóstico de crédito empresarial','Calcula capacidad de servicio y apalancamiento.')}<div class="calcgrid"><form class="card form" id="creditForm"><div class="inputgrid"><div class="field"><label>Ventas anuales</label><input id="sales" type="number" value="120000000"></div><div class="field"><label>EBITDA anual</label><input id="ebitda" type="number" value="24000000"></div><div class="field"><label>EBIT anual</label><input id="ebit" type="number" value="18000000"></div><div class="field"><label>Deuda total</label><input id="debt" type="number" value="50000000"></div><div class="field"><label>Intereses anuales</label><input id="interest" type="number" value="5000000"></div><div class="field"><label>Servicio anual deuda</label><input id="service" type="number" value="14000000"></div><div class="field"><label>Flujo disponible deuda</label><input id="cashdebt" type="number" value="19000000"></div><div class="field"><label>Activos corrientes</label><input id="ca" type="number" value="30000000"></div><div class="field"><label>Pasivos corrientes</label><input id="cl" type="number" value="18000000"></div></div><button class="btn primary">Evaluar</button></form><div class="card panel"><h3>Indicadores</h3><div id="creditResults"></div><div class="notice">Los umbrales bancarios cambian por institución, sector, garantía, madurez y volatilidad. No interpretes una razón aislada como aprobación.</div></div></div>`}

function loans(){return `${head('Simulación profesional de préstamos','Cuota, amortización, costo efectivo y sensibilidad de tasa.')}<div class="calcgrid"><form class="card form" id="loanForm"><div class="inputgrid"><div class="field"><label>Monto principal</label><input id="loanAmount" type="number" value="30000000" min="1"></div><div class="field"><label>Tasa nominal anual (%)</label><input id="loanRate" type="number" value="12" step=".01"></div><div class="field"><label>Plazo (meses)</label><input id="loanMonths" type="number" value="36" min="1" max="360"></div><div class="field"><label>Sistema</label><select id="loanSystem"><option value="french">Francés: cuota constante</option><option value="german">Alemán: amortización constante</option><option value="bullet">Bullet: principal al vencimiento</option></select></div><div class="field"><label>Comisión inicial</label><input id="loanFee" type="number" value="300000"></div><div class="field"><label>Seguro mensual</label><input id="loanInsurance" type="number" value="15000"></div><div class="field"><label>Meses de gracia principal</label><input id="loanGrace" type="number" value="0" min="0"></div><div class="field"><label>Pago extraordinario mes 12</label><input id="loanExtra" type="number" value="0"></div></div><button class="btn primary">Simular préstamo</button><div id="loanSummary"></div></form><div class="card panel"><h3>Saldo, interés y amortización</h3><canvas class="loan-chart" id="loanChart" width="760" height="360"></canvas><div class="chartlegend"><span><i class="dot" style="background:#176b4d"></i>Saldo</span><span><i class="dot" style="background:#b33f49"></i>Interés</span><span><i class="dot" style="background:#2676ad"></i>Amortización</span></div></div></div><div class="scenario-grid" id="loanScenarios" style="margin-top:14px"></div><div class="card panel amort" style="margin-top:14px"><h3>Tabla de amortización</h3><table class="table"><thead><tr><th>Mes</th><th>Cuota</th><th>Interés</th><th>Amortización</th><th>Seguro</th><th>Saldo</th></tr></thead><tbody id="amortRows"></tbody></table></div><div class="note-grid" style="margin-top:14px"><article class="card note"><h3>Matemática financiera</h3><div class="equation">i_m = (1 + i_a)^(1/12) - 1<br>Cuota francesa = P·i_m / [1-(1+i_m)^(-n)]</div><p>La tasa efectiva mensual debe corresponder a la convención de la tasa anual. En este simulador la tasa ingresada se interpreta como efectiva anual y se convierte por equivalencia.</p></article><article class="card note"><h3>Lectura económica</h3><p>El menor pago inicial no implica menor costo. La gracia capitaliza o posterga principal; el sistema bullet concentra riesgo de refinanciamiento; el alemán reduce intereses más rápido, pero exige cuotas iniciales mayores.</p></article></div>`}
function notes(){return `${head('Apuntes avanzados de finanzas','Repaso intelectual profesional con criterios explícitos de rigor y decisión.')}<div class="cards"><article class="card item"><span class="tag">Valor temporal</span><h3>Tasas equivalentes</h3><div class="equation">(1+i_a)=(1+i_m)^12</div><p>Una tasa nominal convertible y una tasa efectiva no son intercambiables. Toda comparación exige igual moneda, plazo, capitalización y base temporal.</p></article><article class="card item"><span class="tag">Proyectos</span><h3>VAN antes que TIR</h3><p>El VAN mide creación de valor en unidades monetarias. La TIR puede ser múltiple, inexistente o inducir rankings erróneos en proyectos mutuamente excluyentes.</p></article><article class="card item"><span class="tag">Riesgo</span><h3>Escenarios y sensibilidad</h3><p>La sensibilidad cambia una variable; el escenario cambia un conjunto coherente. Monte Carlo requiere distribuciones justificadas y correlaciones, no números aleatorios arbitrarios.</p></article><article class="card item"><span class="tag">Crédito</span><h3>DSCR</h3><div class="equation">DSCR = Flujo disponible para deuda / Servicio de deuda</div><p>Un DSCR superior a 1 no basta. Debe sostenerse bajo estrés, después de impuestos, capital de trabajo y mantenimiento.</p></article><article class="card item"><span class="tag">Capital</span><h3>Costo de capital</h3><div class="equation">WACC = E/(D+E)·Ke + D/(D+E)·Kd·(1-T)</div><p>Solo es válido si la estructura objetivo, riesgo operacional y tratamiento tributario son coherentes con los flujos descontados.</p></article><article class="card item"><span class="tag">Comunicación</span><h3>Informe ejecutivo</h3><p>Debe expresar: decisión, magnitud, supuestos dominantes, rango adverso, liquidez mínima y evento que invalida la conclusión.</p></article></div><div class="grid2"><article class="card panel"><h3>Ejemplo trabajado: préstamo</h3><ol><li>Principal: CLP 30.000.000.</li><li>Tasa efectiva anual: 12%.</li><li>Tasa mensual equivalente: (1,12)^(1/12)-1 ≈ 0,9489%.</li><li>Plazo: 36 meses.</li><li>Cuota francesa aproximada: CLP 987.000, antes de seguro.</li><li>La suma de cuotas no es el costo total si existen comisión, seguro, impuestos o prepago.</li></ol></article><article class="card panel"><h3>Checklist de revisión doctoral</h3><ul><li>¿La variable tiene definición operacional?</li><li>¿Las unidades y periodicidades son compatibles?</li><li>¿El modelo distingue identidad contable y relación causal?</li><li>¿El resultado es robusto a supuestos razonables?</li><li>¿La recomendación puede ser falsada por un dato observable?</li></ul></article></div>`}
function loanSchedule(P,annual,n,system,fee,insurance,grace,extra){const r=Math.pow(1+annual,1/12)-1;let bal=P,rows=[],base=system==='french'&&r!==0?P*r/(1-Math.pow(1+r,-Math.max(1,n-grace))):P/Math.max(1,n-grace);for(let m=1;m<=n;m++){let interest=bal*r,amort=0,payment=0;if(m<=grace){payment=interest+insurance}else if(system==='french'){let rem=n-m+1,principalPayment=r===0?bal/rem:bal*r/(1-Math.pow(1+r,-rem));amort=Math.max(0,principalPayment-interest);payment=principalPayment+insurance}else if(system==='german'){amort=Math.min(bal,P/Math.max(1,n-grace));payment=amort+interest+insurance}else{amort=m===n?bal:0;payment=interest+amort+insurance}if(m===12&&extra>0){let ex=Math.min(extra,bal-amort);amort+=ex;payment+=ex}bal=Math.max(0,bal-amort);rows.push({m,payment,interest,amort,insurance,bal});if(bal<=.01){break}}return{rows,r,fee,total:rows.reduce((s,x)=>s+x.payment,fee),interest:rows.reduce((s,x)=>s+x.interest,0)}}
function effectiveCost(P,net,rows){let low=-.99,high=2,f=x=>-net+rows.reduce((s,v,i)=>s+v.payment/Math.pow(1+x,i+1),0);if(f(low)*f(high)>0)return NaN;for(let i=0;i<250;i++){let mid=(low+high)/2;if(f(low)*f(mid)<=0)high=mid;else low=mid}return Math.pow(1+(low+high)/2,12)-1}
function bindLoans(){function run(){let P=+$('#loanAmount').value,annual=+$('#loanRate').value/100,n=+$('#loanMonths').value,system=$('#loanSystem').value,fee=+$('#loanFee').value,ins=+$('#loanInsurance').value,grace=+$('#loanGrace').value,extra=+$('#loanExtra').value;if(!(P>0&&annual>=0&&n>0&&grace<n)){ $('#loanSummary').innerHTML='<p class="warning">Revisa monto, tasa, plazo y gracia.</p>';return}let out=loanSchedule(P,annual,n,system,fee,ins,grace,extra),cae=effectiveCost(P,P-fee,out.rows),first=out.rows[0]?.payment||0,last=out.rows.at(-1)?.payment||0;$('#loanSummary').innerHTML=`<div class="resultline"><span>Primera cuota total</span><b>${fmt(first)}</b></div><div class="resultline"><span>Última cuota total</span><b>${fmt(last)}</b></div><div class="resultline"><span>Intereses totales</span><b>${fmt(out.interest)}</b></div><div class="resultline"><span>Desembolso total</span><b>${fmt(out.total)}</b></div><div class="resultline"><span>Costo efectivo anual estimado</span><b>${Number.isFinite(cae)?(cae*100).toFixed(2)+'%':'No calculable'}</b></div>`;$('#amortRows').innerHTML=out.rows.map(x=>`<tr><td>${x.m}</td><td>${fmt(x.payment)}</td><td>${fmt(x.interest)}</td><td>${fmt(x.amort)}</td><td>${fmt(x.insurance)}</td><td>${fmt(x.bal)}</td></tr>`).join('');let rates=[Math.max(0,annual-.03),annual,annual+.03];$('#loanScenarios').innerHTML=rates.map((z,i)=>{let o=loanSchedule(P,z,n,system,fee,ins,grace,extra);return `<div class="card scenario"><h4>${['Tasa -300 pb','Escenario base','Tasa +300 pb'][i]}</h4><div>${(z*100).toFixed(2)}% anual</div><b>${fmt(o.rows[0]?.payment||0)}</b><small class="muted"> primera cuota</small></div>`}).join('');drawLoan(out.rows)}$('#loanForm').onsubmit=e=>{e.preventDefault();run()};$('#loanSystem').onchange=run;run()}
function drawLoan(rows){let cv=$('#loanChart'),c=cv.getContext('2d'),w=cv.width,h=cv.height;c.clearRect(0,0,w,h);c.strokeStyle='#748379';c.beginPath();c.moveTo(55,20);c.lineTo(55,h-42);c.lineTo(w-20,h-42);c.stroke();let max=Math.max(...rows.flatMap(x=>[x.bal,x.interest,x.amort]),1),px=i=>55+i/Math.max(1,rows.length-1)*(w-80),py=v=>h-42-v/max*(h-70),draw=(key,col)=>{c.strokeStyle=col;c.lineWidth=3;c.beginPath();rows.forEach((x,i)=>i?c.lineTo(px(i),py(x[key])):c.moveTo(px(i),py(x[key])));c.stroke()};draw('bal','#176b4d');draw('interest','#b33f49');draw('amort','#2676ad')}
const prods=[['Crédito comercial','Capital de trabajo o inversión','Tasa, CAE, garantías'],['Factoring','Anticipo de facturas','Costo efectivo y recurso'],['Leasing','Activo fijo','Cuota, opción compra, impuestos'],['Boleta de garantía','Contratos y licitaciones','Comisión y contragarantía'],['Cuenta corriente','Tesorería','Comisiones y línea'],['Depósito a plazo','Excedentes','Tasa, plazo, liquidez']];function products(){return `${head('Productos financieros','Matriz de selección según necesidad empresarial.')}<div class="cards">${prods.map(x=>`<article class="card item"><span class="tag">${x[1]}</span><h3>${x[0]}</h3><p class="muted">Revisar: ${x[2]}.</p></article>`).join('')}</div>`}
function tax(){return `${head('Tributación y calendario','Resumen operativo para empresas chilenas.')}<div class="grid2"><div class="card panel"><h3>Regímenes</h3><table class="table"><tr><th>Régimen</th><th>Uso</th></tr><tr><td>Pro Pyme General</td><td>Pyme que cumple requisitos; IDPC informado para AT 2026: 12,5%.</td></tr><tr><td>Pro Pyme Transparente</td><td>Base atribuida a propietarios elegibles; empresa liberada de IDPC.</td></tr><tr><td>General semiintegrado</td><td>Artículo 14 A, contabilidad completa.</td></tr><tr><td>Renta presunta</td><td>Solo actividades y requisitos legales específicos.</td></tr></table></div><div class="card panel"><h3>Calendario de control</h3><ul><li>Mensual: F29, F50 cuando corresponda, remuneraciones y cotizaciones.</li><li>Anual: declaraciones juradas y Operación Renta.</li><li>Variable: patente municipal, permisos, contribuciones y obligaciones sectoriales.</li></ul><p class="source">Verifica fechas en SII y Previred según perfil.</p></div></div>`}
function bindProjects(){let box=$('#flows');[3500000,4000000,4500000,5000000].forEach(add);function add(v=0){box.insertAdjacentHTML('beforeend',`<div class="flow"><span>Año ${box.children.length+1}</span><input type="number" value="${v}"><button type="button">×</button></div>`);box.lastElementChild.querySelector('button').onclick=e=>e.target.parentElement.remove()}$('#add').onclick=()=>add();$('#projectForm').onsubmit=e=>{e.preventDefault();let inv=+$('#inv').value,r=+$('#disc').value/100,rr=+$('#reinv').value/100,term=+$('#terminal').value,fs=[...box.querySelectorAll('input')].map(x=>+x.value);if(fs.length)fs[fs.length-1]+=term;let npv=-inv+fs.reduce((s,x,i)=>s+x/(1+r)**(i+1),0);let low=-.999,high=10,fn=x=>-inv+fs.reduce((s,v,i)=>s+v/(1+x)**(i+1),0);let irr=NaN;if(fn(low)*fn(high)<=0){for(let i=0;i<200;i++){let m=(low+high)/2;if(fn(low)*fn(m)<=0)high=m;else low=m}irr=(low+high)/2}let fv=fs.reduce((s,x,i)=>s+Math.max(0,x)*(1+rr)**(fs.length-1-i),0),mirr=(fv/inv)**(1/fs.length)-1,cum=-inv,pay='No recuperado';for(let i=0;i<fs.length;i++){let before=cum;cum+=fs[i];if(cum>=0&&pay==='No recuperado')pay=(i+(0-before)/fs[i]).toFixed(2)+' años'}$('#projectResults').innerHTML=`<div class="resultline"><span>VAN</span><b>${fmt(npv)}</b></div><div class="resultline"><span>TIR</span><b>${Number.isFinite(irr)?(irr*100).toFixed(2)+'%':'No calculable'}</b></div><div class="resultline"><span>TIRM</span><b>${(mirr*100).toFixed(2)}%</b></div><div class="resultline"><span>Payback</span><b>${pay}</b></div>`;drawCash([-inv,...fs])}}
function drawCash(fs){let cv=$('#cashChart'),c=cv.getContext('2d'),w=cv.width,h=cv.height;axes(c,w,h,'Período','Flujo');let max=Math.max(...fs.map(Math.abs),1),bw=(w-80)/fs.length*.55;c.fillStyle='#176b4d';fs.forEach((v,i)=>{let x=60+i*(w-80)/fs.length,y=h/2-v/max*(h*.36);c.fillStyle=v>=0?'#176b4d':'#b33f49';c.fillRect(x,Math.min(h/2,y),bw,Math.abs(h/2-y));c.fillText(String(i),x+5,h-24)})}
function bindCredit(){$('#creditForm').onsubmit=e=>{e.preventDefault();let eb=+$('#ebitda').value,debt=+$('#debt').value,ebit=+$('#ebit').value,int=+$('#interest').value,svc=+$('#service').value,cf=+$('#cashdebt').value,ca=+$('#ca').value,cl=+$('#cl').value;let dscr=cf/svc,lev=debt/eb,cov=ebit/int,liq=ca/cl;$('#creditResults').innerHTML=`<div class="resultline"><span>DSCR</span><b>${dscr.toFixed(2)}x</b></div><div class="resultline"><span>Deuda/EBITDA</span><b>${lev.toFixed(2)}x</b></div><div class="resultline"><span>Cobertura intereses</span><b>${cov.toFixed(2)}x</b></div><div class="resultline"><span>Razón corriente</span><b>${liq.toFixed(2)}x</b></div>`};$('#creditForm').requestSubmit()}
const FIRST='dashboard',PAGES={dashboard,projects,loans,credit,products,tax,notes},TITLES={dashboard:'Panel financiero',projects:'Evaluación de proyectos',loans:'Simulación de préstamos',credit:'Crédito empresarial',products:'Productos financieros',tax:'Tributación',notes:'Apuntes avanzados'},BINDS={projects:bindProjects,loans:bindLoans,credit:bindCredit},THEME='od-finance-theme';

const $=s=>document.querySelector(s),fmt=n=>new Intl.NumberFormat('es-CL',{style:'currency',currency:'CLP',maximumFractionDigits:0}).format(n);let page=location.hash.slice(1)||FIRST;
function head(t,s){return `<div class="head"><div><h2>${t}</h2><p>${s}</p></div></div>`}function axes(ctx,w,h,x,y){ctx.clearRect(0,0,w,h);ctx.strokeStyle='#748379';ctx.beginPath();ctx.moveTo(55,20);ctx.lineTo(55,h-42);ctx.lineTo(w-20,h-42);ctx.stroke();ctx.fillStyle='#66746b';ctx.font='13px system-ui';ctx.fillText(y,12,22);ctx.fillText(x,w-70,h-12)}function line(ctx,pts,color,label,dash=[]){ctx.save();ctx.setLineDash(dash);ctx.strokeStyle=color;ctx.lineWidth=3;ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.stroke();ctx.restore();ctx.fillStyle=color;ctx.font='bold 12px system-ui';let p=pts[pts.length-1];ctx.fillText(label,p[0]-40,p[1]-8)}function toast(x){$('#toast').innerHTML=`<div class="toast">${x}</div>`;setTimeout(()=>$('#toast').innerHTML='',2000)}
function render(){page=location.hash.slice(1)||FIRST;if(!PAGES[page])page=FIRST;$('#view').innerHTML=PAGES[page]();$('#title').textContent=TITLES[page];document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));if(BINDS[page])BINDS[page]()}$('#nav').onclick=e=>{let b=e.target.closest('[data-page]');if(b){location.hash=b.dataset.page;$('#side').classList.remove('open')}};window.onhashchange=render;$('#menu').onclick=()=>$('#side').classList.toggle('open');$('#theme').onclick=()=>{let d=document.documentElement.dataset.theme==='dark';document.documentElement.dataset.theme=d?'light':'dark';localStorage.setItem(THEME,d?'light':'dark')};document.documentElement.dataset.theme=localStorage.getItem(THEME)||'light';render();
</script></body></html>
