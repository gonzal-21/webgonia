<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="SPA unificada de microeconomía y macroeconomía para OpenDirectory.">
<title>OpenDirectory Economics Lab</title>
<style>
:root{--bg:#f4f7f5;--card:#fff;--soft:#eaf1ed;--text:#17231c;--muted:#65746a;--line:#d5e0d8;--brand:#176b4d;--brand2:#0c4a34;--red:#b33f49;--blue:#2676ad;--gold:#d99720;--purple:#793fa4;--shadow:0 14px 40px rgba(20,73,48,.1);--r:16px}
[data-theme=dark]{--bg:#0c1410;--card:#142019;--soft:#1c2a22;--text:#eef7f1;--muted:#a0b2a6;--line:#2b3d31;--brand:#4db989;--brand2:#329568;--red:#ed7b84;--blue:#74b6e5;--gold:#f0bd59;--purple:#c18ce3;--shadow:0 16px 44px rgba(0,0,0,.3)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif}button,input,select{font:inherit}button{cursor:pointer}.app{display:grid;grid-template-columns:260px 1fr;min-height:100vh}.side{height:100vh;position:sticky;top:0;background:#092f22;color:#fff;padding:16px 13px;display:flex;flex-direction:column;z-index:30}.brand{display:flex;gap:10px;align-items:center;font-weight:900;padding:6px 8px 20px}.mark{width:38px;height:38px;border-radius:11px;background:#ddf7e8;color:#0c5338;display:grid;place-items:center}.group{font-size:.72rem;text-transform:uppercase;letter-spacing:.1em;color:#86af98;margin:16px 9px 5px}.nav{display:grid;gap:4px}.nav button{border:0;background:transparent;color:#cfe3d7;padding:10px 11px;border-radius:9px;text-align:left}.nav button:hover,.nav button.active{background:#16543f;color:#fff}.sidefoot{margin-top:auto;border-top:1px solid #1d583f;padding:13px 8px 0;color:#afd0bd;font-size:.82rem}.main{min-width:0}.top{height:68px;position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--card) 93%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:0 20px}.top h1{font-size:1.05rem;margin:0}.spacer{flex:1}.btn{border:1px solid var(--line);background:var(--card);color:var(--text);padding:9px 12px;border-radius:9px;font-weight:730}.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}.menu{display:none}.content{padding:20px;max-width:1500px;margin:auto}.hero{padding:24px;background:linear-gradient(135deg,color-mix(in srgb,var(--brand) 11%,var(--card)),var(--card));border:1px solid var(--line);border-radius:var(--r);margin-bottom:14px}.hero h2{font-size:2rem;margin:0 0 5px;letter-spacing:-.035em}.hero p{color:var(--muted);margin:0}.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}.grid{display:grid;grid-template-columns:.8fr 1.2fr;gap:14px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}.item{padding:18px}.item h3{margin:0 0 6px}.item p{color:var(--muted)}.form{padding:17px;display:grid;grid-template-columns:1fr 1fr;gap:10px}.form label{display:grid;gap:5px;font-weight:680}.form input,.form select{width:100%;border:1px solid var(--line);background:var(--card);color:var(--text);padding:9px;border-radius:8px}.wide{grid-column:1/-1}.result{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px}.metric{padding:11px;background:var(--soft);border-radius:9px}.metric strong{display:block;font-size:1.25rem}.metric span,.muted{color:var(--muted);font-size:.8rem}.chart{padding:16px}.chart canvas{width:100%;height:400px;display:block}.legend{display:flex;gap:13px;flex-wrap:wrap;color:var(--muted);font-size:.82rem}.dot{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:4px}.notice,.formula{padding:11px;border-radius:9px;margin-top:10px}.notice{background:color-mix(in srgb,var(--gold) 14%,var(--card));border:1px solid color-mix(in srgb,var(--gold) 45%,var(--line))}.formula{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;background:var(--soft)}.table{width:100%;border-collapse:collapse}.table th,.table td{border:1px solid var(--line);padding:10px;text-align:center}.controls{display:flex;gap:7px;flex-wrap:wrap}.hidden{display:none!important}.modalback{position:fixed;inset:0;background:rgba(0,0,0,.5);display:grid;place-items:center;padding:20px;z-index:50}.modal{width:min(680px,100%);background:var(--card);padding:20px;border-radius:16px}.modal h3{margin-top:0}
@media(max-width:1000px){.grid{grid-template-columns:1fr}.cards{grid-template-columns:repeat(2,1fr)}}@media(max-width:720px){.app{grid-template-columns:1fr}.side{position:fixed;left:-280px;width:260px;transition:.2s}.side.open{left:0}.menu{display:block}.content{padding:14px}.form,.result,.cards{grid-template-columns:1fr}.top{padding:0 12px}}
</style>
</head>
<body>
<div class="app"><aside class="side" id="side"><div class="brand"><span class="mark">OD</span><span>Economics Lab<br><small>SPA unificada</small></span></div><nav class="nav" id="nav"><button class="active" data-page="dashboard">▦ Panel</button><div class="group">Microeconomía</div><button data-page="market">⌁ Oferta y demanda</button><button data-page="elasticity">↔ Elasticidad</button><button data-page="costs">∿ Costos</button><button data-page="nash">♟ Equilibrio de Nash</button><div class="group">Macroeconomía</div><button data-page="islm">⌗ IS-LM</button><button data-page="adas">↕ OA-DA</button><button data-page="solow">↗ Solow</button></nav><div class="sidefoot">Modelos pedagógicos. No son estimaciones ni recomendaciones de política.</div></aside><main class="main"><header class="top"><button class="btn menu" id="menu">☰</button><h1 id="title">Panel unificado</h1><div class="spacer"></div><button class="btn" id="theme">◐ Tema</button><button class="btn primary" id="export">Exportar estado</button></header><section class="content" id="view"></section></main></div><div id="overlay"></div>
<script>
(()=>{const $=s=>document.querySelector(s),state={};let page=location.hash.slice(1)||'dashboard';
function hero(t,p){return `<section class="hero"><h2>${t}</h2><p>${p}</p></section>`}function num(form){return Object.fromEntries([...new FormData(form)].map(([k,v])=>[k,Number(v)]))}function axes(cv,xlab,ylab){const d=devicePixelRatio||1,r=cv.getBoundingClientRect();cv.width=Math.max(640,r.width*d);cv.height=400*d;const c=cv.getContext('2d'),w=cv.width,h=cv.height;c.clearRect(0,0,w,h);c.strokeStyle='#819087';c.beginPath();c.moveTo(60,25);c.lineTo(60,h-52);c.lineTo(w-25,h-52);c.stroke();c.fillStyle='#65746a';c.font=`${12*d}px system-ui`;c.fillText(ylab,10,24);c.fillText(xlab,w-80,h-16);return{c,w,h,d}}function plot(cv,opt){const{xMin,xMax,yMin,yMax}=opt,{c,w,h,d}=axes(cv,opt.xLabel,opt.yLabel),px=x=>60+(x-xMin)/(xMax-xMin)*(w-90),py=y=>h-52-(y-yMin)/(yMax-yMin)*(h-88);for(const s of opt.series){c.save();c.strokeStyle=s.color;c.lineWidth=3*d;c.setLineDash(s.dashed?[8*d,6*d]:[]);c.beginPath();s.points.forEach((p,i)=>i?c.lineTo(px(p[0]),py(p[1])):c.moveTo(px(p[0]),py(p[1])));c.stroke();c.restore()}for(const m of opt.markers||[]){c.fillStyle=m.color;c.beginPath();c.arc(px(m.x),py(m.y),6*d,0,Math.PI*2);c.fill();c.fillText(m.label,px(m.x)+8*d,py(m.y)-8*d)}}
function dashboard(){return hero('OpenDirectory Economics Lab','Laboratorio integrado de microeconomía, macroeconomía y teoría de juegos.')+`<div class="cards"><article class="card item"><h3>Oferta y demanda</h3><p>Equilibrio, impuestos, cuña tributaria y desplazamientos.</p></article><article class="card item"><h3>Elasticidad y costos</h3><p>Punto medio, CMg, CMe y CVMe.</p></article><article class="card item"><h3>Teoría de juegos</h3><p>Nash puro y mixto en juegos 2×2.</p></article><article class="card item"><h3>IS-LM</h3><p>Política fiscal, monetaria y equilibrio conjunto.</p></article><article class="card item"><h3>OA-DA</h3><p>Shocks agregados con advertencia pedagógica.</p></article><article class="card item"><h3>Solow</h3><p>Capital, producto y consumo estacionarios.</p></article></div>`}
function market(){return hero('Oferta y demanda','Ajusta parámetros y observa el equilibrio en tiempo real.')+`<div class="notice"><b>Ceteris paribus:</b> los desplazamientos cambian la función; un cambio de precio sobre la misma función es movimiento sobre la curva.</div><div class="grid"><form class="card form" id="mf"><label>a demanda<input name="a" type="range" min="40" max="240" value="120"></label><label>b demanda<input name="b" type="range" min=".2" max="6" step=".1" value="2"></label><label>c oferta<input name="c" type="range" min="-40" max="100" value="20"></label><label>d oferta<input name="d" type="range" min=".2" max="6" step=".1" value="3"></label><label>Impuesto<input name="tax" type="range" min="0" max="50" value="10"></label><label>Δ demanda<input name="shiftD" type="range" min="-60" max="60" value="0"></label><label>Δ oferta<input name="shiftS" type="range" min="-60" max="60" value="0"></label><div id="mr" class="wide result"></div></form><section class="card chart"><canvas id="mc"></canvas><div class="legend"><span><i class="dot" style="background:var(--red)"></i>Demanda</span><span><i class="dot" style="background:var(--brand)"></i>Oferta</span><span><i class="dot" style="background:var(--blue)"></i>Oferta + impuesto</span></div></section></div>`}
function bindMarket(){const f=$('#mf');function u(){const v=num(f),a=v.a+v.shiftD,c=v.c+v.shiftS,p=(a-c)/(v.b+v.d),q=a-v.b*p,pc=(a-c+v.d*v.tax)/(v.b+v.d),pp=pc-v.tax,qt=a-v.b*pc;$('#mr').innerHTML=`<div class="metric"><small>P*</small><strong>${p.toFixed(2)}</strong></div><div class="metric"><small>Q*</small><strong>${q.toFixed(2)}</strong></div><div class="metric"><small>Pc/Pp</small><strong>${pc.toFixed(2)}/${pp.toFixed(2)}</strong></div><div class="metric"><small>Recaudación</small><strong>${(v.tax*qt).toFixed(2)}</strong></div>`;const maxQ=Math.max(a,10),maxP=Math.max(a/v.b+v.tax,10),qs=Array.from({length:120},(_,i)=>i/119*maxQ);plot($('#mc'),{xLabel:'Cantidad',yLabel:'Precio',xMin:0,xMax:maxQ,yMin:Math.min(0,-c/v.d),yMax:maxP,series:[{color:'#b33f49',points:qs.map(x=>[x,(a-x)/v.b])},{color:'#176b4d',points:qs.map(x=>[x,(x-c)/v.d])},{color:'#2676ad',dashed:true,points:qs.map(x=>[x,(x-c)/v.d+v.tax])}],markers:[{label:'E',x:q,y:p,color:'#17231c'},{label:'Et',x:qt,y:pc,color:'#793fa4'}]});state.market=v}f.oninput=u;u()}
function elasticity(){return hero('Elasticidad','Calcula elasticidad precio, ingreso o cruzada por punto medio.')+`<div class="grid"><form class="card form" id="ef"><label>Tipo<select name="type"><option value="price">Precio</option><option value="income">Ingreso</option><option value="cross">Cruzada</option></select></label><label>Q inicial<input name="q1" type="number" value="100"></label><label>Q final<input name="q2" type="number" value="80"></label><label>X inicial<input name="x1" type="number" value="10"></label><label>X final<input name="x2" type="number" value="12"></label><div id="er" class="wide result"></div></form><section class="card chart"><canvas id="ec"></canvas></section></div>`}
function bindElasticity(){const f=$('#ef');function u(){const raw=Object.fromEntries(new FormData(f)),q1=+raw.q1,q2=+raw.q2,x1=+raw.x1,x2=+raw.x2,E=((q2-q1)/((q1+q2)/2))/((x2-x1)/((x1+x2)/2)),type=raw.type,label=type==='price'?(Math.abs(E)>1?'Elástica':Math.abs(E)<1?'Inelástica':'Unitaria'):type==='income'?(E>1?'Superior':E>0?'Normal':'Inferior'):(E>0?'Sustitutos':E<0?'Complementarios':'Independientes');$('#er').innerHTML=`<div class="metric"><small>Elasticidad</small><strong>${E.toFixed(3)}</strong></div><div class="metric"><small>Clasificación</small><strong>${label}</strong></div>`;plot($('#ec'),{xLabel:'X',yLabel:'Q',xMin:0,xMax:Math.max(x1,x2)*1.4,yMin:0,yMax:Math.max(q1,q2)*1.3,series:[{color:'#2676ad',points:[[x1,q1],[x2,q2]]}],markers:[{label:'A',x:x1,y:q1,color:'#17231c'},{label:'B',x:x2,y:q2,color:'#793fa4'}]});state.elasticity={q1,q2,x1,x2,E,type}}f.oninput=u;u()}
function costs(){return hero('Costos de la empresa','CT=CF+αQ+βQ²; compara costo marginal y costos medios.')+`<div class="grid"><form class="card form" id="cf"><label>CF<input name="F" type="number" value="1000"></label><label>α<input name="a" type="number" value="20"></label><label>β<input name="b" type="number" step=".1" value=".5"></label><label>Q<input name="q" type="number" min="1" value="20"></label><div id="cr" class="wide result"></div></form><section class="card chart"><canvas id="cc"></canvas><div class="formula">CMg=α+2βQ · CMe=CT/Q · CVMe=CV/Q</div></section></div>`}
function bindCosts(){const f=$('#cf');function u(){const v=num(f),cv=v.a*v.q+v.b*v.q*v.q,ct=v.F+cv,mc=v.a+2*v.b*v.q,ac=ct/v.q,avc=cv/v.q;$('#cr').innerHTML=`<div class="metric"><small>CT</small><strong>${ct.toFixed(2)}</strong></div><div class="metric"><small>CMg</small><strong>${mc.toFixed(2)}</strong></div><div class="metric"><small>CMe</small><strong>${ac.toFixed(2)}</strong></div><div class="metric"><small>CVMe</small><strong>${avc.toFixed(2)}</strong></div>`;const maxQ=Math.max(50,v.q*2),qs=Array.from({length:100},(_,i)=>1+i/99*(maxQ-1)),M=q=>v.a+2*v.b*q,A=q=>(v.F+v.a*q+v.b*q*q)/q,V=q=>v.a+v.b*q,top=Math.max(...qs.flatMap(q=>[M(q),A(q),V(q)]));plot($('#cc'),{xLabel:'Q',yLabel:'Costo',xMin:0,xMax:maxQ,yMin:0,yMax:top*1.1,series:[{color:'#b33f49',points:qs.map(q=>[q,M(q)])},{color:'#176b4d',points:qs.map(q=>[q,A(q)])},{color:'#2676ad',dashed:true,points:qs.map(q=>[q,V(q)])}],markers:[{label:'Q',x:v.q,y:mc,color:'#793fa4'}]});state.costs=v}f.oninput=u;u()}
function nash(){return hero('Equilibrio de Nash 2×2','Edita estrategias y pagos. Detecta equilibrios puros y mixtos interiores.')+`<div class="grid"><form class="card form" id="nf"><label>Fila A<input name="r0" value="Cooperar"></label><label>Fila B<input name="r1" value="No cooperar"></label><label>Columna A<input name="c0" value="Cooperar"></label><label>Columna B<input name="c1" value="No cooperar"></label>${['00','01','10','11'].map(x=>`<label>Pago fila ${x}<input name="u${x}" type="number" value="${x==='00'?3:x==='01'?0:x==='10'?5:1}"></label><label>Pago columna ${x}<input name="v${x}" type="number" value="${x==='00'?3:x==='01'?5:x==='10'?0:1}"></label>`).join('')}</form><section class="card item"><div id="matrix"></div><div id="nr" class="result"></div><div class="notice">Nash no implica eficiencia ni justicia; solo ausencia de desviación unilateral rentable.</div></section></div>`}
function bindNash(){const f=$('#nf');function u(){const d=Object.fromEntries(new FormData(f)),P=[[[+d.u00,+d.v00],[+d.u01,+d.v01]],[[+d.u10,+d.v10],[+d.u11,+d.v11]]],pure=[];for(let r=0;r<2;r++)for(let c=0;c<2;c++){if(P[r][c][0]>=P[1-r][c][0]&&P[r][c][1]>=P[r][1-c][1])pure.push([r,c])}const denQ=P[0][0][0]-P[0][1][0]-P[1][0][0]+P[1][1][0],denP=P[0][0][1]-P[0][1][1]-P[1][0][1]+P[1][1][1],q=denQ?(P[1][1][0]-P[0][1][0])/denQ:NaN,p=denP?(P[1][1][1]-P[1][0][1])/denP:NaN,mix=p>=0&&p<=1&&q>=0&&q<=1;$('#matrix').innerHTML=`<table class="table"><tr><th></th><th>${d.c0}</th><th>${d.c1}</th></tr><tr><th>${d.r0}</th><td>(${d.u00},${d.v00})</td><td>(${d.u01},${d.v01})</td></tr><tr><th>${d.r1}</th><td>(${d.u10},${d.v10})</td><td>(${d.u11},${d.v11})</td></tr></table>`;$('#nr').innerHTML=`<div class="metric"><small>Nash puros</small><strong>${pure.length}</strong><span>${pure.map(([r,c])=>(r?d.r1:d.r0)+' / '+(c?d.c1:d.c0)).join('; ')||'Ninguno'}</span></div><div class="metric"><small>Mixto</small><strong>${mix?`p=${p.toFixed(3)}, q=${q.toFixed(3)}`:'No interior'}</strong></div>`;state.nash={P,pure,p,q}}f.oninput=u;u()}
function islm(){return hero('IS-LM','Compara equilibrio inicial y shocks fiscal/monetario.')+`<div class="grid"><form class="card form" id="if">${[['C0',50],['c',.75],['T',40],['I0',120],['b',20],['G',100],['M',200],['k',.5],['h',40],['dG',40],['dM',60]].map(x=>`<label>${x[0]}<input name="${x[0]}" type="number" step=".01" value="${x[1]}"></label>`).join('')}<div id="ir" class="wide result"></div></form><section class="card chart"><canvas id="ic"></canvas></section></div>`}
function bindISLM(){const f=$('#if');function u(){const v=num(f),eq=(G,M)=>{const A=v.C0-v.c*v.T+v.I0+G,Y=(A+v.b*M/v.h)/((1-v.c)+v.b*v.k/v.h),i=(v.k*Y-M)/v.h;return{A,Y,i}},e0=eq(v.G,v.M),e1=eq(v.G+v.dG,v.M+v.dM);$('#ir').innerHTML=`<div class="metric"><small>Y₀/i₀</small><strong>${e0.Y.toFixed(2)}/${e0.i.toFixed(2)}</strong></div><div class="metric"><small>Y₁/i₁</small><strong>${e1.Y.toFixed(2)}/${e1.i.toFixed(2)}</strong></div><div class="metric"><small>ΔY</small><strong>${(e1.Y-e0.Y).toFixed(2)}</strong></div><div class="metric"><small>Δi</small><strong>${(e1.i-e0.i).toFixed(2)}</strong></div>`;const maxY=Math.max(e0.Y,e1.Y)*1.7,ys=Array.from({length:120},(_,i)=>i/119*maxY),IS=(y,A)=>(A-(1-v.c)*y)/v.b,LM=(y,M)=>(v.k*y-M)/v.h,all=ys.flatMap(y=>[IS(y,e0.A),IS(y,e1.A),LM(y,v.M),LM(y,v.M+v.dM)]);plot($('#ic'),{xLabel:'Y',yLabel:'i',xMin:0,xMax:maxY,yMin:Math.min(...all),yMax:Math.max(...all),series:[{color:'#b33f49',points:ys.map(y=>[y,IS(y,e0.A)])},{color:'#176b4d',points:ys.map(y=>[y,LM(y,v.M)])},{color:'#d99720',dashed:true,points:ys.map(y=>[y,IS(y,e1.A)])},{color:'#2676ad',dashed:true,points:ys.map(y=>[y,LM(y,v.M+v.dM)])}],markers:[{label:'E₀',x:e0.Y,y:e0.i,color:'#17231c'},{label:'E₁',x:e1.Y,y:e1.i,color:'#793fa4'}]});state.islm=v}f.oninput=u;u()}
function adas(){return hero('Oferta y demanda agregada','Modelo pedagógico de shocks agregados, no una estimación de Chile.')+`<div class="grid"><form class="card form" id="af"><label>Y potencial<input name="Y" type="number" value="100"></label><label>P base<input name="P" type="number" value="100"></label><label>Shock DA<input name="d" type="range" min="-50" max="50" value="10"></label><label>Shock OA<input name="s" type="range" min="-50" max="50" value="0"></label><div id="ar" class="wide result"></div></form><section class="card chart"><canvas id="ac"></canvas></section></div>`}
function bindADAS(){const f=$('#af');function u(){const v=num(f),Y1=v.Y+.6*v.d-.5*v.s,P1=v.P+.4*v.d+.7*v.s;$('#ar').innerHTML=`<div class="metric"><small>Y₁</small><strong>${Y1.toFixed(1)}</strong></div><div class="metric"><small>P₁</small><strong>${P1.toFixed(1)}</strong></div><div class="metric"><small>ΔY</small><strong>${(Y1-v.Y).toFixed(1)}</strong></div><div class="metric"><small>ΔP</small><strong>${(P1-v.P).toFixed(1)}</strong></div>`;const ys=Array.from({length:100},(_,i)=>40+i),D=y=>160-.6*y,D1=y=>D(y)+.4*v.d,S=y=>40+.6*y,S1=y=>S(y)+.7*v.s;plot($('#ac'),{xLabel:'Producción',yLabel:'Precios',xMin:40,xMax:140,yMin:20,yMax:160,series:[{color:'#b33f49',points:ys.map(y=>[y,D(y)])},{color:'#d99720',dashed:true,points:ys.map(y=>[y,D1(y)])},{color:'#176b4d',points:ys.map(y=>[y,S(y)])},{color:'#2676ad',dashed:true,points:ys.map(y=>[y,S1(y)])}],markers:[{label:'E₁',x:Y1,y:P1,color:'#793fa4'}]});state.adas=v}f.oninput=u;u()}
function solow(){return hero('Crecimiento de Solow','Estado estacionario por trabajador efectivo.')+`<div class="grid"><form class="card form" id="sf"><label>Ahorro s<input name="s" type="range" min=".05" max=".7" step=".01" value=".25"></label><label>Capital α<input name="a" type="range" min=".1" max=".8" step=".01" value=".35"></label><label>Depreciación δ<input name="d" type="number" step=".01" value=".05"></label><label>Población n<input name="n" type="number" step=".01" value=".01"></label><label>Tecnología g<input name="g" type="number" step=".01" value=".02"></label><div id="sr" class="wide result"></div></form><section class="card chart"><canvas id="sc"></canvas><div class="formula">s·k^α=(δ+n+g)k</div></section></div>`}
function bindSolow(){const f=$('#sf');function u(){const v=num(f),be=v.d+v.n+v.g,k=(v.s/be)**(1/(1-v.a)),y=k**v.a,c=(1-v.s)*y;$('#sr').innerHTML=`<div class="metric"><small>k*</small><strong>${k.toFixed(3)}</strong></div><div class="metric"><small>y*</small><strong>${y.toFixed(3)}</strong></div><div class="metric"><small>c*</small><strong>${c.toFixed(3)}</strong></div><div class="metric"><small>δ+n+g</small><strong>${be.toFixed(3)}</strong></div>`;const max=k*2.3,ks=Array.from({length:120},(_,i)=>.001+i/119*max),top=Math.max(...ks.flatMap(x=>[v.s*x**v.a,be*x]));plot($('#sc'),{xLabel:'Capital k',yLabel:'Inversión',xMin:0,xMax:max,yMin:0,yMax:top*1.1,series:[{color:'#176b4d',points:ks.map(x=>[x,v.s*x**v.a])},{color:'#b33f49',points:ks.map(x=>[x,be*x])}],markers:[{label:'k*',x:k,y:be*k,color:'#793fa4'}]});state.solow=v}f.oninput=u;u()}
const pages={dashboard,market,elasticity,costs,nash,islm,adas,solow},bind={market:bindMarket,elasticity:bindElasticity,costs:bindCosts,nash:bindNash,islm:bindISLM,adas:bindADAS,solow:bindSolow},titles={dashboard:'Panel unificado',market:'Oferta y demanda',elasticity:'Elasticidad',costs:'Costos',nash:'Equilibrio de Nash',islm:'IS-LM',adas:'OA-DA',solow:'Solow'};function render(){page=location.hash.slice(1)||'dashboard';if(!pages[page])page='dashboard';$('#view').innerHTML=pages[page]();$('#title').textContent=titles[page];document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));bind[page]?.()}$('#nav').onclick=e=>{const b=e.target.closest('[data-page]');if(b){location.hash=b.dataset.page;$('#side').classList.remove('open')}};window.onhashchange=render;$('#menu').onclick=()=>$('#side').classList.toggle('open');$('#theme').onclick=()=>{const d=document.documentElement.dataset.theme==='dark';document.documentElement.dataset.theme=d?'light':'dark';localStorage.setItem('od-econ-theme',d?'light':'dark')};document.documentElement.dataset.theme=localStorage.getItem('od-econ-theme')||'light';$('#export').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));a.download='opendirectory-economics-state.json';a.click();URL.revokeObjectURL(a.href)};render()})();
</script>
