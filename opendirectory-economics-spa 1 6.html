<!doctype html>
<html lang="es">

<title>OpenDirectory Economics Lab</title>
<style>
:root{--bg:#f3f6f4;--card:#fff;--soft:#eaf1ed;--text:#17231c;--muted:#65746a;--line:#d5e0d8;--brand:#176b4d;--brand2:#0c4a34;--red:#b33f49;--blue:#2676ad;--gold:#dfa42e;--purple:#7a3dbc;--shadow:0 14px 38px rgba(20,72,48,.1);--r:15px}
[data-theme=dark]{--bg:#0c1410;--card:#142019;--soft:#1c2a22;--text:#eef7f1;--muted:#9fb1a5;--line:#2b3d31;--brand:#4db989;--brand2:#329568;--red:#ed7f87;--blue:#77b8e6;--gold:#f0bd59;--purple:#ba91e2;--shadow:0 16px 42px rgba(0,0,0,.3)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif}button,input,select{font:inherit}button{cursor:pointer}.app{min-height:100vh;display:grid;grid-template-columns:255px 1fr}.side{position:sticky;top:0;height:100vh;background:#092f22;color:#fff;padding:16px 13px;display:flex;flex-direction:column;z-index:25}.brand{font-size:1.08rem;font-weight:900;padding:7px 9px 18px}.brand small{display:block;color:#a9cfba;font-weight:600}.group{font-size:.72rem;text-transform:uppercase;letter-spacing:.1em;color:#82ad95;margin:16px 10px 5px}.nav{display:grid;gap:4px}.nav button{border:0;background:transparent;color:#cce1d4;padding:10px 11px;border-radius:9px;text-align:left}.nav button:hover,.nav button.active{background:#15543e;color:white}.sidefoot{margin-top:auto;padding:13px 9px 0;border-top:1px solid #1d583f;color:#a9cfba;font-size:.8rem}.main{min-width:0}.top{height:68px;position:sticky;top:0;z-index:15;background:color-mix(in srgb,var(--card) 93%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:0 20px}.top h1{font-size:1.02rem;margin:0}.spacer{flex:1}.btn,.iconbtn{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:9px;padding:9px 12px;font-weight:720}.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}.iconbtn{width:40px;height:40px;padding:0}.menu{display:none}.content{padding:20px;max-width:1500px;margin:auto}.hero{padding:23px;background:linear-gradient(135deg,color-mix(in srgb,var(--brand) 10%,var(--card)),var(--card));border:1px solid var(--line);border-radius:17px;margin-bottom:14px}.hero h2{margin:0 0 6px;font-size:1.9rem;letter-spacing:-.035em}.hero p{margin:0;color:var(--muted)}.grid{display:grid;grid-template-columns:.82fr 1.18fr;gap:14px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:17px;box-shadow:var(--shadow)}.card h3{margin:0 0 8px}.form{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-content:start}.field,label{display:grid;gap:5px;font-weight:650}.form input,.form select{width:100%;padding:9px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--text)}input[type=range]{accent-color:var(--brand)}.wide{grid-column:1/-1}.result{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.metric{padding:11px;background:var(--soft);border-radius:9px;min-width:0}.metric small,.muted{color:var(--muted)}.metric strong{display:block;font-size:1.22rem}.metric span{display:block;color:var(--muted);font-size:.8rem}.chart canvas{width:100%;height:410px;display:block}.legend{display:flex;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:.8rem}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px}.notice,.formula{padding:11px;border-radius:9px;margin-top:11px}.notice{background:color-mix(in srgb,var(--gold) 14%,var(--card));border:1px solid color-mix(in srgb,var(--gold) 45%,var(--line))}.formula{background:var(--soft);font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.table{width:100%;border-collapse:collapse}.table th,.table td{border:1px solid var(--line);padding:11px;text-align:center}.homecard{padding:18px}.homecard p{color:var(--muted)}.hidden{display:none!important}.toast{position:fixed;right:18px;bottom:18px;background:var(--text);color:var(--card);padding:12px 15px;border-radius:10px;z-index:50}@media(max-width:950px){.grid{grid-template-columns:1fr}.cards{grid-template-columns:repeat(2,1fr)}}@media(max-width:700px){.app{grid-template-columns:1fr}.side{position:fixed;left:-275px;width:255px;transition:.2s}.side.open{left:0}.menu{display:block}.content{padding:14px}.form,.result,.cards{grid-template-columns:1fr}.wide{grid-column:auto}}
</style>
</head>
<body><div class="app"><aside class="side" id="side"><div class="brand">OpenDirectory Economics Lab<small>Microeconomía y Economía</small></div><nav class="nav" id="nav"><button data-page="home" class="active">▦ Panel</button><div class="group">Microeconomía</div><button data-page="market">⌁ Oferta y demanda</button><button data-page="elasticity">↔ Elasticidad</button><button data-page="costs">∿ Costos</button><button data-page="nash">♟ Equilibrio de Nash</button><div class="group">Macroeconomía</div><button data-page="islm">⌗ IS-LM</button><button data-page="adas">↕ OA-DA</button><button data-page="solow">↗ Solow</button></nav><div class="sidefoot">Modelos pedagógicos. No representan estimaciones econométricas de Chile.</div></aside><main class="main"><header class="top"><button class="iconbtn menu" id="menu">☰</button><h1 id="title">Panel unificado</h1><div class="spacer"></div><button class="btn" id="theme">◐ Tema</button><button class="btn primary" id="export">Exportar estado</button></header><section id="view" class="content"></section></main></div><div id="toast"></div>
<script>
(()=>{const $=s=>document.querySelector(s);let page=location.hash.slice(1)||'home';const state=JSON.parse(localStorage.getItem('od-econ-spa')||'{}');function save(){localStorage.setItem('od-econ-spa',JSON.stringify(state))}function toast(x){$('#toast').innerHTML=`<div class="toast">${x}</div>`;setTimeout(()=>$('#toast').innerHTML='',1900)}
function axes(canvas,opt){const d=window.devicePixelRatio||1,r=canvas.getBoundingClientRect();canvas.width=Math.max(640,r.width*d);canvas.height=410*d;const c=canvas.getContext('2d'),w=canvas.width,h=canvas.height,px=x=>70+(x-opt.xmin)/(opt.xmax-opt.xmin)*(w-100),py=y=>h-55-(y-opt.ymin)/(opt.ymax-opt.ymin)*(h-90);c.clearRect(0,0,w,h);c.strokeStyle='#7f8e84';c.beginPath();c.moveTo(70,25);c.lineTo(70,h-55);c.lineTo(w-30,h-55);c.stroke();c.fillStyle='#65746a';c.font=`${12*d}px system-ui`;c.fillText(opt.yLabel,15,25);c.fillText(opt.xLabel,w-80,h-15);for(const s of opt.series){c.save();c.strokeStyle=s.color;c.lineWidth=3*d;c.setLineDash(s.dash?[8*d,6*d]:[]);c.beginPath();s.pts.forEach((p,i)=>i?c.lineTo(px(p[0]),py(p[1])):c.moveTo(px(p[0]),py(p[1])));c.stroke();c.restore()}for(const m of opt.markers||[]){c.fillStyle=m.color;c.beginPath();c.arc(px(m.x),py(m.y),6*d,0,Math.PI*2);c.fill();c.fillText(m.label,px(m.x)+8,py(m.y)-8)}}
function home(){return `<section class="hero"><h2>Laboratorio económico unificado</h2><p>Calculadoras, gráficos interactivos y notas de interpretación para asesorías empresariales y repaso profesional.</p></section><div class="cards"><article class="card homecard"><h3>Mercados</h3><p>Equilibrio, impuestos, elasticidad y costos.</p><button class="btn" data-go="market">Abrir</button></article><article class="card homecard"><h3>Juegos</h3><p>Equilibrios de Nash puros y mixtos en matrices 2×2.</p><button class="btn" data-go="nash">Abrir</button></article><article class="card homecard"><h3>Política macroeconómica</h3><p>IS-LM y OA-DA con shocks configurables.</p><button class="btn" data-go="islm">Abrir</button></article><article class="card homecard"><h3>Crecimiento</h3><p>Estado estacionario de Solow.</p><button class="btn" data-go="solow">Abrir</button></article></div>`}
function market(){return `<section class="hero"><h2>Oferta y demanda</h2><p>Qd=a-bP; Qs=c+dP. Ajusta parámetros, impuesto y desplazamientos.</p></section><div class="notice"><b>Ceteris paribus:</b> un cambio del precio produce movimiento sobre la curva; un cambio de determinantes desplaza la curva.</div><div class="grid"><form class="card form" id="f"><label>a<input name="a" type="range" min="40" max="240" value="120"></label><label>b<input name="b" type="range" min=".2" max="6" step=".1" value="2"></label><label>c<input name="c" type="range" min="-40" max="100" value="20"></label><label>d<input name="d" type="range" min=".2" max="6" step=".1" value="3"></label><label>Impuesto<input name="t" type="range" min="0" max="50" value="10"></label><label>Δ demanda<input name="dd" type="range" min="-60" max="60" value="0"></label><label>Δ oferta<input name="ds" type="range" min="-60" max="60" value="0"></label><div id="r" class="wide result"></div></form><section class="card chart"><canvas id="c"></canvas><div class="legend"><span><i class="dot" style="background:var(--red)"></i>Demanda</span><span><i class="dot" style="background:var(--brand)"></i>Oferta</span><span><i class="dot" style="background:var(--blue)"></i>Oferta + impuesto</span></div></section></div>`}
function bindMarket(){const f=$('#f');function up(){const v=Object.fromEntries([...new FormData(f)].map(([k,x])=>[k,+x])),a=v.a+v.dd,c=v.c+v.ds,p=(a-c)/(v.b+v.d),q=a-v.b*p,pc=(a-c+v.d*v.t)/(v.b+v.d),pp=pc-v.t,qt=a-v.b*pc,rev=v.t*qt,dwl=.5*v.t*(q-qt);$('#r').innerHTML=`<div class="metric"><small>P* / Q*</small><strong>${p.toFixed(2)} / ${q.toFixed(2)}</strong></div><div class="metric"><small>Pc / Pp</small><strong>${pc.toFixed(2)} / ${pp.toFixed(2)}</strong></div><div class="metric"><small>Recaudación</small><strong>${rev.toFixed(2)}</strong></div><div class="metric"><small>Pérdida eficiencia</small><strong>${dwl.toFixed(2)}</strong></div>`;let maxQ=Math.max(a,q*1.5),maxP=Math.max(a/v.b+v.t,10),qs=Array.from({length:120},(_,i)=>i/119*maxQ);axes($('#c'),{xLabel:'Q',yLabel:'P',xmin:0,xmax:maxQ,ymin:Math.min(0,-c/v.d),ymax:maxP,series:[{color:'#b33f49',pts:qs.map(x=>[x,(a-x)/v.b])},{color:'#176b4d',pts:qs.map(x=>[x,(x-c)/v.d])},{color:'#2676ad',dash:true,pts:qs.map(x=>[x,(x-c)/v.d+v.t])}],markers:[{x:q,y:p,label:'E₀',color:'#17231c'},{x:qt,y:pc,label:'Et',color:'#7a3dbc'}]})}f.oninput=up;up()}
function elasticity(){return `<section class="hero"><h2>Elasticidad</h2><p>Método del punto medio para elasticidad precio, ingreso y cruzada.</p></section><div class="grid"><form class="card form" id="f"><label>Tipo<select name="type"><option value="price">Precio</option><option value="income">Ingreso</option><option value="cross">Cruzada</option></select></label><label>Q₁<input name="q1" type="number" value="100"></label><label>Q₂<input name="q2" type="number" value="80"></label><label>X₁<input name="x1" type="number" value="10"></label><label>X₂<input name="x2" type="number" value="12"></label><div id="r" class="wide result"></div></form><section class="card chart"><canvas id="c"></canvas><div class="formula">E=[(Q₂-Q₁)/Q̄] ÷ [(X₂-X₁)/X̄]</div></section></div>`}
function bindElasticity(){const f=$('#f');function up(){const d=Object.fromEntries(new FormData(f)),q1=+d.q1,q2=+d.q2,x1=+d.x1,x2=+d.x2,E=((q2-q1)/((q1+q2)/2))/((x2-x1)/((x1+x2)/2)),type=d.type,label=type==='price'?(Math.abs(E)>1?'Elástica':Math.abs(E)<1?'Inelástica':'Unitaria'):type==='income'?(E>1?'Bien superior':E>0?'Bien normal':E<0?'Bien inferior':'Neutro'):(E>0?'Sustitutos':E<0?'Complementarios':'Independientes');$('#r').innerHTML=`<div class="metric"><small>Elasticidad</small><strong>${E.toFixed(3)}</strong></div><div class="metric"><small>Clasificación</small><strong>${label}</strong></div>`;axes($('#c'),{xLabel:'X',yLabel:'Q',xmin:0,xmax:Math.max(x1,x2)*1.4,ymin:0,ymax:Math.max(q1,q2)*1.3,series:[{color:'#2676ad',pts:[[x1,q1],[x2,q2]]}],markers:[{x:x1,y:q1,label:'A',color:'#17231c'},{x:x2,y:q2,label:'B',color:'#7a3dbc'}]})}f.oninput=up;up()}
function costs(){return `<section class="hero"><h2>Costos</h2><p>CT=CF+αQ+βQ²; visualiza CMg, CMe y CVMe.</p></section><div class="grid"><form class="card form" id="f"><label>CF<input name="F" type="number" value="1000"></label><label>α<input name="a" type="number" value="20"></label><label>β<input name="b" type="number" value="0.5" step=".1"></label><label>Q<input name="Q" type="number" value="20" min="1"></label><div id="r" class="wide result"></div></form><section class="card chart"><canvas id="c"></canvas><div class="formula">CMg=α+2βQ · CMe=CT/Q · CVMe=CV/Q</div></section></div>`}
function bindCosts(){const f=$('#f');function up(){const v=Object.fromEntries([...new FormData(f)].map(([k,x])=>[k,+x])),CV=v.a*v.Q+v.b*v.Q*v.Q,CT=v.F+CV,MC=v.a+2*v.b*v.Q,AC=CT/v.Q,AVC=CV/v.Q;$('#r').innerHTML=`<div class="metric"><small>CT</small><strong>${CT.toFixed(2)}</strong></div><div class="metric"><small>CMg</small><strong>${MC.toFixed(2)}</strong></div><div class="metric"><small>CMe</small><strong>${AC.toFixed(2)}</strong></div><div class="metric"><small>CVMe</small><strong>${AVC.toFixed(2)}</strong></div>`;let maxQ=Math.max(50,v.Q*2),qs=Array.from({length:100},(_,i)=>1+i/99*(maxQ-1)),ac=q=>(v.F+v.a*q+v.b*q*q)/q,mc=q=>v.a+2*v.b*q,avc=q=>v.a+v.b*q,max=Math.max(...qs.flatMap(q=>[ac(q),mc(q),avc(q)]));axes($('#c'),{xLabel:'Q',yLabel:'Costo unitario',xmin:0,xmax:maxQ,ymin:0,ymax:max*1.1,series:[{color:'#b33f49',pts:qs.map(q=>[q,mc(q)])},{color:'#176b4d',pts:qs.map(q=>[q,ac(q)])},{color:'#2676ad',dash:true,pts:qs.map(q=>[q,avc(q)])}],markers:[{x:v.Q,y:MC,label:'Q',color:'#7a3dbc'}]})}f.oninput=up;up()}
function nash(){return `<section class="hero"><h2>Equilibrio de Nash 2×2</h2><p>Edita los pagos. Cada celda es (fila, columna).</p></section><div class="grid"><form class="card form" id="f"><label>A,A fila<input name="u00" value="3" type="number"></label><label>A,A columna<input name="v00" value="3" type="number"></label><label>A,B fila<input name="u01" value="0" type="number"></label><label>A,B columna<input name="v01" value="5" type="number"></label><label>B,A fila<input name="u10" value="5" type="number"></label><label>B,A columna<input name="v10" value="0" type="number"></label><label>B,B fila<input name="u11" value="1" type="number"></label><label>B,B columna<input name="v11" value="1" type="number"></label></form><section class="card"><div id="matrix"></div><div id="r" class="result"></div><div class="notice">Nash no implica eficiencia ni justicia. Solo ausencia de desviación unilateral rentable.</div></section></div>`}
function bindNash(){const f=$('#f');function up(){const d=Object.fromEntries([...new FormData(f)].map(([k,x])=>[k,+x])),pay=[[[d.u00,d.v00],[d.u01,d.v01]],[[d.u10,d.v10],[d.u11,d.v11]]],pure=[];for(let r=0;r<2;r++)for(let c=0;c<2;c++){let u=pay[r][c];if(u[0]>=pay[1-r][c][0]&&u[1]>=pay[r][1-c][1])pure.push(`${r?'B':'A'},${c?'B':'A'}`)}let denQ=d.u00-d.u01-d.u10+d.u11,denP=d.v00-d.v01-d.v10+d.v11,q=denQ? (d.u11-d.u01)/denQ:NaN,p=denP?(d.v11-d.v10)/denP:NaN,mixed=p>=0&&p<=1&&q>=0&&q<=1;$('#matrix').innerHTML=`<table class="table"><tr><th></th><th>A</th><th>B</th></tr><tr><th>A</th><td>(${d.u00}, ${d.v00})</td><td>(${d.u01}, ${d.v01})</td></tr><tr><th>B</th><td>(${d.u10}, ${d.v10})</td><td>(${d.u11}, ${d.v11})</td></tr></table>`;$('#r').innerHTML=`<div class="metric"><small>Nash puros</small><strong>${pure.length}</strong><span>${pure.join('; ')||'Ninguno'}</span></div><div class="metric"><small>Mixto interior</small><strong>${mixed?`p=${p.toFixed(3)}, q=${q.toFixed(3)}`:'No'}</strong></div>`}f.oninput=up;up()}
function islm(){return `<section class="hero"><h2>IS-LM</h2><p>Compara equilibrio inicial y shocks fiscal y monetario.</p></section><div class="grid"><form class="card form" id="f"><label>C₀<input name="C" value="50" type="number"></label><label>PMC<input name="c" value=".75" step=".01" type="number"></label><label>T<input name="T" value="40" type="number"></label><label>I₀<input name="I" value="120" type="number"></label><label>b<input name="b" value="20" type="number"></label><label>G<input name="G" value="100" type="number"></label><label>M/P<input name="M" value="200" type="number"></label><label>k<input name="k" value=".5" step=".01" type="number"></label><label>h<input name="h" value="40" type="number"></label><label>ΔG<input name="dG" value="40" type="range" min="-100" max="100"></label><label>ΔM<input name="dM" value="60" type="range" min="-150" max="150"></label><div id="r" class="wide result"></div></form><section class="card chart"><canvas id="c"></canvas></section></div>`}
function bindISLM(){const f=$('#f');function up(){const v=Object.fromEntries([...new FormData(f)].map(([k,x])=>[k,+x])),eq=(G,M)=>{let A=v.C-v.c*v.T+v.I+G,Y=(A+v.b*M/v.h)/((1-v.c)+v.b*v.k/v.h),i=(v.k*Y-M)/v.h;return{A,Y,i}},e0=eq(v.G,v.M),e1=eq(v.G+v.dG,v.M+v.dM);$('#r').innerHTML=`<div class="metric"><small>Y₀ / i₀</small><strong>${e0.Y.toFixed(2)} / ${e0.i.toFixed(2)}</strong></div><div class="metric"><small>Y₁ / i₁</small><strong>${e1.Y.toFixed(2)} / ${e1.i.toFixed(2)}</strong></div><div class="metric"><small>ΔY</small><strong>${(e1.Y-e0.Y).toFixed(2)}</strong></div><div class="metric"><small>Δi</small><strong>${(e1.i-e0.i).toFixed(2)}</strong></div>`;let maxY=Math.max(e0.Y,e1.Y)*1.7,ys=Array.from({length:120},(_,i)=>i/119*maxY),is=(y,A)=>(A-(1-v.c)*y)/v.b,lm=(y,M)=>(v.k*y-M)/v.h,all=ys.flatMap(y=>[is(y,e0.A),is(y,e1.A),lm(y,v.M),lm(y,v.M+v.dM)]);axes($('#c'),{xLabel:'Y',yLabel:'i',xmin:0,xmax:maxY,ymin:Math.min(...all),ymax:Math.max(...all),series:[{color:'#b33f49',pts:ys.map(y=>[y,is(y,e0.A)])},{color:'#176b4d',pts:ys.map(y=>[y,lm(y,v.M)])},{color:'#dfa42e',dash:true,pts:ys.map(y=>[y,is(y,e1.A)])},{color:'#2676ad',dash:true,pts:ys.map(y=>[y,lm(y,v.M+v.dM)])}],markers:[{x:e0.Y,y:e0.i,label:'E₀',color:'#17231c'},{x:e1.Y,y:e1.i,label:'E₁',color:'#7a3dbc'}]})}f.oninput=up;up()}
function adas(){return `<section class="hero"><h2>OA-DA</h2><p>Shocks pedagógicos de oferta y demanda agregada.</p></section><div class="grid"><form class="card form" id="f"><label>Y potencial<input name="Y" value="100" type="number"></label><label>P base<input name="P" value="100" type="number"></label><label>Shock DA<input name="d" value="10" type="range" min="-50" max="50"></label><label>Shock OA<input name="s" value="0" type="range" min="-50" max="50"></label><div id="r" class="wide result"></div></form><section class="card chart"><canvas id="c"></canvas><div class="notice">Coeficientes pedagógicos, no estimados.</div></section></div>`}
function bindADAS(){const f=$('#f');function up(){const v=Object.fromEntries([...new FormData(f)].map(([k,x])=>[k,+x])),Y=v.Y+.6*v.d-.5*v.s,P=v.P+.4*v.d+.7*v.s;$('#r').innerHTML=`<div class="metric"><small>Y₁</small><strong>${Y.toFixed(1)}</strong></div><div class="metric"><small>P₁</small><strong>${P.toFixed(1)}</strong></div><div class="metric"><small>ΔY</small><strong>${(Y-v.Y).toFixed(1)}</strong></div><div class="metric"><small>ΔP</small><strong>${(P-v.P).toFixed(1)}</strong></div>`;let ys=Array.from({length:100},(_,i)=>40+i),ad0=y=>160-.6*y,ad1=y=>ad0(y)+.4*v.d,as0=y=>40+.6*y,as1=y=>as0(y)+.7*v.s;axes($('#c'),{xLabel:'Y',yLabel:'P',xmin:40,xmax:140,ymin:20,ymax:160,series:[{color:'#b33f49',pts:ys.map(y=>[y,ad0(y)])},{color:'#dfa42e',dash:true,pts:ys.map(y=>[y,ad1(y)])},{color:'#176b4d',pts:ys.map(y=>[y,as0(y)])},{color:'#2676ad',dash:true,pts:ys.map(y=>[y,as1(y)])}],markers:[{x:Y,y:P,label:'E₁',color:'#7a3dbc'}]})}f.oninput=up;up()}
function solow(){return `<section class="hero"><h2>Modelo de Solow</h2><p>Estado estacionario con producción Cobb-Douglas.</p></section><div class="grid"><form class="card form" id="f"><label>Ahorro s<input name="s" value=".25" type="range" min=".05" max=".7" step=".01"></label><label>α<input name="a" value=".35" type="range" min=".1" max=".8" step=".01"></label><label>δ<input name="d" value=".05" type="number" step=".01"></label><label>n<input name="n" value=".01" type="number" step=".01"></label><label>g<input name="g" value=".02" type="number" step=".01"></label><div id="r" class="wide result"></div></form><section class="card chart"><canvas id="c"></canvas><div class="formula">s·k^α=(δ+n+g)k</div></section></div>`}
function bindSolow(){const f=$('#f');function up(){const v=Object.fromEntries([...new FormData(f)].map(([k,x])=>[k,+x])),be=v.d+v.n+v.g,k=(v.s/be)**(1/(1-v.a)),y=k**v.a,cons=(1-v.s)*y;$('#r').innerHTML=`<div class="metric"><small>k*</small><strong>${k.toFixed(3)}</strong></div><div class="metric"><small>y*</small><strong>${y.toFixed(3)}</strong></div><div class="metric"><small>c*</small><strong>${cons.toFixed(3)}</strong></div><div class="metric"><small>δ+n+g</small><strong>${be.toFixed(3)}</strong></div>`;let max=k*2.3,ks=Array.from({length:120},(_,i)=>.001+i/119*max),vals=ks.flatMap(x=>[v.s*x**v.a,be*x]);axes($('#c'),{xLabel:'k',yLabel:'Inversión',xmin:0,xmax:max,ymin:0,ymax:Math.max(...vals)*1.1,series:[{color:'#176b4d',pts:ks.map(x=>[x,v.s*x**v.a])},{color:'#b33f49',pts:ks.map(x=>[x,be*x])}],markers:[{x:k,y:be*k,label:'k*',color:'#7a3dbc'}]})}f.oninput=up;up()}
const pages={home,market,elasticity,costs,nash,islm,adas,solow},binds={market:bindMarket,elasticity:bindElasticity,costs:bindCosts,nash:bindNash,islm:bindISLM,adas:bindADAS,solow:bindSolow},titles={home:'Panel unificado',market:'Oferta y demanda',elasticity:'Elasticidad',costs:'Costos',nash:'Equilibrio de Nash',islm:'IS-LM',adas:'OA-DA',solow:'Solow'};function render(){page=location.hash.slice(1)||'home';if(!pages[page])page='home';$('#view').innerHTML=pages[page]();$('#title').textContent=titles[page];document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));if(binds[page])binds[page]();document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>location.hash=b.dataset.go)}$('#nav').onclick=e=>{let b=e.target.closest('[data-page]');if(b){location.hash=b.dataset.page;$('#side').classList.remove('open')}};window.onhashchange=render;$('#menu').onclick=()=>$('#side').classList.toggle('open');$('#theme').onclick=()=>{let d=document.documentElement.dataset.theme==='dark';document.documentElement.dataset.theme=d?'light':'dark';localStorage.setItem('od-econ-theme',d?'light':'dark')};document.documentElement.dataset.theme=localStorage.getItem('od-econ-theme')||'light';$('#export').onclick=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({app:'OpenDirectory Economics Lab',version:'1.0',exportedAt:new Date().toISOString(),state},null,2)],{type:'application/json'}));a.download='opendirectory-economics-state.json';a.click();toast('Estado exportado')};render()})();
</script></body></html>
