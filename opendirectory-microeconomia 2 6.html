<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Laboratorio de microeconomía aplicada de OpenDirectory"><title>OpenMicroeconomics | OpenDirectory</title><style>
:root{--bg:#f4f7f5;--card:#fff;--soft:#eaf1ed;--text:#17231c;--muted:#66746b;--line:#d7e2db;--brand:#176b4d;--brand2:#0d4934;--accent:#e8ae3d;--bad:#b33f49;--info:#2676ad;--shadow:0 14px 40px rgba(20,73,48,.1);--r:16px}
[data-theme=dark]{--bg:#0c1410;--card:#142019;--soft:#1c2a22;--text:#eef7f1;--muted:#9fb1a5;--line:#2b3d31;--brand:#4db989;--brand2:#329568;--accent:#f2bc56;--bad:#ef7e88;--info:#77b8e6;--shadow:0 16px 44px rgba(0,0,0,.3)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 Inter,system-ui,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}a{color:inherit;text-decoration:none}.app{display:grid;grid-template-columns:255px 1fr;min-height:100vh}.side{height:100vh;position:sticky;top:0;background:#092f22;color:#ebfff3;padding:16px 13px;display:flex;flex-direction:column;z-index:30}.brand{display:flex;gap:10px;align-items:center;font-weight:900;padding:6px 8px 20px}.mark{width:38px;height:38px;border-radius:11px;background:#ddf7e8;color:#0c5338;display:grid;place-items:center}.nav{display:grid;gap:5px}.nav button{border:0;background:transparent;color:#c8ded1;padding:11px;border-radius:9px;text-align:left}.nav button.active,.nav button:hover{background:#15543e;color:#fff}.side small{margin-top:auto;color:#aaceb9;border-top:1px solid #1d583f;padding:14px 8px}.main{min-width:0}.top{height:69px;position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--card) 93%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 20px;gap:10px}.top h1{font-size:1.05rem;margin:0}.spacer{flex:1}.btn{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:9px;padding:9px 12px;font-weight:730}.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}.btn.danger{color:var(--bad)}.content{padding:20px;max-width:1480px;margin:auto}.head{display:flex;justify-content:space-between;align-items:end;gap:14px;margin-bottom:17px}.head h2{font-size:1.8rem;letter-spacing:-.035em;margin:0}.head p{color:var(--muted);margin:4px 0 0}.notice{padding:12px 14px;background:color-mix(in srgb,var(--accent) 15%,var(--card));border:1px solid color-mix(in srgb,var(--accent) 45%,var(--line));border-radius:11px;margin-bottom:15px}.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:13px}.kpi{padding:17px}.kpi strong{display:block;font-size:1.85rem}.kpi span,.muted{color:var(--muted)}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}.panel{padding:17px}.panel h3{margin:0 0 12px}.form{padding:18px;display:grid;gap:11px}.field{display:grid;gap:5px}.field label{font-weight:720}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:9px;padding:10px}.inputgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.calcgrid{display:grid;grid-template-columns:.8fr 1.2fr;gap:14px}.resultline{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}.formula{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;background:var(--soft);padding:10px;border-radius:9px;margin:8px 0;overflow:auto}.canvasbox{padding:16px}.canvasbox canvas{width:100%;height:390px;display:block;background:var(--card);border-radius:10px}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;border-bottom:1px solid var(--line);padding:10px}.table th{color:var(--muted);font-size:.78rem;text-transform:uppercase}.tag{display:inline-block;padding:4px 8px;border-radius:99px;background:var(--soft);color:var(--muted);font-size:.78rem}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}.item{padding:17px}.item h3{margin:0 0 6px}.warning{color:var(--bad);font-weight:720}.success{color:var(--brand);font-weight:720}.menu{display:none}.hidden{display:none!important}.toast{position:fixed;right:18px;bottom:18px;background:var(--text);color:var(--card);padding:12px 15px;border-radius:10px;z-index:80}.flows{display:grid;gap:7px}.flow{display:grid;grid-template-columns:80px 1fr 38px;gap:7px;align-items:center}.flow button{border:0;background:var(--soft);color:var(--bad);border-radius:8px;height:36px}.compare{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.steps{counter-reset:s}.steps li{margin:8px 0}.source{font-size:.82rem;color:var(--muted)}
@media(max-width:1050px){.kpis{grid-template-columns:repeat(2,1fr)}.cards,.grid3{grid-template-columns:repeat(2,1fr)}.calcgrid{grid-template-columns:1fr}}@media(max-width:760px){.app{grid-template-columns:1fr}.side{position:fixed;left:-270px;width:255px;transition:.2s}.side.open{left:0}.menu{display:block}.content{padding:14px}.grid2,.grid3,.cards,.kpis,.inputgrid,.compare{grid-template-columns:1fr}.head{align-items:start;flex-direction:column}}
</style></head><body><div class="app"><aside class="side" id="side"><div class="brand"><span class="mark">OD</span><span>OpenMicroeconomics<br><small style="border:0;padding:0">Portal de asesorías</small></span></div><nav class="nav" id="nav"><button data-page="market" class=active>⌁ Oferta y demanda</button><button data-page="elasticity">↔ Elasticidad</button><button data-page="costs">∿ Costos de empresa</button><button data-page="consumer">◉ Consumidor</button><button data-page="structures">▥ Competencia y monopolio</button></nav><small>Modelos pedagógicos para análisis empresarial y asesorías.</small></aside><main class="main"><header class="top"><button class="btn menu" id="menu">☰</button><h1 id="title">Oferta y demanda</h1><div class="spacer"></div><button class="btn" id="theme">◐ Tema</button><a class="btn primary" href="opendirectory.html">OpenDirectory</a></header><section class="content" id="view"></section></main></div><div id="toast"></div><script>
function market(){return `${head('Mercado: oferta y demanda','Equilibrio lineal, impuestos, excedentes y ceteris paribus.')}<div class="notice"><b>Ceteris paribus:</b> para interpretar movimiento sobre una curva, ingreso, preferencias, costos, tecnología y expectativas permanecen constantes. Si cambian, la curva se desplaza.</div><div class="calcgrid"><form class="card form" id="marketForm"><div class="formula">Qd = a - bP<br>Qs = c + dP</div><div class="inputgrid"><div class="field"><label>a</label><input id="a" type="number" value="120"></div><div class="field"><label>b</label><input id="b" type="number" value="2"></div><div class="field"><label>c</label><input id="c" type="number" value="20"></div><div class="field"><label>d</label><input id="d" type="number" value="3"></div><div class="field"><label>Impuesto unitario</label><input id="tax" type="number" value="10"></div><div class="field"><label>Desplazamiento demanda Δa</label><input id="shiftD" type="number" value="0"></div><div class="field"><label>Desplazamiento oferta Δc</label><input id="shiftS" type="number" value="0"></div></div><button class="btn primary">Calcular</button><div id="marketResults"></div></form><div class="card canvasbox"><canvas id="marketChart" width="760" height="420"></canvas></div></div><div class="grid2"><article class="card panel"><h3>Origen del equilibrio</h3><p>El punto de equilibrio satisface Qd = Qs. No es un ideal moral: es una condición de compatibilidad entre planes de compra y venta.</p><div class="formula">P* = (a-c)/(b+d)<br>Q* = a-bP*</div></article><article class="card panel"><h3>Impuesto</h3><p>La cuña separa el precio pagado y recibido. La incidencia depende de elasticidades. Recaudación = t×Qt; pérdida irrecuperable aproximada = ½t(Q*-Qt).</p></article></div>`}
function elasticity(){return `${head('Elasticidad','Respuesta porcentual y clasificación.')}<div class="calcgrid"><form class="card form" id="elasticForm"><div class="field"><label>Tipo</label><select id="etype"><option value="price">Precio</option><option value="income">Ingreso</option><option value="cross">Cruzada</option></select></div><div class="inputgrid"><div class="field"><label>Q inicial</label><input id="q1" type="number" value="100"></div><div class="field"><label>Q final</label><input id="q2" type="number" value="80"></div><div class="field"><label>Variable inicial</label><input id="x1" type="number" value="10"></div><div class="field"><label>Variable final</label><input id="x2" type="number" value="12"></div></div><button class="btn primary">Calcular punto medio</button><div id="elasticResults"></div></form><div class="card canvasbox"><canvas id="elasticChart" width="760" height="420"></canvas></div></div><div class="cards"><article class="card item"><h3>Elástica</h3><p>|E| &gt; 1. La cantidad responde más que proporcionalmente.</p></article><article class="card item"><h3>Inelástica</h3><p>|E| &lt; 1. La cantidad responde menos que proporcionalmente.</p></article><article class="card item"><h3>Unitaria</h3><p>|E| = 1. Respuestas proporcionales equivalentes.</p></article></div>`}
function costs(){return `${head('Costos de la empresa','Costo fijo, variable, medio y marginal.')}<div class="calcgrid"><form class="card form" id="costForm"><div class="inputgrid"><div class="field"><label>Costo fijo CF</label><input id="fc" type="number" value="1000"></div><div class="field"><label>CV = αQ + βQ², α</label><input id="alpha" type="number" value="20"></div><div class="field"><label>β</label><input id="beta" type="number" value="0.5" step=".1"></div><div class="field"><label>Q evaluada</label><input id="qty" type="number" value="20"></div></div><button class="btn primary">Calcular</button><div id="costResults"></div></form><div class="card canvasbox"><canvas id="costChart" width="760" height="420"></canvas></div></div><div class="formula">CT = CF + αQ + βQ²<br>CMg = α + 2βQ<br>CMe = CT/Q<br>CVMe = α + βQ</div>`}
function consumer(){return `${head('Teoría del consumidor','Restricción presupuestaria y elección Cobb-Douglas.')}<div class="calcgrid"><form class="card form" id="consumerForm"><div class="inputgrid"><div class="field"><label>Ingreso M</label><input id="income" type="number" value="1000"></div><div class="field"><label>Precio X</label><input id="px" type="number" value="20"></div><div class="field"><label>Precio Y</label><input id="py" type="number" value="10"></div><div class="field"><label>Preferencia α para X</label><input id="share" type="number" value="0.4" min=".01" max=".99" step=".01"></div></div><button class="btn primary">Optimizar</button><div id="consumerResults"></div></form><div class="card canvasbox"><canvas id="consumerChart" width="760" height="420"></canvas></div></div><div class="formula">U(X,Y)=X^αY^(1-α)<br>X*=αM/Px &nbsp; Y*=(1-α)M/Py</div>`}
function structures(){return `${head('Competencia perfecta y monopolio','Comparación lineal con demanda inversa P = A - BQ y costo marginal constante.')}<div class="calcgrid"><form class="card form" id="structForm"><div class="inputgrid"><div class="field"><label>A</label><input id="A" type="number" value="100"></div><div class="field"><label>B</label><input id="B" type="number" value="1"></div><div class="field"><label>Costo marginal</label><input id="mc" type="number" value="20"></div></div><button class="btn primary">Comparar</button><div id="structResults"></div></form><div class="card canvasbox"><canvas id="structChart" width="760" height="420"></canvas></div></div>`}
function bindMarket(){function run(){let a=+$('#a').value+ +$('#shiftD').value,b=+$('#b').value,c=+$('#c').value+ +$('#shiftS').value,d=+$('#d').value,t=+$('#tax').value,p=(a-c)/(b+d),q=a-b*p,pc=(a-c+d*t)/(b+d),pp=pc-t,qt=a-b*pc,rev=t*qt,dwl=.5*t*(q-qt);$('#marketResults').innerHTML=`<div class="resultline"><span>P* / Q*</span><b>${p.toFixed(2)} / ${q.toFixed(2)}</b></div><div class="resultline"><span>Pc / Pp</span><b>${pc.toFixed(2)} / ${pp.toFixed(2)}</b></div><div class="resultline"><span>Qt / recaudación</span><b>${qt.toFixed(2)} / ${rev.toFixed(2)}</b></div><div class="resultline"><span>Pérdida eficiencia</span><b>${dwl.toFixed(2)}</b></div>`;drawMarket({a,b,c,d,t,p,q,pc,pp,qt})}$('#marketForm').onsubmit=e=>{e.preventDefault();run()};run()}
function drawMarket(x){let cv=$('#marketChart'),c=cv.getContext('2d'),w=cv.width,h=cv.height;axes(c,w,h,'Q','P');let maxQ=x.a*1.08,maxP=(x.a/x.b+x.t)*1.1,px=q=>55+q/maxQ*(w-80),py=p=>h-42-p/maxP*(h-70),qs=Array.from({length:80},(_,i)=>i/79*maxQ);line(c,qs.map(q=>[px(q),py((x.a-q)/x.b)]),'#b33f49','D');line(c,qs.map(q=>[px(q),py((q-x.c)/x.d)]),'#176b4d','S');line(c,qs.map(q=>[px(q),py((q-x.c)/x.d+x.t)]),'#2676ad','S+t',[8,6])}
function bindElastic(){$('#elasticForm').onsubmit=e=>{e.preventDefault();let q1=+$('#q1').value,q2=+$('#q2').value,x1=+$('#x1').value,x2=+$('#x2').value,E=((q2-q1)/((q1+q2)/2))/((x2-x1)/((x1+x2)/2)),type=$('#etype').value,read=type==='price'?(Math.abs(E)>1?'Elástica':Math.abs(E)<1?'Inelástica':'Unitaria'):type==='income'?(E>1?'Bien superior':E>0?'Bien normal':E<0?'Bien inferior':'Neutro'):(E>0?'Sustitutos':E<0?'Complementarios':'Independientes');$('#elasticResults').innerHTML=`<div class="resultline"><span>Elasticidad</span><b>${E.toFixed(3)}</b></div><div class="resultline"><span>Clasificación</span><b>${read}</b></div>`;let cv=$('#elasticChart'),c=cv.getContext('2d');axes(c,cv.width,cv.height,'Variable','Cantidad');line(c,[[80,340],[680,70]],'#2676ad','Relación')};$('#elasticForm').requestSubmit()}
function bindCosts(){function run(){let F=+$('#fc').value,a=+$('#alpha').value,b=+$('#beta').value,Q=+$('#qty').value,VC=a*Q+b*Q*Q,TC=F+VC,MC=a+2*b*Q,AC=TC/Q;$('#costResults').innerHTML=`<div class="resultline"><span>CV / CT</span><b>${VC.toFixed(2)} / ${TC.toFixed(2)}</b></div><div class="resultline"><span>CMg / CMe</span><b>${MC.toFixed(2)} / ${AC.toFixed(2)}</b></div>`;let cv=$('#costChart'),c=cv.getContext('2d'),w=cv.width,h=cv.height;axes(c,w,h,'Q','Costo');let maxQ=Math.max(Q*2,50),qs=Array.from({length:90},(_,i)=>1+i/89*maxQ),vals=qs.flatMap(q=>[a+2*b*q,(F+a*q+b*q*q)/q]),max=Math.max(...vals),px=q=>55+q/maxQ*(w-80),py=v=>h-42-v/max*(h-70);line(c,qs.map(q=>[px(q),py(a+2*b*q)]),'#b33f49','CMg');line(c,qs.map(q=>[px(q),py((F+a*q+b*q*q)/q)]),'#176b4d','CMe')}$('#costForm').onsubmit=e=>{e.preventDefault();run()};run()}
function bindConsumer(){function run(){let M=+$('#income').value,pxv=+$('#px').value,pyv=+$('#py').value,a=+$('#share').value,X=a*M/pxv,Y=(1-a)*M/pyv,U=X**a*Y**(1-a);$('#consumerResults').innerHTML=`<div class="resultline"><span>X* / Y*</span><b>${X.toFixed(2)} / ${Y.toFixed(2)}</b></div><div class="resultline"><span>Utilidad índice</span><b>${U.toFixed(2)}</b></div>`;let cv=$('#consumerChart'),c=cv.getContext('2d'),w=cv.width,h=cv.height;axes(c,w,h,'X','Y');let maxX=M/pxv,maxY=M/pyv,rx=x=>55+x/maxX*(w-80),ry=y=>h-42-y/maxY*(h-70);line(c,[[rx(0),ry(maxY)],[rx(maxX),ry(0)]],'#2676ad','Presupuesto');c.fillStyle='#b33f49';c.beginPath();c.arc(rx(X),ry(Y),7,0,Math.PI*2);c.fill()}$('#consumerForm').onsubmit=e=>{e.preventDefault();run()};run()}
function bindStructures(){function run(){let A=+$('#A').value,B=+$('#B').value,MC=+$('#mc').value,Qc=(A-MC)/B,Pc=MC,Qm=(A-MC)/(2*B),Pm=A-B*Qm,profit=(Pm-MC)*Qm,dwl=.5*(Qc-Qm)*(Pm-MC);$('#structResults').innerHTML=`<div class="resultline"><span>Competencia Qc / Pc</span><b>${Qc.toFixed(2)} / ${Pc.toFixed(2)}</b></div><div class="resultline"><span>Monopolio Qm / Pm</span><b>${Qm.toFixed(2)} / ${Pm.toFixed(2)}</b></div><div class="resultline"><span>Beneficio monopolio*</span><b>${profit.toFixed(2)}</b></div><div class="resultline"><span>Pérdida irrecuperable</span><b>${dwl.toFixed(2)}</b></div><small class="muted">*Sin costos fijos.</small>`;let cv=$('#structChart'),c=cv.getContext('2d'),w=cv.width,h=cv.height;axes(c,w,h,'Q','P');let px=q=>55+q/(A/B)*(w-80),py=p=>h-42-p/A*(h-70),qs=Array.from({length:80},(_,i)=>i/79*A/B);line(c,qs.map(q=>[px(q),py(A-B*q)]),'#b33f49','D');line(c,qs.map(q=>[px(q),py(A-2*B*q)]),'#2676ad','IMg');line(c,[[px(0),py(MC)],[px(A/B),py(MC)]],'#176b4d','CMg')}$('#structForm').onsubmit=e=>{e.preventDefault();run()};run()}
const FIRST='market',PAGES={market,elasticity,costs,consumer,structures},TITLES={market:'Oferta y demanda',elasticity:'Elasticidad',costs:'Costos',consumer:'Consumidor',structures:'Estructuras de mercado'},BINDS={market:bindMarket,elasticity:bindElastic,costs:bindCosts,consumer:bindConsumer,structures:bindStructures},THEME='od-micro-theme';

const $=s=>document.querySelector(s),fmt=n=>new Intl.NumberFormat('es-CL',{style:'currency',currency:'CLP',maximumFractionDigits:0}).format(n);let page=location.hash.slice(1)||FIRST;
function head(t,s){return `<div class="head"><div><h2>${t}</h2><p>${s}</p></div></div>`}function axes(ctx,w,h,x,y){ctx.clearRect(0,0,w,h);ctx.strokeStyle='#748379';ctx.beginPath();ctx.moveTo(55,20);ctx.lineTo(55,h-42);ctx.lineTo(w-20,h-42);ctx.stroke();ctx.fillStyle='#66746b';ctx.font='13px system-ui';ctx.fillText(y,12,22);ctx.fillText(x,w-70,h-12)}function line(ctx,pts,color,label,dash=[]){ctx.save();ctx.setLineDash(dash);ctx.strokeStyle=color;ctx.lineWidth=3;ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.stroke();ctx.restore();ctx.fillStyle=color;ctx.font='bold 12px system-ui';let p=pts[pts.length-1];ctx.fillText(label,p[0]-40,p[1]-8)}function toast(x){$('#toast').innerHTML=`<div class="toast">${x}</div>`;setTimeout(()=>$('#toast').innerHTML='',2000)}
function render(){page=location.hash.slice(1)||FIRST;if(!PAGES[page])page=FIRST;$('#view').innerHTML=PAGES[page]();$('#title').textContent=TITLES[page];document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));if(BINDS[page])BINDS[page]()}$('#nav').onclick=e=>{let b=e.target.closest('[data-page]');if(b){location.hash=b.dataset.page;$('#side').classList.remove('open')}};window.onhashchange=render;$('#menu').onclick=()=>$('#side').classList.toggle('open');$('#theme').onclick=()=>{let d=document.documentElement.dataset.theme==='dark';document.documentElement.dataset.theme=d?'light':'dark';localStorage.setItem(THEME,d?'light':'dark')};document.documentElement.dataset.theme=localStorage.getItem(THEME)||'light';render();
</script></body></html>
