<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Panel de administración SPA de OpenDirectory">
<title>OpenDirectory Admin</title>
<style>
:root{--bg:#f4f7f5;--surface:#fff;--surface2:#eef3ef;--text:#15231b;--muted:#68766d;--line:#dce5de;--brand:#176b4d;--brand2:#0f5039;--accent:#e8a92d;--danger:#b53a45;--info:#2777b8;--shadow:0 14px 38px rgba(24,72,49,.1);--radius:16px;--side:264px}
[data-theme="dark"]{--bg:#0c1410;--surface:#142019;--surface2:#1b2a21;--text:#edf6f0;--muted:#9caf9f;--line:#2b3d31;--brand:#49b887;--brand2:#329768;--accent:#f4bd55;--danger:#ed7780;--info:#6eb2e6;--shadow:0 16px 42px rgba(0,0,0,.28)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font:15px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}button,input,select,textarea{font:inherit}button{cursor:pointer}a{color:inherit;text-decoration:none}.hidden{display:none!important}.sr{position:absolute;left:-9999px}.app{min-height:100vh;display:grid;grid-template-columns:var(--side) 1fr}.sidebar{position:sticky;top:0;height:100vh;background:#092d21;color:#ecfff5;padding:18px 14px;display:flex;flex-direction:column;z-index:30}.brand{display:flex;gap:10px;align-items:center;padding:8px 10px 22px;font-weight:850;font-size:1.08rem}.brandmark{width:38px;height:38px;border-radius:12px;background:#d9f6e6;color:#0d5438;display:grid;place-items:center;font-weight:950}.nav{display:grid;gap:5px}.nav button{border:0;background:transparent;color:#c8dfd1;padding:11px 12px;border-radius:10px;text-align:left;display:flex;gap:10px;align-items:center}.nav button:hover,.nav button.active{background:#15523d;color:white}.nav .label{font-size:.76rem;text-transform:uppercase;letter-spacing:.1em;color:#81ad94;margin:15px 10px 5px}.sidefoot{margin-top:auto;border-top:1px solid #1d563f;padding:15px 8px 0;color:#aed0bc;font-size:.87rem}.main{min-width:0}.topbar{height:72px;position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:0 24px}.topbar h1{font-size:1.1rem;margin:0}.topbar .spacer{flex:1}.iconbtn,.btn{border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:10px;padding:9px 12px;font-weight:720}.btn.primary{background:var(--brand);border-color:var(--brand);color:white}.btn.danger{color:var(--danger)}.iconbtn{width:40px;height:40px;padding:0}.menu{display:none}.content{padding:24px;max-width:1500px;margin:auto}.pagehead{display:flex;justify-content:space-between;align-items:end;gap:16px;margin-bottom:20px}.pagehead h2{font-size:1.85rem;letter-spacing:-.035em;margin:0}.pagehead p{margin:5px 0 0;color:var(--muted)}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}.kpi{padding:18px}.kpi .value{font-size:2rem;font-weight:900;letter-spacing:-.04em}.kpi .name{color:var(--muted)}.kpi .delta{margin-top:8px;color:var(--brand);font-weight:750;font-size:.86rem}.grid2{display:grid;grid-template-columns:1.35fr .65fr;gap:16px;margin-top:16px}.panel{padding:18px}.panel h3{margin:0 0 14px;font-size:1.05rem}.activity{display:grid;gap:12px}.activity-item{display:grid;grid-template-columns:38px 1fr auto;gap:10px;align-items:center}.activity-icon{width:36px;height:36px;border-radius:10px;background:var(--surface2);display:grid;place-items:center}.activity-item small,.muted{color:var(--muted)}.bar{height:10px;border-radius:99px;background:var(--surface2);overflow:hidden}.bar span{display:block;height:100%;background:var(--brand);border-radius:99px}.metricrow{display:grid;gap:10px}.metricrow>div{display:grid;grid-template-columns:110px 1fr 45px;align-items:center;gap:8px}.toolbar{display:flex;flex-wrap:wrap;gap:9px;margin:0 0 14px}.input,.select,textarea{border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:10px;padding:10px 11px}.input{min-width:240px}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:12px}table{width:100%;border-collapse:collapse;min-width:760px;background:var(--surface)}th,td{text-align:left;padding:12px;border-bottom:1px solid var(--line)}th{font-size:.78rem;text-transform:uppercase;letter-spacing:.065em;color:var(--muted);background:var(--surface2)}tr:last-child td{border-bottom:0}.badge{display:inline-flex;border-radius:99px;padding:4px 8px;font-size:.78rem;font-weight:780;background:var(--surface2)}.badge.ok{color:var(--brand)}.badge.warn{color:#a86c00}.badge.bad{color:var(--danger)}.rowactions{display:flex;gap:6px}.rowactions button{border:0;background:var(--surface2);color:var(--text);border-radius:8px;padding:6px 8px}.map{min-height:380px;border-radius:14px;background:linear-gradient(35deg,#b7d1c4,#e6eee9);position:relative;overflow:hidden}.map:before,.map:after{content:"";position:absolute;border:1px solid rgba(18,77,53,.18);width:130%;height:1px;transform:rotate(-18deg);top:45%;left:-15%}.map:after{transform:rotate(28deg);top:62%}.marker{position:absolute;width:16px;height:16px;border-radius:50% 50% 50% 0;background:var(--danger);transform:rotate(-45deg);box-shadow:0 3px 8px #486}.marker span{display:block;width:6px;height:6px;margin:5px;background:white;border-radius:50%}.layerlist{display:grid;gap:9px}.layerlist label{display:flex;align-items:center;gap:9px}.collections{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.collection{padding:18px}.collection h3{margin:0 0 4px}.collection .count{font-size:1.7rem;font-weight:900;margin:14px 0 4px}.settings{display:grid;grid-template-columns:1fr 1fr;gap:16px}.form{display:grid;gap:11px}.form label{font-weight:700}.form label span{display:block;color:var(--muted);font-size:.84rem;font-weight:500;margin-bottom:4px}.form input,.form select,.form textarea{width:100%}.toast{position:fixed;right:20px;bottom:20px;background:var(--text);color:var(--surface);padding:12px 16px;border-radius:11px;box-shadow:var(--shadow);z-index:100;animation:in .18s ease}.modalback{position:fixed;inset:0;background:rgba(0,0,0,.46);display:grid;place-items:center;padding:20px;z-index:90}.modal{width:min(620px,100%);max-height:90vh;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:var(--shadow)}.modalhead{display:flex;justify-content:space-between;align-items:center}.modalhead h3{margin:0}.modalfoot{display:flex;justify-content:flex-end;gap:9px;margin-top:18px}.chart{height:250px;display:flex;align-items:end;gap:14px;padding:25px 10px 4px;border-bottom:1px solid var(--line)}.chartcol{flex:1;text-align:center;color:var(--muted);font-size:.78rem}.chartbar{background:linear-gradient(var(--brand),var(--brand2));border-radius:9px 9px 2px 2px;min-height:8px}.empty{padding:38px;text-align:center;color:var(--muted)}
@keyframes in{from{transform:translateY(10px);opacity:0}}@media(max-width:1050px){.kpis{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}.collections{grid-template-columns:repeat(2,1fr)}}@media(max-width:760px){.app{grid-template-columns:1fr}.sidebar{position:fixed;left:-280px;width:264px;transition:.2s}.sidebar.open{left:0}.menu{display:block}.content{padding:16px}.topbar{padding:0 15px}.kpis,.collections,.settings{grid-template-columns:1fr}.pagehead{align-items:start;flex-direction:column}.input{min-width:100%;width:100%}.toolbar>*{flex:1}.metricrow>div{grid-template-columns:90px 1fr 38px}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar" id="sidebar">
 <div class="brand"><span class="brandmark">OD</span><span>OpenDirectory<br><small>Administración</small></span></div>
 <nav class="nav" id="nav">
  <button data-route="dashboard" class="active">▦ Dashboard</button>
  <div class="label">Directorio</div>
  <button data-route="businesses">🏢 Empresas</button><button data-route="requests">📥 Solicitudes</button><button data-route="categories">◫ Categorías</button><button data-route="moderation">✓ Moderación</button>
  <div class="label">Usuarios y territorio</div>
  <button data-route="collections">★ Directorios personales</button><button data-route="territory">⌖ Territorio y GIS</button><button data-route="users">♙ Usuarios</button>
  <div class="label">Sistema</div>
  <button data-route="analytics">↗ Analítica</button><button data-route="open-data">⇩ Open Data</button><button data-route="settings">⚙ Configuración</button>
 </nav>
 <div class="sidefoot">OpenDirectory v0.1<br>Prototipo local · MIT</div>
</aside>
<main class="main">
 <header class="topbar"><button class="iconbtn menu" id="menuBtn" aria-label="Abrir menú">☰</button><h1 id="topTitle">Dashboard</h1><div class="spacer"></div><button class="iconbtn" id="themeBtn" aria-label="Cambiar tema">◐</button><button class="btn primary" id="quickAdd">+ Nuevo</button></header>
 <section class="content" id="view" tabindex="-1"></section>
</main>
</div>
<div id="overlay"></div><div id="toast" aria-live="polite"></div>
<script>
(()=>{
const initial={businesses:[
{id:1,name:'Patagonia Trek',category:'Turismo',location:'Puerto Natales',status:'Activa',verified:true,updated:'29 oct 2026'},
{id:2,name:'Hostal Austral',category:'Alojamiento',location:'Punta Arenas',status:'Pendiente',verified:false,updated:'28 oct 2026'},
{id:3,name:'Transfer Paine',category:'Transporte',location:'Torres del Paine',status:'Activa',verified:true,updated:'27 oct 2026'},
{id:4,name:'Sabores del Fiordo',category:'Gastronomía',location:'Puerto Natales',status:'Revisión',verified:false,updated:'26 oct 2026'},
{id:5,name:'Datos Australes',category:'Servicios',location:'Punta Arenas',status:'Activa',verified:true,updated:'24 oct 2026'}],
users:[{id:1,name:'Gonzalo Frías',email:'gonzalo@example.cl',role:'Administrador',collections:14},{id:2,name:'Ana Soto',email:'ana@example.cl',role:'Editor',collections:8},{id:3,name:'Carlos Pérez',email:'carlos@example.cl',role:'Usuario',collections:5}],
categories:[{name:'Turismo',count:28},{name:'Alojamiento',count:19},{name:'Gastronomía',count:17},{name:'Transporte',count:13},{name:'Servicios',count:23}],
collections:[{name:'Proveedores turísticos',owner:'Gonzalo Frías',items:42,privacy:'Privado'},{name:'Servicios de Natales',owner:'Ana Soto',items:18,privacy:'Compartido'},{name:'Investigación territorial',owner:'Gonzalo Frías',items:31,privacy:'Privado'}],
moderation:[{id:101,type:'Empresa nueva',item:'Hostal Austral',author:'Ana Soto'},{id:102,type:'Cambio de ficha',item:'Sabores del Fiordo',author:'Empresa'},{id:103,type:'Nueva categoría',item:'Turismo científico',author:'Editor'}]};
const clone=o=>JSON.parse(JSON.stringify(o)); let state=JSON.parse(localStorage.getItem('od-admin-state')||'null')||clone(initial);let route=location.hash.slice(1)||'dashboard';
const $=s=>document.querySelector(s), esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function persist(){localStorage.setItem('od-admin-state',JSON.stringify(state))}function toast(msg){$('#toast').innerHTML=`<div class="toast">${esc(msg)}</div>`;setTimeout(()=>$('#toast').innerHTML='',2300)}
function pageHead(title,sub,action=''){return `<div class="pagehead"><div><h2>${title}</h2><p>${sub}</p></div>${action}</div>`}
const badge=s=>`<span class="badge ${s==='Activa'?'ok':s==='Pendiente'||s==='Revisión'?'warn':''}">${esc(s)}</span>`;
function dashboard(){return `${pageHead('Centro de operaciones','Resumen del directorio público, usuarios y actividad territorial.')}<div class="kpis"><div class="card kpi"><div class="value">${state.businesses.length}</div><div class="name">Empresas</div><div class="delta">3 verificadas</div></div><div class="card kpi"><div class="value">${state.users.length}</div><div class="name">Usuarios</div><div class="delta">2 activos hoy</div></div><div class="card kpi"><div class="value">9.874</div><div class="name">Búsquedas</div><div class="delta">+12,4% mensual</div></div><div class="card kpi"><div class="value">${state.moderation.length}</div><div class="name">Pendientes</div><div class="delta">Requieren revisión</div></div></div><div class="grid2"><div class="card panel"><h3>Búsquedas por categoría</h3><div class="metricrow">${state.categories.map((x,i)=>`<div><span>${esc(x.name)}</span><div class="bar"><span style="width:${Math.min(100,x.count*3)}%"></span></div><b>${x.count}</b></div>`).join('')}</div></div><div class="card panel"><h3>Actividad reciente</h3><div class="activity"><div class="activity-item"><span class="activity-icon">✓</span><div>Empresa verificada<small>Patagonia Trek</small></div><small>10:32</small></div><div class="activity-item"><span class="activity-icon">★</span><div>Nueva colección<small>Servicios de Natales</small></div><small>Ayer</small></div><div class="activity-item"><span class="activity-icon">⇩</span><div>Dataset exportado<small>businesses.geojson</small></div><small>2 días</small></div></div></div></div>`}
function businesses(){const rows=state.businesses.map(b=>`<tr><td>${b.id}</td><td><b>${esc(b.name)}</b><br><small class="muted">${b.verified?'✓ Verificada':'Sin verificar'}</small></td><td>${esc(b.category)}</td><td>${esc(b.location)}</td><td>${badge(b.status)}</td><td>${esc(b.updated)}</td><td><div class="rowactions"><button data-edit-business="${b.id}">Editar</button><button data-delete-business="${b.id}">Eliminar</button></div></td></tr>`).join('');return `${pageHead('Empresas','Administra fichas públicas, verificación y estado de publicación.','<button class="btn primary" data-new-business>+ Empresa</button>')}<div class="card panel"><div class="toolbar"><input class="input" id="businessSearch" placeholder="Buscar empresa o territorio"><select class="select" id="businessStatus"><option value="">Todos los estados</option><option>Activa</option><option>Pendiente</option><option>Revisión</option></select></div><div class="tablewrap"><table><thead><tr><th>ID</th><th>Empresa</th><th>Categoría</th><th>Territorio</th><th>Estado</th><th>Actualización</th><th>Acciones</th></tr></thead><tbody id="businessRows">${rows}</tbody></table></div></div>`}
function getRequests(){return JSON.parse(localStorage.getItem('od-business-requests')||'[]')}
function saveRequests(items){localStorage.setItem('od-business-requests',JSON.stringify(items))}
function requests(){const items=getRequests();const rows=items.map(r=>`<tr><td>${esc(r.folio||('#'+r.id))}</td><td><b>${esc(r.name)}</b><br><small class="muted">${esc(r.rut||'Sin RUT')}</small></td><td>${esc(r.category||'Sin categoría')}</td><td>${esc(r.location||'Sin ubicación')}</td><td>${badge(r.status||'Pendiente')}</td><td>${r.submittedAt?new Date(r.submittedAt).toLocaleDateString('es-CL'):'-'}</td><td><div class="rowactions">${r.status==='Pendiente'?`<button data-request-view="${r.id}">Ver</button><button data-request-approve="${r.id}">Aprobar</button><button data-request-reject="${r.id}">Rechazar</button>`:`<button data-request-view="${r.id}">Ver</button>`}</div></td></tr>`).join('');return `${pageHead('Solicitudes empresariales','Revisa registros web antes de incorporarlos al directorio público.')}<div class="card panel"><div class="toolbar"><select class="select" id="requestStatus"><option value="">Todos los estados</option><option>Pendiente</option><option>Aprobada</option><option>Rechazada</option></select></div><div class="tablewrap"><table><thead><tr><th>Folio</th><th>Empresa / RUT</th><th>Categoría</th><th>Territorio</th><th>Estado</th><th>Ingreso</th><th>Acciones</th></tr></thead><tbody id="requestRows">${rows||'<tr><td colspan="7" class="empty">No hay solicitudes registradas.</td></tr>'}</tbody></table></div></div>`}
function categories(){return `${pageHead('Categorías','Taxonomía compartida por la Web, API, CLI y TUI.','<button class="btn primary" data-add-category>+ Categoría</button>')}<div class="collections">${state.categories.map(c=>`<div class="card collection"><h3>${esc(c.name)}</h3><p class="muted">Categoría raíz</p><div class="count">${c.count}</div><span class="muted">empresas vinculadas</span></div>`).join('')}</div>`}
function moderation(){return `${pageHead('Moderación','Cola de validación editorial y trazabilidad.')}<div class="card panel"><div class="tablewrap"><table><thead><tr><th>Solicitud</th><th>Tipo</th><th>Elemento</th><th>Autor</th><th>Acciones</th></tr></thead><tbody>${state.moderation.map(x=>`<tr><td>#${x.id}</td><td>${esc(x.type)}</td><td><b>${esc(x.item)}</b></td><td>${esc(x.author)}</td><td><div class="rowactions"><button data-approve="${x.id}">Aprobar</button><button data-reject="${x.id}">Rechazar</button></div></td></tr>`).join('')||'<tr><td colspan="5" class="empty">No hay elementos pendientes.</td></tr>'}</tbody></table></div></div>`}
function collections(){return `${pageHead('Directorios personales','La capa privada mantiene colecciones, favoritos y notas sin modificar las fichas públicas.','<button class="btn primary" data-add-collection>+ Colección</button>')}<div class="collections">${state.collections.map(c=>`<div class="card collection"><span class="badge">${esc(c.privacy)}</span><h3>${esc(c.name)}</h3><p class="muted">Propietario: ${esc(c.owner)}</p><div class="count">${c.items}</div><span class="muted">elementos guardados</span></div>`).join('')}</div>`}
function territory(){return `${pageHead('Territorio y GIS','Vista conceptual para capas de Magallanes y Última Esperanza.')}<div class="grid2"><div class="card panel"><div class="map" aria-label="Mapa conceptual"><i class="marker" style="left:30%;top:42%"><span></span></i><i class="marker" style="left:51%;top:58%"><span></span></i><i class="marker" style="left:68%;top:31%"><span></span></i></div></div><div class="card panel"><h3>Capas visibles</h3><div class="layerlist"><label><input type="checkbox" checked> Empresas</label><label><input type="checkbox" checked> Territorios administrativos</label><label><input type="checkbox"> Áreas protegidas</label><label><input type="checkbox"> Senderos</label><label><input type="checkbox"> Patrimonio</label><label><input type="checkbox"> Reserva de Biosfera</label></div><hr style="border:0;border-top:1px solid var(--line);margin:18px 0"><p class="muted">Prototipo sin cartografía externa. La implementación real puede conectarse a MapLibre GL JS y PostGIS.</p></div></div>`}
function users(){return `${pageHead('Usuarios','Roles, colecciones y acceso al sistema.','<button class="btn primary" data-add-user>+ Usuario</button>')}<div class="card panel"><div class="tablewrap"><table><thead><tr><th>Usuario</th><th>Correo</th><th>Rol</th><th>Colecciones</th></tr></thead><tbody>${state.users.map(u=>`<tr><td><b>${esc(u.name)}</b></td><td>${esc(u.email)}</td><td>${esc(u.role)}</td><td>${u.collections}</td></tr>`).join('')}</tbody></table></div></div>`}
function analytics(){const vals=[44,61,52,78,69,88,95];return `${pageHead('Analítica','Datos demostrativos de uso y descubrimiento.')}<div class="grid2"><div class="card panel"><h3>Búsquedas de los últimos 7 días</h3><div class="chart">${vals.map((v,i)=>`<div class="chartcol"><div class="chartbar" style="height:${v*2}px"></div><span>${['J','V','S','D','L','M','X'][i]}</span></div>`).join('')}</div></div><div class="card panel"><h3>Consultas frecuentes</h3><div class="activity"><div>1. turismo <b style="float:right">1.842</b></div><div>2. alojamiento <b style="float:right">1.216</b></div><div>3. transporte <b style="float:right">908</b></div><div>4. gastronomía <b style="float:right">734</b></div></div></div></div>`}
function openData(){return `${pageHead('Open Data','Exportaciones para reutilización institucional y análisis externo.')}<div class="collections"><div class="card collection"><h3>Empresas CSV</h3><p class="muted">Datos tabulares del directorio.</p><button class="btn" data-export="csv">Generar CSV</button></div><div class="card collection"><h3>Empresas GeoJSON</h3><p class="muted">Registros geográficos para QGIS.</p><button class="btn" data-export="geojson">Generar GeoJSON</button></div><div class="card collection"><h3>Taxonomía JSON</h3><p class="muted">Categorías y metadatos.</p><button class="btn" data-export="json">Generar JSON</button></div></div>`}
function settings(){return `${pageHead('Configuración','Parámetros generales del portal y del proyecto abierto.')}<div class="settings"><div class="card panel"><h3>Portal</h3><form class="form" id="settingsForm"><label><span>Nombre público</span><input class="input" name="portal" value="OpenDirectory"></label><label><span>Dominio</span><input class="input" name="domain" value="opendirectory.local"></label><label><span>Idioma principal</span><select class="select" name="lang"><option>Español</option><option>English</option></select></label><button class="btn primary">Guardar configuración</button></form></div><div class="card panel"><h3>Proyecto</h3><p><b>Licencia:</b> MIT</p><p><b>Modo:</b> Prototipo local</p><p><b>Persistencia:</b> localStorage</p><button class="btn danger" id="resetData">Restablecer datos de prueba</button></div></div>`}
const pages={dashboard,businesses,requests,categories,moderation,collections,territory,users,analytics,'open-data':openData,settings};const titles={'open-data':'Open Data',requests:'Solicitudes',businesses:'Empresas',categories:'Categorías',moderation:'Moderación',collections:'Directorios personales',territory:'Territorio y GIS',users:'Usuarios',analytics:'Analítica',settings:'Configuración',dashboard:'Dashboard'};
function render(){route=location.hash.slice(1)||'dashboard';if(!pages[route])route='dashboard';$('#view').innerHTML=pages[route]();$('#topTitle').textContent=titles[route];document.querySelectorAll('[data-route]').forEach(b=>b.classList.toggle('active',b.dataset.route===route));$('#view').focus();bindPage()}
function modal(title,body,onSave){$('#overlay').innerHTML=`<div class="modalback"><div class="modal" role="dialog" aria-modal="true"><div class="modalhead"><h3>${title}</h3><button class="iconbtn" data-close>×</button></div><form id="modalForm">${body}<div class="modalfoot"><button class="btn" type="button" data-close>Cancelar</button><button class="btn primary">Guardar</button></div></form></div></div>`;document.querySelectorAll('[data-close]').forEach(x=>x.onclick=()=>$('#overlay').innerHTML='');$('#modalForm').onsubmit=e=>{e.preventDefault();onSave(new FormData(e.target));$('#overlay').innerHTML='';persist();render()}}
function businessModal(id){const b=id?state.businesses.find(x=>x.id===id):null;modal(b?'Editar empresa':'Nueva empresa',`<div class="form"><label><span>Nombre</span><input class="input" name="name" required value="${esc(b?.name||'')}"></label><label><span>Categoría</span><select class="select" name="category">${state.categories.map(c=>`<option ${b?.category===c.name?'selected':''}>${esc(c.name)}</option>`).join('')}</select></label><label><span>Territorio</span><input class="input" name="location" required value="${esc(b?.location||'Puerto Natales')}"></label><label><span>Estado</span><select class="select" name="status">${['Activa','Pendiente','Revisión'].map(s=>`<option ${b?.status===s?'selected':''}>${s}</option>`).join('')}</select></label><label><input type="checkbox" name="verified" ${b?.verified?'checked':''}> Empresa verificada</label></div>`,fd=>{const obj={id:b?.id||Math.max(0,...state.businesses.map(x=>x.id))+1,name:fd.get('name'),category:fd.get('category'),location:fd.get('location'),status:fd.get('status'),verified:fd.has('verified'),updated:'29 oct 2026'};if(b)Object.assign(b,obj);else state.businesses.push(obj);toast(b?'Empresa actualizada':'Empresa creada')})}
function viewRequest(id){const r=getRequests().find(x=>x.id===id);if(!r)return;modal('Solicitud '+esc(r.folio||id),`<div class="form"><p><b>${esc(r.name)}</b> · ${esc(r.rut)}</p><p><b>Contacto:</b> ${esc(r.contact||'')} · ${esc(r.email||'')} · ${esc(r.phone||'')}</p><p><b>Territorio:</b> ${esc(r.location||'')} · ${esc(r.address||'')}</p><p><b>Categoría:</b> ${esc(r.category||'')}</p><p><b>Descripción:</b><br>${esc(r.description||'')}</p><p><b>Estado:</b> ${esc(r.status||'Pendiente')}</p>${r.reviewNote?`<p><b>Observación:</b> ${esc(r.reviewNote)}</p>`:''}</div>`,()=>{})}
function approveRequest(id){const items=getRequests(),r=items.find(x=>x.id===id);if(!r||r.status!=='Pendiente')return;const normalized=String(r.rut||'').replace(/[^0-9kK]/g,'').toUpperCase();const approved=JSON.parse(localStorage.getItem('od-approved-businesses')||'[]');if(approved.some(x=>String(x.rut||'').replace(/[^0-9kK]/g,'').toUpperCase()===normalized)||state.businesses.some(x=>x.rut&&String(x.rut).replace(/[^0-9kK]/g,'').toUpperCase()===normalized)){toast('No se aprobó: el RUT ya existe en el directorio.');return}r.status='Aprobada';r.verified=true;r.reviewedAt=new Date().toISOString();const business={id:Math.max(0,...state.businesses.map(x=>x.id))+1,name:r.name,rut:r.rut,category:r.category||'Sin categoría',location:r.location||'Sin ubicación',status:'Activa',verified:true,updated:'Aprobada desde solicitud'};state.businesses.push(business);approved.push(business);localStorage.setItem('od-approved-businesses',JSON.stringify(approved));saveRequests(items);persist();render();toast('Solicitud aprobada y empresa publicada')}
function rejectRequest(id){const note=prompt('Motivo del rechazo:');if(note===null)return;const items=getRequests(),r=items.find(x=>x.id===id);if(!r||r.status!=='Pendiente')return;r.status='Rechazada';r.reviewedAt=new Date().toISOString();r.reviewNote=note.trim()||'Sin observación';saveRequests(items);render();toast('Solicitud rechazada')}
function bindPage(){document.querySelectorAll('[data-request-view]').forEach(b=>b.onclick=()=>viewRequest(+b.dataset.requestView));document.querySelectorAll('[data-request-approve]').forEach(b=>b.onclick=()=>approveRequest(+b.dataset.requestApprove));document.querySelectorAll('[data-request-reject]').forEach(b=>b.onclick=()=>rejectRequest(+b.dataset.requestReject));const requestStatus=$('#requestStatus');if(requestStatus)requestStatus.onchange=()=>{const items=getRequests();document.querySelectorAll('#requestRows tr').forEach((tr,i)=>{tr.style.display=!requestStatus.value||items[i]?.status===requestStatus.value?'':'none'})};document.querySelectorAll('[data-new-business]').forEach(b=>b.onclick=()=>businessModal());document.querySelectorAll('[data-edit-business]').forEach(b=>b.onclick=()=>businessModal(+b.dataset.editBusiness));document.querySelectorAll('[data-delete-business]').forEach(b=>b.onclick=()=>{if(confirm('¿Eliminar esta empresa?')){state.businesses=state.businesses.filter(x=>x.id!==+b.dataset.deleteBusiness);persist();render();toast('Empresa eliminada')}});const search=$('#businessSearch'),status=$('#businessStatus');if(search){const filter=()=>{const t=search.value.toLowerCase();document.querySelectorAll('#businessRows tr').forEach((tr,i)=>{const b=state.businesses[i],show=(!t||[b.name,b.location,b.category].join(' ').toLowerCase().includes(t))&&(!status.value||b.status===status.value);tr.style.display=show?'':'none'})};search.oninput=filter;status.onchange=filter}document.querySelectorAll('[data-approve],[data-reject]').forEach(b=>b.onclick=()=>{const id=+(b.dataset.approve||b.dataset.reject);state.moderation=state.moderation.filter(x=>x.id!==id);persist();render();toast(b.dataset.approve?'Elemento aprobado':'Elemento rechazado')});const addCat=$('[data-add-category]');if(addCat)addCat.onclick=()=>modal('Nueva categoría','<div class="form"><label><span>Nombre</span><input class="input" name="name" required></label></div>',fd=>{state.categories.push({name:fd.get('name'),count:0});toast('Categoría creada')});document.querySelectorAll('[data-export]').forEach(b=>b.onclick=()=>exportData(b.dataset.export));const form=$('#settingsForm');if(form)form.onsubmit=e=>{e.preventDefault();toast('Configuración guardada')};const reset=$('#resetData');if(reset)reset.onclick=()=>{if(confirm('¿Restablecer todos los datos de prueba?')){state=clone(initial);persist();render();toast('Datos restablecidos')}}}
function exportData(type){let text,name,mime;if(type==='csv'){text='id,name,category,location,status\n'+state.businesses.map(b=>[b.id,b.name,b.category,b.location,b.status].map(x=>`"${String(x).replaceAll('"','""')}"`).join(',')).join('\n');name='opendirectory-businesses.csv';mime='text/csv'}else if(type==='geojson'){text=JSON.stringify({type:'FeatureCollection',features:state.businesses.map((b,i)=>({type:'Feature',geometry:{type:'Point',coordinates:[-72.5+i*.2,-51.7+i*.1]},properties:b}))},null,2);name='opendirectory-businesses.geojson';mime='application/geo+json'}else{text=JSON.stringify(state.categories,null,2);name='opendirectory-categories.json';mime='application/json'}const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:mime}));a.download=name;a.click();URL.revokeObjectURL(a.href);toast('Archivo generado')}
$('#nav').onclick=e=>{const b=e.target.closest('[data-route]');if(b){location.hash=b.dataset.route;$('#sidebar').classList.remove('open')}};window.addEventListener('hashchange',render);$('#menuBtn').onclick=()=>$('#sidebar').classList.toggle('open');$('#themeBtn').onclick=()=>{const dark=document.documentElement.dataset.theme==='dark';document.documentElement.dataset.theme=dark?'light':'dark';localStorage.setItem('od-theme',dark?'light':'dark')};document.documentElement.dataset.theme=localStorage.getItem('od-theme')||'light';$('#quickAdd').onclick=()=>businessModal();render();
})();
</script>
</body>
</html>
