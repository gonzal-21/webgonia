<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Business Model Canvas de OpenDirectory para asesorías empresariales.">
<title>Business Model Canvas | OpenDirectory Business Lab</title>
<style>
:root{--bg:#f2f6f3;--surface:#fff;--soft:#eaf1ec;--text:#17221b;--muted:#657269;--line:#d7e1da;--brand:#176b4d;--brand2:#0e4c36;--accent:#e9af3d;--danger:#ad3c48;--info:#2d75aa;--shadow:0 16px 44px rgba(22,75,49,.11);--radius:16px}
[data-theme="dark"]{--bg:#0c1410;--surface:#142019;--soft:#1b2a21;--text:#eef7f1;--muted:#9fb1a5;--line:#2b3d31;--brand:#4eb989;--brand2:#329668;--accent:#f2bc56;--danger:#ef7e86;--info:#75b6e5;--shadow:0 17px 46px rgba(0,0,0,.3)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font:14px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{min-height:100vh;display:grid;grid-template-columns:250px 1fr}.sidebar{background:#092e21;color:#eafff2;min-height:100vh;position:sticky;top:0;height:100vh;padding:17px 13px;display:flex;flex-direction:column;z-index:20}.brand{display:flex;gap:10px;align-items:center;padding:6px 9px 20px;font-weight:900}.mark{width:38px;height:38px;border-radius:11px;background:#d8f6e5;color:#0d5539;display:grid;place-items:center}.nav{display:grid;gap:5px}.nav button{border:0;background:transparent;color:#c9dfd2;padding:11px;border-radius:10px;text-align:left}.nav button:hover,.nav button.active{background:#15533e;color:#fff}.navlabel{font-size:.73rem;text-transform:uppercase;letter-spacing:.1em;color:#7fae94;margin:16px 10px 5px}.sidebar-foot{margin-top:auto;border-top:1px solid #1d5840;padding:14px 9px 0;color:#acd0ba;font-size:.82rem}.main{min-width:0}.topbar{position:sticky;top:0;z-index:15;height:70px;background:color-mix(in srgb,var(--surface) 93%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:0 19px}.topbar h1{font-size:1.05rem;margin:0}.spacer{flex:1}.btn,.iconbtn{border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:10px;padding:9px 12px;font-weight:740}.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}.btn.danger{color:var(--danger)}.iconbtn{width:40px;height:40px;padding:0}.menu{display:none}.content{padding:20px;max-width:1660px;margin:auto}.pagehead{display:flex;justify-content:space-between;align-items:end;gap:15px;margin-bottom:18px}.pagehead h2{font-size:1.8rem;letter-spacing:-.035em;margin:0}.pagehead p{margin:4px 0 0;color:var(--muted)}.head-actions{display:flex;gap:8px;flex-wrap:wrap}.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}.context{padding:14px;display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:10px;margin-bottom:15px}.field{display:grid;gap:5px}.field label{font-weight:720;font-size:.82rem;color:var(--muted)}input,select,textarea{border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:9px;padding:9px 10px}.canvas{display:grid;grid-template-columns:repeat(10,1fr);grid-template-rows:repeat(2,minmax(260px,auto)) minmax(220px,auto);gap:10px}.block{padding:13px;display:flex;flex-direction:column;min-width:0}.block h3{margin:0;font-size:.94rem}.block .question{color:var(--muted);font-size:.78rem;margin:4px 0 10px}.block textarea{width:100%;flex:1;min-height:150px;resize:vertical;background:color-mix(in srgb,var(--soft) 58%,var(--surface));line-height:1.5}.block small{color:var(--muted);margin-top:7px}.partners{grid-column:1/3;grid-row:1/3}.activities{grid-column:3/5;grid-row:1/2}.resources{grid-column:3/5;grid-row:2/3}.value{grid-column:5/7;grid-row:1/3;border-color:color-mix(in srgb,var(--brand) 45%,var(--line))}.relationships{grid-column:7/9;grid-row:1/2}.channels{grid-column:7/9;grid-row:2/3}.segments{grid-column:9/11;grid-row:1/3}.costs{grid-column:1/6;grid-row:3}.revenue{grid-column:6/11;grid-row:3}.block-icon{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:var(--soft);margin-bottom:8px}.value .block-icon{background:color-mix(in srgb,var(--brand) 18%,var(--soft));color:var(--brand)}.statusbar{display:flex;gap:11px;align-items:center;margin-top:13px;padding:12px 14px}.progress{height:9px;background:var(--soft);border-radius:99px;overflow:hidden;flex:1}.progress span{display:block;height:100%;background:var(--brand);border-radius:99px}.diagnostics{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.diag{padding:17px}.diag strong{font-size:1.65rem;display:block}.diag span{color:var(--muted)}.advice{display:grid;grid-template-columns:1.1fr .9fr;gap:13px;margin-top:13px}.panel{padding:18px}.panel h3{margin:0 0 13px}.comment{padding:12px;background:var(--soft);border-radius:10px;margin:9px 0}.comment header{display:flex;justify-content:space-between;gap:8px;font-weight:750}.comment p{margin:6px 0;color:var(--muted)}.task{display:flex;gap:9px;align-items:start;padding:10px 0;border-bottom:1px solid var(--line)}.task:last-child{border-bottom:0}.task input{width:auto;margin-top:3px}.templates{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}.template{padding:18px}.template h3{margin:0 0 5px}.template p{color:var(--muted)}.versions{overflow:auto}.versions table{width:100%;border-collapse:collapse;min-width:650px}.versions th,.versions td{text-align:left;padding:11px;border-bottom:1px solid var(--line)}.versions th{color:var(--muted);font-size:.78rem;text-transform:uppercase}.hidden{display:none!important}.modalback{position:fixed;inset:0;background:rgba(0,0,0,.5);display:grid;place-items:center;padding:20px;z-index:60}.modal{width:min(640px,100%);max-height:90vh;overflow:auto;padding:20px}.modalhead{display:flex;justify-content:space-between;align-items:center}.modalhead h3{margin:0}.modalfoot{display:flex;justify-content:flex-end;gap:8px;margin-top:17px}.toast{position:fixed;right:18px;bottom:18px;background:var(--text);color:var(--surface);padding:12px 15px;border-radius:10px;z-index:70;box-shadow:var(--shadow)}.empty{padding:30px;text-align:center;color:var(--muted)}
@media print{.sidebar,.topbar,.head-actions,.context .btn,.statusbar{display:none!important}.app{display:block}.content{padding:0;max-width:none}.card{box-shadow:none}.canvas{gap:5px}.block{break-inside:avoid}.block textarea{border:0;resize:none;min-height:130px}}
@media(max-width:1150px){.canvas{grid-template-columns:repeat(2,1fr);grid-template-rows:auto}.partners,.activities,.resources,.value,.relationships,.channels,.segments,.costs,.revenue{grid-column:auto;grid-row:auto}.value{grid-column:1/3}.context{grid-template-columns:1fr 1fr}.templates{grid-template-columns:1fr 1fr}.advice{grid-template-columns:1fr}}@media(max-width:760px){.app{grid-template-columns:1fr}.sidebar{position:fixed;left:-270px;width:250px;transition:.2s}.sidebar.open{left:0}.menu{display:block}.content{padding:14px}.pagehead{align-items:start;flex-direction:column}.context,.canvas,.templates,.diagnostics{grid-template-columns:1fr}.value{grid-column:auto}.topbar{padding:0 12px}.topbar .desktop{display:none}.head-actions{width:100%}.head-actions .btn{flex:1}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar" id="sidebar"><div class="brand"><span class="mark">OD</span><span>Business Lab<br><small>Centro de asesorías</small></span></div><nav class="nav" id="nav"><button class="active" data-route="canvas">▦ Business Model Canvas</button><button data-route="diagnosis">◎ Diagnóstico</button><button data-route="advisory">☏ Asesoría</button><button data-route="templates">◫ Plantillas</button><button data-route="versions">↺ Versiones</button><div class="navlabel">Plataforma</div><button data-action="directory">🏢 Volver a OpenDirectory</button><button data-action="admin">⚙ Panel administrativo</button></nav><div class="sidebar-foot">Datos locales · Exportación JSON · Impresión PDF desde el navegador</div></aside>
<main class="main"><header class="topbar"><button class="iconbtn menu" id="menuBtn">☰</button><h1 id="topTitle">Business Model Canvas</h1><div class="spacer"></div><button class="iconbtn" id="themeBtn" aria-label="Cambiar tema">◐</button><button class="btn desktop" id="saveBtn">Guardar</button><button class="btn primary" id="exportBtn">Exportar</button></header><section class="content" id="view"></section></main>
</div><div id="overlay"></div><div id="toast" aria-live="polite"></div>
<script>
(()=>{
const keys=['partners','activities','resources','value','relationships','channels','segments','costs','revenue'];
const labels={partners:'Socios clave',activities:'Actividades clave',resources:'Recursos clave',value:'Propuesta de valor',relationships:'Relaciones con clientes',channels:'Canales',segments:'Segmentos de clientes',costs:'Estructura de costos',revenue:'Fuentes de ingresos'};
const prompts={partners:'¿Quiénes permiten que el modelo funcione?',activities:'¿Qué debe hacer especialmente bien la empresa?',resources:'¿Qué activos son indispensables?',value:'¿Qué problema resuelve y por qué elegirla?',relationships:'¿Cómo adquiere, retiene y desarrolla clientes?',channels:'¿Cómo comunica, vende y entrega?',segments:'¿Para quién crea valor?',costs:'¿Cuáles son los costos estructurales y variables?',revenue:'¿Por qué y cómo pagan los clientes?'};
const examples={partners:'Agencias receptivas\nProveedores locales\nOpenDirectory\nSERNATUR',activities:'Diseño de experiencias\nCoordinación logística\nVentas B2B\nControl de calidad',resources:'Guías acreditados\nVehículos\nMarca y reputación\nSistema de reservas',value:'Experiencias seguras y bilingües en Magallanes, con operación local y reserva simple.',relationships:'Asesoría previa\nSeguimiento por WhatsApp\nPrograma de referidos',channels:'OpenDirectory\nSitio web\nInstagram\nAgencias y hoteles',segments:'Turistas internacionales\nViajeros nacionales\nAgencias receptivas\nEmpresas',costs:'Personal\nTransporte\nSeguros\nMarketing\nComisiones',revenue:'Venta directa de excursiones\nPaquetes B2B\nServicios privados'};
let state=JSON.parse(localStorage.getItem('od-canvas-state')||'null')||{business:'Patagonia Experiencias',advisor:'Asesor/a OpenDirectory',stage:'Borrador',updated:new Date().toISOString(),blocks:Object.fromEntries(keys.map(k=>[k,''])),comments:[],tasks:[],versions:[]};let route=location.hash.slice(1)||'canvas';
const $=s=>document.querySelector(s),esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function persist(makeVersion=false){state.updated=new Date().toISOString();localStorage.setItem('od-canvas-state',JSON.stringify(state));if(makeVersion){state.versions.unshift({id:Date.now(),date:state.updated,stage:state.stage,completion:completion(),blocks:JSON.parse(JSON.stringify(state.blocks))});state.versions=state.versions.slice(0,15);localStorage.setItem('od-canvas-state',JSON.stringify(state))}}
function toast(msg){$('#toast').innerHTML=`<div class="toast">${esc(msg)}</div>`;setTimeout(()=>$('#toast').innerHTML='',2100)}function completion(){return Math.round(keys.filter(k=>state.blocks[k]?.trim()).length/keys.length*100)}
function head(title,sub,actions=''){return `<div class="pagehead"><div><h2>${title}</h2><p>${sub}</p></div><div class="head-actions">${actions}</div></div>`}
function context(){return `<div class="card context"><div class="field"><label>Empresa</label><input id="businessName" value="${esc(state.business)}"></div><div class="field"><label>Asesor/a</label><input id="advisorName" value="${esc(state.advisor)}"></div><div class="field"><label>Estado</label><select id="stage"><option ${state.stage==='Borrador'?'selected':''}>Borrador</option><option ${state.stage==='En revisión'?'selected':''}>En revisión</option><option ${state.stage==='Validado'?'selected':''}>Validado</option></select></div><button class="btn" id="loadExample">Cargar ejemplo</button></div>`}
function canvasPage(){return `${head('Business Model Canvas','Editor estratégico para empresas asesoradas en OpenDirectory.','<button class="btn" id="clearCanvas">Limpiar</button><button class="btn primary" id="snapshot">Crear versión</button>')}${context()}<div class="canvas">${keys.map((k,i)=>`<article class="card block ${k}"><div class="block-icon">${['🤝','⚙','◆','★','♡','➜','♙','$','$'][i]}</div><h3>${labels[k]}</h3><p class="question">${prompts[k]}</p><textarea data-block="${k}" placeholder="Escribe una idea por línea...">${esc(state.blocks[k])}</textarea><small><span data-count="${k}">${state.blocks[k].length}</span> caracteres</small></article>`).join('')}</div><div class="card statusbar"><b>Avance</b><div class="progress"><span style="width:${completion()}%"></span></div><span>${completion()}%</span><small class="muted">Última actualización: ${new Date(state.updated).toLocaleString('es-CL')}</small></div>`}
function diagnosisPage(){const complete=completion(),filled=keys.filter(k=>state.blocks[k].trim()).length,words=keys.reduce((n,k)=>n+state.blocks[k].trim().split(/\s+/).filter(Boolean).length,0);const weak=keys.filter(k=>!state.blocks[k].trim()).map(k=>labels[k]);return `${head('Diagnóstico del modelo','Lectura estructural del Canvas actual.')}<div class="diagnostics"><div class="card diag"><strong>${complete}%</strong><span>completitud</span></div><div class="card diag"><strong>${filled}/9</strong><span>bloques desarrollados</span></div><div class="card diag"><strong>${words}</strong><span>palabras estratégicas</span></div></div><div class="advice"><div class="card panel"><h3>Observaciones automáticas</h3>${weak.length?`<div class="comment"><header>Brechas de contenido</header><p>Faltan: ${esc(weak.join(', '))}.</p></div>`:'<div class="comment"><header>Estructura completa</header><p>Todos los bloques contienen información. La siguiente prueba es coherencia causal, no cantidad de texto.</p></div>'}<div class="comment"><header>Prueba de propuesta de valor</header><p>${state.blocks.value.trim()?'Existe una formulación. Debe validarse con entrevistas, conversión y disposición a pagar.':'No existe una propuesta de valor explícita.'}</p></div><div class="comment"><header>Prueba económica</header><p>${state.blocks.costs.trim()&&state.blocks.revenue.trim()?'Costos e ingresos están declarados. Falta convertirlos en cifras mensuales y margen de contribución.':'El modelo económico está incompleto.'}</p></div></div><div class="card panel"><h3>Invariantes de validación</h3><div class="task"><input type="checkbox"><span>Entrevistar al menos 5 clientes por segmento prioritario.</span></div><div class="task"><input type="checkbox"><span>Registrar conversión por canal durante 30 días.</span></div><div class="task"><input type="checkbox"><span>Calcular ticket promedio, costo variable y margen de contribución.</span></div><div class="task"><input type="checkbox"><span>Contrastar la propuesta con 3 competidores directos.</span></div></div></div>`}
function advisoryPage(){return `${head('Asesoría colaborativa','Comentarios privados, acuerdos y tareas para acompañamiento empresarial.','<button class="btn primary" id="addComment">+ Comentario</button>')}<div class="advice"><div class="card panel"><h3>Comentarios</h3><div id="commentList">${state.comments.map(c=>`<div class="comment"><header><span>${esc(c.author)}</span><small>${new Date(c.date).toLocaleDateString('es-CL')}</small></header><p>${esc(c.text)}</p><small>Bloque: ${esc(c.block)}</small></div>`).join('')||'<div class="empty">Aún no hay comentarios.</div>'}</div></div><div class="card panel"><h3>Plan de trabajo</h3><div id="taskList">${state.tasks.map((t,i)=>`<label class="task"><input type="checkbox" data-task="${i}" ${t.done?'checked':''}><span>${esc(t.text)}<br><small class="muted">Responsable: ${esc(t.owner)}</small></span></label>`).join('')||'<div class="empty">No hay tareas.</div>'}</div><button class="btn" id="addTask" style="margin-top:12px">+ Nueva tarea</button></div></div>`}
function templatesPage(){const tm=[['Turismo receptivo','Canvas para excursiones, guías, agencias y experiencias territoriales.'],['Servicios profesionales','Consultoría, asesoría técnica y servicios empresariales B2B.'],['Comercio local','Tiendas, productores, artesanía y venta omnicanal.']];return `${head('Plantillas sectoriales','Puntos de partida editables. Cargar una plantilla reemplaza el Canvas actual.')}<div class="templates">${tm.map((x,i)=>`<div class="card template"><h3>${x[0]}</h3><p>${x[1]}</p><button class="btn" data-template="${i}">Usar plantilla</button></div>`).join('')}</div>`}
function versionsPage(){return `${head('Historial de versiones','Instantáneas locales utilizadas para comparar evolución del modelo.')}<div class="card panel versions"><table><thead><tr><th>Fecha</th><th>Estado</th><th>Avance</th><th>Acción</th></tr></thead><tbody>${state.versions.map(v=>`<tr><td>${new Date(v.date).toLocaleString('es-CL')}</td><td>${esc(v.stage)}</td><td>${v.completion}%</td><td><button class="btn" data-restore="${v.id}">Restaurar</button></td></tr>`).join('')||'<tr><td colspan="4" class="empty">No hay versiones guardadas.</td></tr>'}</tbody></table></div>`}
const pages={canvas:canvasPage,diagnosis:diagnosisPage,advisory:advisoryPage,templates:templatesPage,versions:versionsPage},titles={canvas:'Business Model Canvas',diagnosis:'Diagnóstico',advisory:'Asesoría',templates:'Plantillas',versions:'Versiones'};
function render(){route=location.hash.slice(1)||'canvas';if(!pages[route])route='canvas';$('#view').innerHTML=pages[route]();$('#topTitle').textContent=titles[route];document.querySelectorAll('[data-route]').forEach(b=>b.classList.toggle('active',b.dataset.route===route));bind()}
function modal(title,body,onSave){$('#overlay').innerHTML=`<div class="modalback"><div class="card modal"><div class="modalhead"><h3>${title}</h3><button class="iconbtn" data-close>×</button></div><form id="modalForm">${body}<div class="modalfoot"><button class="btn" type="button" data-close>Cancelar</button><button class="btn primary">Guardar</button></div></form></div></div>`;document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>$('#overlay').innerHTML='');$('#modalForm').onsubmit=e=>{e.preventDefault();onSave(new FormData(e.target));$('#overlay').innerHTML='';persist();render()}}
function bind(){document.querySelectorAll('[data-block]').forEach(t=>t.oninput=()=>{state.blocks[t.dataset.block]=t.value;document.querySelector(`[data-count="${t.dataset.block}"]`).textContent=t.value.length;persist();const pct=completion();$('.progress span').style.width=pct+'%';$('.statusbar>span').textContent=pct+'%'});['businessName','advisorName'].forEach(id=>{const el=$('#'+id);if(el)el.onchange=()=>{state[id==='businessName'?'business':'advisor']=el.value;persist()}});const stage=$('#stage');if(stage)stage.onchange=()=>{state.stage=stage.value;persist()};const ex=$('#loadExample');if(ex)ex.onclick=()=>{if(confirm('¿Reemplazar el Canvas actual por el ejemplo de turismo?')){state.blocks={...examples};persist(true);render();toast('Ejemplo cargado')}};const clear=$('#clearCanvas');if(clear)clear.onclick=()=>{if(confirm('¿Vaciar los nueve bloques?')){state.blocks=Object.fromEntries(keys.map(k=>[k,'']));persist(true);render()}};const snap=$('#snapshot');if(snap)snap.onclick=()=>{persist(true);toast('Versión creada')};const addComment=$('#addComment');if(addComment)addComment.onclick=()=>modal('Nuevo comentario',`<div class="field"><label>Bloque</label><select name="block">${keys.map(k=>`<option>${labels[k]}</option>`).join('')}</select></div><div class="field"><label>Comentario</label><textarea name="text" required></textarea></div>`,fd=>{state.comments.unshift({author:state.advisor,date:new Date().toISOString(),block:fd.get('block'),text:fd.get('text')})});const addTask=$('#addTask');if(addTask)addTask.onclick=()=>modal('Nueva tarea','<div class="field"><label>Tarea</label><input name="text" required></div><div class="field"><label>Responsable</label><input name="owner" required></div>',fd=>state.tasks.push({text:fd.get('text'),owner:fd.get('owner'),done:false}));document.querySelectorAll('[data-task]').forEach(x=>x.onchange=()=>{state.tasks[+x.dataset.task].done=x.checked;persist()});document.querySelectorAll('[data-template]').forEach(b=>b.onclick=()=>{if(!confirm('La plantilla reemplazará el contenido actual. ¿Continuar?'))return;const i=+b.dataset.template,stateTpl={...examples};if(i===1){stateTpl.value='Asesoría especializada con entregables claros, evidencia y acompañamiento profesional.';stateTpl.channels='OpenDirectory\nLinkedIn\nReferidos\nLicitaciones';stateTpl.segments='Pymes\nOrganizaciones públicas\nONG\nEmpresas regionales'}if(i===2){stateTpl.value='Productos locales trazables, disponibles en tienda y canales digitales.';stateTpl.channels='Tienda física\nOpenDirectory\nInstagram\nDespacho local';stateTpl.segments='Residentes\nTuristas\nCompradores institucionales'}state.blocks=stateTpl;persist(true);location.hash='canvas';toast('Plantilla aplicada')});document.querySelectorAll('[data-restore]').forEach(b=>b.onclick=()=>{const v=state.versions.find(x=>x.id===+b.dataset.restore);if(v&&confirm('¿Restaurar esta versión?')){state.blocks=JSON.parse(JSON.stringify(v.blocks));state.stage=v.stage;persist();location.hash='canvas';toast('Versión restaurada')}})}
function exportJSON(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`canvas-${state.business.toLowerCase().replace(/[^a-z0-9]+/gi,'-')}.json`;a.click();URL.revokeObjectURL(a.href);toast('Canvas exportado en JSON')}
$('#nav').onclick=e=>{const r=e.target.closest('[data-route]'),a=e.target.closest('[data-action]');if(r){location.hash=r.dataset.route;$('#sidebar').classList.remove('open')}if(a){const file=a.dataset.action==='directory'?'opendirectory.html':'opendirectory-admin-spa.html';location.href=file}};window.addEventListener('hashchange',render);$('#menuBtn').onclick=()=>$('#sidebar').classList.toggle('open');$('#themeBtn').onclick=()=>{const d=document.documentElement.dataset.theme==='dark';document.documentElement.dataset.theme=d?'light':'dark';localStorage.setItem('od-canvas-theme',d?'light':'dark')};document.documentElement.dataset.theme=localStorage.getItem('od-canvas-theme')||'light';$('#saveBtn').onclick=()=>{persist(true);toast('Canvas guardado')};$('#exportBtn').onclick=()=>modal('Exportar Canvas','<div class="field"><label>Formato</label><select name="format"><option value="json">JSON estructurado</option><option value="print">Imprimir / Guardar como PDF</option></select></div>',fd=>fd.get('format')==='json'?exportJSON():setTimeout(()=>window.print(),100));render();
})();
</script>
</body>
</html>
